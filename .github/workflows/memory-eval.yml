name: memory-eval

# SM-X7 (#143): wires the memory eval harness's own CI template
# (benchmarks/memory_eval/ci/memory-eval.yml, SM-R13 #88) into real CI. Two tiers:
#
# smoke - offline, deterministic, ZERO LLM spend. Runs the stdlib-only fixtures
#         through the reference provider and enforces harness/gate.py. Gated on
#         the `run-ci` label on a PR (this repo's cost-control convention -
#         mirrors ci.yml), unconditional on push/workflow_dispatch.
# full  - real corpora + the real LLM judge (secrets). Scheduled/manual only -
#         never runs on a PR - since a full run needs a human license/budget
#         check per benchmarks/memory_eval/findings/01-data-quality-and-licensing.md.

on:
  push:
    branches:
      - main
    paths:
      - "benchmarks/memory_eval/**"
      - "libs/agno/egpt/eval/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "benchmarks/memory_eval/**"
      - "libs/agno/egpt/eval/**"
  schedule:
    - cron: "0 6 * * 1" # weekly full run, Monday 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: memory-eval-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    # Offline, deterministic, no secrets.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `egpt` is installed *for the smoke job too*, not only for `full`. Without it,
      # test_suite_adapter.py and test_suite_run.py hit their `find_spec("egpt")` guard and
      # return having asserted nothing -- exit 0, job green, AC1 unproven. That is the failure
      # mode aicoe-tracker#75's suite shipped with, and this workflow exists to avoid it.
      # `--no-deps` keeps the offline promise: no SDK, no network at test time.
      - name: Install egpt (needed by the suite-wiring tests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e libs/agno
      - name: Unit tests (metrics + runner + suite adapter/wiring)
        working-directory: benchmarks/memory_eval
        run: |
          python tests/test_metrics.py
          python tests/test_runner.py
          python tests/test_suite_adapter.py
          python tests/test_suite_run.py
      - name: Offline smoke + gate (reference provider)
        working-directory: benchmarks/memory_eval
        run: python run.py --mode fixture --benchmark all --provider recency_decay
      - uses: actions/upload-artifact@v4
        with:
          name: memory-eval-smoke
          path: benchmarks/memory_eval/results/*

  full:
    # Real corpora + real LLM judge. Scheduled/manual only - never on a PR (costs
    # tokens, and needs a per-run license/URL check per findings/01).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_LLM_MODE: live
      HARNESS_JUDGE_MODEL: ${{ vars.HARNESS_JUDGE_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps (egpt + openai)
        run: ./scripts/dev_setup.sh
      - name: Full run + gate
        working-directory: benchmarks/memory_eval
        run: |
          . ../../.venv/bin/activate
          python run.py --mode full --benchmark longmemeval --provider recency_decay --judge llm
      - uses: actions/upload-artifact@v4
        with:
          name: memory-eval-full
          path: benchmarks/memory_eval/results/*
