name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    # The async-MySQL suite rotted for the whole life of the repo because nothing ever
    # ran it (aicoe-tracker#154). Credentials mirror cookbook/scripts/run_mysql.sh, and
    # deliberately reproduce the stock-image grants (ai has rights on `ai`.* only) that
    # the suite must work within.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ai
          MYSQL_DATABASE: ai
          MYSQL_USER: ai
          MYSQL_PASSWORD: ai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The DB-defined agent registry (EGPT-2.10) is mandatory and high-risk, and until now
      # every suite that proves it against a real Postgres was skipped here: the gate is
      # EGPT_INTEGRATION_POSTGRES, which nothing set. Six directories -- db/postgres,
      # db/async_postgres, and os/{tenancy,hydration,audit,seeding}_postgres -- reported green
      # by never running. Same failure mode as aicoe-tracker#154, one backend over.
      #
      # The port mapping is load-bearing, not a preference: the engine URL in
      # libs/agno/tests/integration/conftest.py is hardcoded to localhost:5532, as are
      # cookbook/scripts/run_pgvector.sh and the async_postgres conftest. The image matches
      # run_pgvector.sh so CI and a local run exercise the same server.
      #
      # The healthcheck matters more than usual here. With EGPT_INTEGRATION_POSTGRES set, the
      # `postgres_engine` fixture probes with SELECT 1 during setup and *errors* rather than
      # skips when nothing is listening -- so a slow start would surface as a wall of failures
      # rather than as a wait.
      postgres:
        image: agnohq/pgvector:18
        env:
          POSTGRES_DB: ai
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
        ports:
          - 5532:5432
        options: >-
          --health-cmd "pg_isready -U ai -d ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/agno[integration-tests,tests]
          uv pip install brave-search --no-deps

      - name: Run integration tests
        working-directory: .
        env:
          EGPT_TELEMETRY: false
          EGPT_INTEGRATION_MYSQL: "1"
          EGPT_INTEGRATION_POSTGRES: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CO_API_KEY: ${{ secrets.CO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          IBM_WATSONX_API_KEY: ${{ secrets.IBM_WATSONX_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          COMETAPI_KEY: ${{ secrets.COMETAPI_KEY }}
          AIMLAPI_API_KEY: ${{ secrets.AIMLAPI_API_KEY }}
          LANGDB_API_KEY: ${{ secrets.LANGDB_API_KEY }}
          V0_API_KEY: ${{ secrets.V0_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -e
          source .venv/bin/activate
          python -m pytest libs/agno/tests/integration -m integration -v --tb=short

  system:
    name: system (py3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # secrets can't be read in a job-level `if:`, so gate the run step on an
      # env value mapped from the secret instead.
      - name: Check for system-test credentials
        id: creds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY not set; skipping system tests"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system test dependencies
        if: steps.creds.outputs.run == 'true'
        working-directory: libs/agno/tests/system
        run: |
          set -e
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -r requirements.txt

      - name: Run system tests
        if: steps.creds.outputs.run == 'true'
        working-directory: libs/agno/tests/system
        env:
          EGPT_TELEMETRY: false
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          chmod +x run_tests.sh
          ./run_tests.sh --down
