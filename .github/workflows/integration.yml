name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    # The async-MySQL suite rotted for the whole life of the repo because nothing ever
    # ran it (aicoe-tracker#154). Credentials mirror cookbook/scripts/run_mysql.sh, and
    # deliberately reproduce the stock-image grants (ai has rights on `ai`.* only) that
    # the suite must work within.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ai
          MYSQL_DATABASE: ai
          MYSQL_USER: ai
          MYSQL_PASSWORD: ai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The DB-defined agent registry (EGPT-2.10) is mandatory and high-risk, and until now
      # every suite that proves it against a real Postgres was skipped here: the gate is
      # EGPT_INTEGRATION_POSTGRES, which nothing set. Six directories -- db/postgres,
      # db/async_postgres, and os/{tenancy,hydration,audit,seeding}_postgres -- reported green
      # by never running. Same failure mode as aicoe-tracker#154, one backend over.
      #
      # The port mapping is load-bearing, not a preference: the engine URL in
      # libs/agno/tests/integration/conftest.py is hardcoded to localhost:5532, as are
      # cookbook/scripts/run_pgvector.sh and the async_postgres conftest. The image matches
      # run_pgvector.sh so CI and a local run exercise the same server.
      #
      # The healthcheck matters more than usual here. With EGPT_INTEGRATION_POSTGRES set, the
      # `postgres_engine` fixture probes with SELECT 1 during setup and *errors* rather than
      # skips when nothing is listening -- so a slow start would surface as a wall of failures
      # rather than as a wait.
      postgres:
        image: agnohq/pgvector:18
        env:
          POSTGRES_DB: ai
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
        ports:
          - 5532:5432
        options: >-
          --health-cmd "pg_isready -U ai -d ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The memory subsystem's graph substrate (SM-G1 #99) and its real-backend proofs
      # (test_mode_a.py's SM-X1 #137, and the full write -> consolidate -> retrieve -> inject
      # loop in test_e2e_symbiotic_loop.py, SM-X10 #146) are gated on EGPT_INTEGRATION_NEO4J,
      # which nothing here set -- so, same failure mode as the postgres block's own comment
      # above, one substrate over, both suites reported green by never running in CI. Community
      # edition, matching cookbook/scripts/run_neo4j.sh and SM-R2's ratification for CI use; the
      # port mapping and password mirror that script so a local run and CI exercise the same
      # server. The healthcheck hits the container's own port (not the host-mapped one --
      # options: healthchecks run inside the service container's network namespace).
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/smg1testpassword
        ports:
          - 7691:7687
          - 7476:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          # One resolve for the framework and the product: product pins egpt[os] to this
          # checkout's version, and a public-PyPI package of the same name would win a
          # separate resolve (see product/pyproject.toml). R-9: the semantic layer's live suite
          # lives under product/tests and this job is the only place it can run against real
          # Postgres and Neo4j.
          uv pip install -e libs/agno[integration-tests,tests] -e product
          uv pip install brave-search --no-deps

      - name: Run integration tests
        working-directory: .
        env:
          EGPT_TELEMETRY: false
          EGPT_INTEGRATION_MYSQL: "1"
          EGPT_INTEGRATION_POSTGRES: "1"
          EGPT_INTEGRATION_PGVECTOR: "1"
          EGPT_INTEGRATION_NEO4J: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CO_API_KEY: ${{ secrets.CO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          IBM_WATSONX_API_KEY: ${{ secrets.IBM_WATSONX_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          COMETAPI_KEY: ${{ secrets.COMETAPI_KEY }}
          AIMLAPI_API_KEY: ${{ secrets.AIMLAPI_API_KEY }}
          LANGDB_API_KEY: ${{ secrets.LANGDB_API_KEY }}
          V0_API_KEY: ${{ secrets.V0_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -e
          source .venv/bin/activate
          python -m pytest libs/agno/tests/integration -m integration -v --tb=short

      # R-9. product/tests/test_semantic_live.py harvests the warehouse's `silver` schema
      # into a snapshot and the graph, so it needs what the compose stack gives a laptop and
      # the pgvector service above does not: the separate egpt_warehouse database (D5) with
      # R4's silver DDL applied. Both are created here, by the product's own entrypoint, so
      # CI provisions the warehouse the same way a deployment does. The suite is gated on the
      # same EGPT_INTEGRATION_* variables as the framework's and cleans up after itself.
      - name: Provision the warehouse for the semantic live suite
        # Independent of the framework integration step above, which has been red on
        # main's schedule for days on unrelated framework tests; a skip here would
        # hide the product suite behind a failure it has nothing to do with.
        if: ${{ !cancelled() }}
        env:
          EGPT_RETAIL_WAREHOUSE_DB_URL: postgresql+psycopg://ai:ai@localhost:5532/egpt_warehouse
        run: |
          set -e
          source .venv/bin/activate
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://ai:ai@localhost:5532/ai", autocommit=True) as conn:
              exists = conn.execute(
                  "SELECT 1 FROM pg_database WHERE datname = 'egpt_warehouse'"
              ).fetchone()
              if not exists:
                  conn.execute("CREATE DATABASE egpt_warehouse OWNER ai")
          PY
          python -m egpt_retail.entrypoints warehouse-migrate

      - name: Run the semantic layer live suite
        # Independent of the framework integration step above, which has been red on
        # main's schedule for days on unrelated framework tests; a skip here would
        # hide the product suite behind a failure it has nothing to do with.
        if: ${{ !cancelled() }}
        env:
          EGPT_TELEMETRY: false
          EGPT_INTEGRATION_POSTGRES: "1"
          EGPT_INTEGRATION_NEO4J: "1"
          # The suite's defaults are the compose stack's ports. The services above expose
          # Postgres on 5532 (matching) and Neo4j on 7691 with its own password (not).
          EGPT_ONTOLOGY_NEO4J_URI: neo4j://localhost:7691
          EGPT_RETAIL_NEO4J_URI: neo4j://localhost:7691
          EGPT_RETAIL_NEO4J_PASSWORD: smg1testpassword
          # test_semantic_live.py connects with raw psycopg, not through RetailSettings, and
          # reads EGPT_RETAIL_CP_DSN / EGPT_RETAIL_WAREHOUSE_DSN (bare postgresql:// scheme) --
          # not the EGPT_RETAIL_*_DB_URL names used by the entrypoints above. Confirmed by
          # reading the test's own os.environ.get calls, lines 47-52.
          EGPT_RETAIL_CP_DSN: postgresql://ai:ai@localhost:5532/ai
          EGPT_RETAIL_WAREHOUSE_DSN: postgresql://ai:ai@localhost:5532/egpt_warehouse
          # R-15. test_r15_rehearsal_live.py -- RehearsalReviewStore against a real Postgres,
          # its own DSN var (EGPT_RETAIL_R15_DSN), same "ai" control-plane database this job
          # already provisions. Round-2 review, PR #212: this file's safety-critical coverage
          # (the pending-only re-decide guard, record_run's conditional-reset CASE WHEN, the
          # RETURNING-based fix for the commit/read-back race) was previously never named in
          # any CI invocation, so EGPT_INTEGRATION_POSTGRES being unset elsewhere skipped it
          # silently everywhere.
          EGPT_RETAIL_R15_DSN: postgresql://ai:ai@localhost:5532/ai
          # #229/#231/#240. test_kpis_live.py -- KpiRegistryStore.feasibility against this same
          # real semantic graph, the create/update/delete round trips, and the optimistic-
          # concurrency/dashboard-reference race coverage #240's review added -- was never
          # named in any CI invocation either, so EGPT_INTEGRATION_POSTGRES/NEO4J being unset
          # elsewhere skipped it silently, the same failure mode this job's other product
          # suites document above, one router over. Needs no env vars of its own: its own
          # control-plane connection reads EGPT_RETAIL_CP_DSN (above, this job's Postgres), and
          # the feasibility routes it exercises go through RetailSettings/open_semantic_reader,
          # which pick up this step's own EGPT_RETAIL_NEO4J_URI/_PASSWORD (also above) and
          # RetailSettings' control-plane default, which already matches this job's Postgres.
          # #304. test_p0_data_sources_live.py -- DataSourceStore and LocalEncryptedSecretStore
          # against this job's Postgres: the credential guarantees (no credential on the row,
          # ciphertext never holds the plaintext, rotation and delete remove the old secret),
          # update validation, the concurrent-rotation race, the async twins and the enum
          # CHECK constraints. Until it was named here those guarantees were proved only by
          # the manually-run P0 cookbook. Reads EGPT_RETAIL_CP_DSN (above); needs nothing else.
          # Contract 1.2.9. test_kpi_suggestions_live.py -- SuggestionRunStore.current() (the
          # newest successful run of each source, the failure a later success got past, the
          # stale-run guard) and SuggestionDismissalStore, against this job's Postgres. Needs
          # only EGPT_RETAIL_CP_DSN (above).
        run: |
          set -e
          source .venv/bin/activate
          python -m pytest product/tests/test_semantic_live.py product/tests/test_r15_rehearsal_live.py product/tests/test_kpis_live.py product/tests/test_p0_data_sources_live.py product/tests/test_kpi_suggestions_live.py -v --tb=short

  system:
    name: system (py3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # secrets can't be read in a job-level `if:`, so gate the run step on an
      # env value mapped from the secret instead.
      - name: Check for system-test credentials
        id: creds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY not set; skipping system tests"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system test dependencies
        if: steps.creds.outputs.run == 'true'
        working-directory: libs/agno/tests/system
        run: |
          set -e
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -r requirements.txt

      - name: Run system tests
        if: steps.creds.outputs.run == 'true'
        working-directory: libs/agno/tests/system
        env:
          EGPT_TELEMETRY: false
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          chmod +x run_tests.sh
          ./run_tests.sh --down
