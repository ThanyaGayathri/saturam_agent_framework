name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/agnoctl[dev] -e libs/agno[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./scripts/validate.sh

  validate-agno-infra:
    name: validate agno_infra (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/agno_infra[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./libs/agno_infra/scripts/validate.sh

  test-and-build:
    name: test-and-build (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: agno
            working-directory: libs/agno
            python-version: "3.10"
          - package: agno
            working-directory: libs/agno
            python-version: "3.12"
          - package: agnoctl
            working-directory: libs/agnoctl
            python-version: "3.10"
          - package: agnoctl
            working-directory: libs/agnoctl
            python-version: "3.12"
          - package: agno_infra
            working-directory: libs/agno_infra
            python-version: "3.10"
          - package: agno_infra
            working-directory: libs/agno_infra
            python-version: "3.12"

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install agno dependencies
        if: matrix.package == 'agno'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e ../agnoctl -e .[tests]
          uv pip install brave-search --no-deps
          uv pip install build pytest-cov

      - name: Install agnoctl dependencies
        if: matrix.package == 'agnoctl'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Install agno_infra dependencies
        if: matrix.package == 'agno_infra'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Run agno tests
        if: matrix.package == 'agno'
        working-directory: .
        env:
          AGNO_TELEMETRY: false
        run: |
          set -e
          source .venv/bin/activate
          python -m pytest \
            --cov=agno \
            --cov-report=json:coverage-agno.json \
            ./libs/agno/tests/unit \
            --ignore=libs/agno/tests/unit/models/litellm \
            --ignore=libs/agno/tests/unit/tools/test_crawl4ai.py \
            --ignore=libs/agno/tests/unit/tools/test_scrapegraph.py

      - name: Run agnoctl tests
        if: matrix.package == 'agnoctl'
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m pytest ./tests

      - name: Run agno_infra tests
        if: matrix.package == 'agno_infra'
        run: |
          set -e
          source ../../.venv/bin/activate
          ./scripts/test.sh

      - name: Build package
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m build

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
      - validate
      - validate-agno-infra
      - test-and-build
    if: always()
    steps:
      - name: Require all jobs
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "validate failed: ${{ needs.validate.result }}"
            exit 1
          fi
          if [[ "${{ needs.validate-agno-infra.result }}" != "success" ]]; then
            echo "validate-agno-infra failed: ${{ needs.validate-agno-infra.result }}"
            exit 1
          fi
          if [[ "${{ needs.test-and-build.result }}" != "success" ]]; then
            echo "test-and-build failed: ${{ needs.test-and-build.result }}"
            exit 1
          fi
