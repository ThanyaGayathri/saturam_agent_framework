name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/egptctl[dev] -e libs/agno[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./scripts/validate.sh

  validate-egpt-infra:
    name: validate egpt-infra (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/agno_infra[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./libs/agno_infra/scripts/validate.sh

  test-and-build:
    name: test-and-build (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: egpt
            working-directory: libs/agno
            python-version: "3.10"
          - package: egpt
            working-directory: libs/agno
            python-version: "3.12"
          - package: egptctl
            working-directory: libs/egptctl
            python-version: "3.10"
          - package: egptctl
            working-directory: libs/egptctl
            python-version: "3.12"
          - package: egpt-infra
            working-directory: libs/agno_infra
            python-version: "3.10"
          - package: egpt-infra
            working-directory: libs/agno_infra
            python-version: "3.12"

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install egpt dependencies
        if: matrix.package == 'egpt'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[tests]
          uv pip install brave-search --no-deps
          uv pip install build pytest-cov
          # A fake third-party integration package, installed so the EGPT-1.9 entry-point
          # tests exercise the real .dist-info path. It also proves the layer guards read
          # `declarations` and not `entries`: it registers a provider under four kinds, and
          # a guard measuring third-party rows against this repo's integrations tree fails.
          uv pip install -e tests/fixtures/egpt_dummy_provider

      - name: Install egptctl dependencies
        if: matrix.package == 'egptctl'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Install egpt-infra dependencies
        if: matrix.package == 'egpt-infra'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Run egpt tests
        if: matrix.package == 'egpt'
        working-directory: .
        env:
          EGPT_TELEMETRY: false
          # Turns on the env-gated out-of-tree discovery tests (EGPT-1.9 AC4). They skip
          # without this so a local `pytest` stays green with no fixture installed; the gate
          # is what stops that convenience from disabling the criterion in CI.
          EGPT_TEST_ENTRY_POINTS: "1"
        run: |
          set -e
          source .venv/bin/activate
          # -n auto: the unit suite is ~10k tests; serial execution dominated CI wall-clock.
          # --dist loadfile keeps a module's tests on one worker, so module-scoped fixtures
          # and the asyncio_mode="auto" per-file event loops behave as they do serially.
          # --timeout turns a wedged test into a loud failure instead of a job that runs
          # until the runner's own limit; 180s is well above the slowest legitimate test.
          # --max-worker-restart=0: when a worker dies (OOM, execnet transport failure,
          # pytest-timeout killing a wedged test), xdist's default is to replace it and
          # keep going. On py3.10 that recovery has hung at ~99% until the job timeout,
          # burning 25 minutes with no FAILED summary. Fail fast instead.
          # log_cli stays on for local runs (it is set in pyproject.toml) but is turned off here:
          # under -n it interleaves across workers, and it emitted ~24k lines per CI run.
          python -m pytest \
            -n auto --dist loadfile \
            --max-worker-restart=0 \
            --timeout=180 --timeout-method=thread \
            -o log_cli=false \
            -p no:cacheprovider \
            -m "not integration and not system" \
            --cov=egpt \
            --cov-report=json:coverage-egpt.json \
            --cov-report=term \
            ./libs/agno/tests/unit

      - name: Publish unit coverage summary
        if: matrix.package == 'egpt' && matrix.python-version == '3.12'
        working-directory: .
        run: |
          set -e
          TOTAL=$(python -c "import json; d=json.load(open('coverage-egpt.json')); print(f'{d[\"totals\"][\"percent_covered\"]:.2f}')")
          echo "## Unit test coverage (EGPT-0.10 PR gate)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: **${TOTAL}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "Suite: \`libs/agno/tests/unit\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit coverage artifact
        if: matrix.package == 'egpt'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-egpt-py${{ matrix.python-version }}
          path: coverage-egpt.json
          if-no-files-found: error

      - name: Run egptctl tests
        if: matrix.package == 'egptctl'
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m pytest ./tests

      - name: Run egpt-infra tests
        if: matrix.package == 'egpt-infra'
        run: |
          source ../../.venv/bin/activate
          set +e
          python -m pytest tests
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No egpt-infra tests found; skipping."
            exit 0
          fi
          exit "$code"

      - name: Build package
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m build

  import-linter:
    # EGPT-1.11 (aicoe-tracker#52): encodes the integrations-boundary cells of ADR 0001's
    # allowed-import matrix (docs/adr/0001-layered-architecture.md) as import-linter contracts
    # in libs/agno/pyproject.toml. Deliberately NOT in ci-success's `needs` (and not required by
    # branch protection) yet: the contracts have no `ignore_imports` for the known debt tracked
    # in libs/agno/tests/unit/test_import_linter_contracts.py (aicoe-tracker#157, #158, #180),
    # so `lint-imports` genuinely fails against `main` today.
    # That test IS part of the required `test-and-build` job and fails on any violation outside
    # the tracked set, so regressions are still caught; this job exists to make the raw contract
    # state visible on every PR. Once the tracked set is empty, promote this to ci-success's
    # `needs` list -- at that point `lint-imports` and the tracked-set test both go green
    # together and this job becomes the literal "CI fails on any cross-layer import violation"
    # gate the issue's acceptance criteria ask for.
    name: import-linter (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: libs/agno
        run: |
          set -e
          uv venv ../../.venv --python 3.12
          source ../../.venv/bin/activate
          uv pip install -e .[dev]

      - name: Run lint-imports
        working-directory: libs/agno
        run: |
          set -e
          source ../../.venv/bin/activate
          lint-imports

  unit-drivers-absent:
    # A unit test that needs an optional driver must gate on it (pytest.importorskip) so it
    # SKIPS where the driver is absent. `test-and-build` structurally cannot catch a missed
    # gate: it installs .[tests], which transitively pulls in every driver, so an ungated
    # test passes there and only breaks for someone who installed a subset. Five such
    # regressions shipped and all five were caught by a human reading the diff
    # (aicoe-tracker#161). This job is the machine that reads the diff.
    name: unit-drivers-absent
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install egpt without the backend drivers
        working-directory: libs/agno
        run: |
          set -e
          uv venv ../../.venv --python 3.12
          source ../../.venv/bin/activate
          uv pip install -e .[tests]
          uv pip install brave-search --no-deps
          uv pip install -e tests/fixtures/egpt_dummy_provider
          # Remove exactly the storage/vectordb/channel/SaaS-SDK drivers, keeping everything
          # else test-and-build installs. Expressed as an uninstall rather than a lean extra
          # because the extras self-reference heavily (tests -> dev -> slack -> ...), so
          # subtracting after the fact is the only reliable way to express "minus drivers".
          # uv warns and exits 0 for anything not installed, so this stays correct as the
          # extras change.
          #
          # Invariant: one entry per driver family gated in tests/unit; extend this list when
          # gating a new family, or the gates and the job that enforces them drift apart and
          # the job goes blind to exactly the family it should be checking.
          uv pip uninstall \
            aioboto3 \
            aiosqlite \
            asyncmy \
            asyncpg \
            boto3 \
            botocore \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            lancedb \
            psycopg \
            psycopg-binary \
            psycopg2-binary \
            pymysql \
            redshift-connector \
            slack-sdk \
            weaviate-client

      - name: Run unit tests with drivers absent
        env:
          EGPT_TELEMETRY: false
          EGPT_TEST_ENTRY_POINTS: "1"
        run: |
          set -e
          source .venv/bin/activate
          # Skips are the expected outcome here. Failures and collection errors are not:
          # each one is a test that forgot its gate.
          python -m pytest \
            -n auto --dist loadfile \
            --max-worker-restart=0 \
            --timeout=180 --timeout-method=thread \
            -o log_cli=false \
            -p no:cacheprovider \
            -m "not integration and not system" \
            ./libs/agno/tests/unit

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
      - validate
      - validate-egpt-infra
      - test-and-build
      - unit-drivers-absent
    # always() is intentional: without it, this job is skipped when an upstream
    # job fails, and GitHub branch protection treats "skipped" as "passed".
    # The shell checks below enforce the real result.
    if: always()
    steps:
      - name: Require all jobs
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "validate failed: ${{ needs.validate.result }}"
            exit 1
          fi
          if [[ "${{ needs.validate-egpt-infra.result }}" != "success" ]]; then
            echo "validate-egpt-infra failed: ${{ needs.validate-egpt-infra.result }}"
            exit 1
          fi
          if [[ "${{ needs.test-and-build.result }}" != "success" ]]; then
            echo "test-and-build failed: ${{ needs.test-and-build.result }}"
            exit 1
          fi
          if [[ "${{ needs.unit-drivers-absent.result }}" != "success" ]]; then
            echo "unit-drivers-absent failed: ${{ needs.unit-drivers-absent.result }}"
            exit 1
          fi
