name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/egptctl[dev] -e libs/agno[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./scripts/validate.sh

  validate-egpt-infra:
    name: validate egpt-infra (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/agno_infra[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./libs/agno_infra/scripts/validate.sh

  test-and-build:
    name: test-and-build (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: egpt
            working-directory: libs/agno
            python-version: "3.10"
            pytest-extra-ignores: >-
              --ignore=libs/agno/tests/unit/os/test_traces_remote_ownership.py
              --ignore=libs/agno/tests/unit/os/test_jwt_middleware_helpers.py
              --ignore=libs/agno/tests/unit/os/test_ws_jwt_config.py
          - package: egpt
            working-directory: libs/agno
            python-version: "3.12"
            pytest-extra-ignores: ""
          - package: egptctl
            working-directory: libs/egptctl
            python-version: "3.10"
            pytest-extra-ignores: ""
          - package: egptctl
            working-directory: libs/egptctl
            python-version: "3.12"
            pytest-extra-ignores: ""
          - package: egpt-infra
            working-directory: libs/agno_infra
            python-version: "3.10"
            pytest-extra-ignores: ""
          - package: egpt-infra
            working-directory: libs/agno_infra
            python-version: "3.12"
            pytest-extra-ignores: ""

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install egpt dependencies
        if: matrix.package == 'egpt'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e ../egptctl -e .[tests]
          uv pip install brave-search --no-deps
          uv pip install build pytest-cov

      - name: Install egptctl dependencies
        if: matrix.package == 'egptctl'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Install egpt-infra dependencies
        if: matrix.package == 'egpt-infra'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Run egpt tests
        if: matrix.package == 'egpt'
        working-directory: .
        env:
          AGNO_TELEMETRY: false
        run: |
          set -e
          source .venv/bin/activate
          python -m pytest \
            --cov=egpt \
            --cov-report=json:coverage-egpt.json \
            ./libs/agno/tests/unit \
            --ignore=libs/agno/tests/unit/models/litellm \
            --ignore=libs/agno/tests/unit/tools/test_crawl4ai.py \
            --ignore=libs/agno/tests/unit/tools/test_scrapegraph.py \
            ${{ matrix.pytest-extra-ignores }}

      - name: Run egptctl tests
        if: matrix.package == 'egptctl'
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m pytest ./tests

      - name: Run egpt-infra tests
        if: matrix.package == 'egpt-infra'
        run: |
          source ../../.venv/bin/activate
          set +e
          python -m pytest tests
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No egpt-infra tests found; skipping."
            exit 0
          fi
          exit "$code"

      - name: Build package
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m build

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
      - validate
      - validate-egpt-infra
      - test-and-build
    # always() is intentional: without it, this job is skipped when an upstream
    # job fails, and GitHub branch protection treats "skipped" as "passed".
    # The shell checks below enforce the real result.
    if: always()
    steps:
      - name: Require all jobs
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "validate failed: ${{ needs.validate.result }}"
            exit 1
          fi
          if [[ "${{ needs.validate-egpt-infra.result }}" != "success" ]]; then
            echo "validate-egpt-infra failed: ${{ needs.validate-egpt-infra.result }}"
            exit 1
          fi
          if [[ "${{ needs.test-and-build.result }}" != "success" ]]; then
            echo "test-and-build failed: ${{ needs.test-and-build.result }}"
            exit 1
          fi
