name: CI

on:
  push:
    branches:
      - main
  # PR runs are gated on the `run-ci` label to cut Actions spend on this repo's high PR
  # volume: an unlabeled PR costs one ~10s ci-success job (which fails, asking for the label);
  # adding the label fires the `labeled` event and runs the full suite. The trigger has to
  # stay `pull_request` -- GitHub only counts check suites from pull_request/push events
  # toward a PR's required status checks, so a workflow_dispatch run on the PR branch never
  # satisfies the required `ci-success` check no matter how green it is.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  # Ad-hoc runs on any branch. These show on the commit but do NOT satisfy PR checks (above).
  workflow_dispatch:

concurrency:
  # event_name is included so a manual workflow_dispatch run on main doesn't
  # share a group with (and get silently cancelled by, or silently cancel) an
  # automatic push run on main -- they'd otherwise collide on the same
  # ci-refs/heads/main group.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # PR runs only: cancelling an in-progress push run on `main` is not safe here. dorny/paths-filter
  # on a push compares only the commits in that push (`github.event.before`), so a push A (Python
  # change) cancelled by a fast-following push B (docs-only) would mean A's Python changes never
  # ran on main -- B's filter output covers only B's own commits and reports `python: false`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The heavy jobs share one gate, repeated verbatim on each because job-level `if` cannot read
# workflow `env` and YAML anchors are not supported here:
#   github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
# i.e. always run on push/workflow_dispatch; on a PR, only when it carries the run-ci label.
jobs:
  # Path filters as a job, never as workflow-level `paths:`. `ci-success` is the required branch
  # protection check; a workflow that does not run does not report, and a frontend-only PR would
  # be permanently un-mergeable. So this job always runs, says what changed, the heavy Python jobs
  # gate on `python == 'true'`, and ci-success accepts their `skipped` result only in that case.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter calls the GitHub REST API to list a PR's changed files, which needs
    # pull-requests: read on GITHUB_TOKEN. The repo's ambient default token permissions don't
    # cover that scope, so without this block the API call 403s ("Resource not accessible by
    # integration"), the job fails, and every downstream job gets skipped. A job-level
    # `permissions:` block replaces the ambient default entirely, so contents: read has to be
    # listed too -- it's what the checkout step below needs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'libs/**'
              - 'product/**'
              - 'cookbook/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'pyproject.toml'
            frontend:
              - 'frontend/**'
            deploy:
              - 'deploy/**'

  validate:
    name: validate (${{ matrix.python-version }})
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/egptctl[dev] -e libs/agno[dev] -e product[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./scripts/validate.sh

  validate-egpt-infra:
    name: validate egpt-infra (${{ matrix.python-version }})
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          set -e
          uv venv .venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e libs/agno_infra[dev]

      - name: Run validate
        run: |
          set -e
          source .venv/bin/activate
          ./libs/agno_infra/scripts/validate.sh

  test-and-build:
    name: test-and-build (${{ matrix.package }}, py${{ matrix.python-version }})
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # egpt's own suite (py3.10 and py3.12 both) has been observed at 23-25m on a slow runner,
    # tipping over the old 25m ceiling and failing the job with nothing actually wrong --
    # egptctl/egpt-infra finish in under a minute regardless, so raising this for the whole
    # matrix costs them nothing.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: egpt
            working-directory: libs/agno
            python-version: "3.10"
          - package: egpt
            working-directory: libs/agno
            python-version: "3.12"
          - package: egptctl
            working-directory: libs/egptctl
            python-version: "3.10"
          - package: egptctl
            working-directory: libs/egptctl
            python-version: "3.12"
          - package: egpt-infra
            working-directory: libs/agno_infra
            python-version: "3.10"
          - package: egpt-infra
            working-directory: libs/agno_infra
            python-version: "3.12"

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install egpt dependencies
        if: matrix.package == 'egpt'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[tests]
          uv pip install brave-search --no-deps
          uv pip install build pytest-cov
          uv pip install -e ../../product[dev]
          # A fake third-party integration package, installed so the EGPT-1.9 entry-point
          # tests exercise the real .dist-info path. It also proves the layer guards read
          # `declarations` and not `entries`: it registers a provider under four kinds, and
          # a guard measuring third-party rows against this repo's integrations tree fails.
          uv pip install -e tests/fixtures/egpt_dummy_provider

      - name: Install egptctl dependencies
        if: matrix.package == 'egptctl'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Install egpt-infra dependencies
        if: matrix.package == 'egpt-infra'
        run: |
          set -e
          uv venv ../../.venv --python "${{ matrix.python-version }}"
          source ../../.venv/bin/activate
          uv pip install -e .[dev]
          uv pip install build

      - name: Run egpt tests
        if: matrix.package == 'egpt'
        working-directory: .
        env:
          EGPT_TELEMETRY: false
          # Turns on the env-gated out-of-tree discovery tests (EGPT-1.9 AC4). They skip
          # without this so a local `pytest` stays green with no fixture installed; the gate
          # is what stops that convenience from disabling the criterion in CI.
          EGPT_TEST_ENTRY_POINTS: "1"
        run: |
          set -e
          source .venv/bin/activate
          # -n auto: the unit suite is ~10k tests; serial execution dominated CI wall-clock.
          # --dist loadfile keeps a module's tests on one worker, so module-scoped fixtures
          # and the asyncio_mode="auto" per-file event loops behave as they do serially.
          # --timeout turns a wedged test into a loud failure instead of a job that runs
          # until the runner's own limit; 180s is well above the slowest legitimate test.
          # --max-worker-restart=0: when a worker dies (OOM, execnet transport failure,
          # pytest-timeout killing a wedged test), xdist's default is to replace it and
          # keep going. On py3.10 that recovery has hung at ~99% until the job timeout,
          # burning 25 minutes with no FAILED summary. Fail fast instead.
          # log_cli stays on for local runs (it is set in pyproject.toml) but is turned off here:
          # under -n it interleaves across workers, and it emitted ~24k lines per CI run.
          python -m pytest \
            -n auto --dist loadfile \
            --max-worker-restart=0 \
            --timeout=180 --timeout-method=thread \
            -o log_cli=false \
            -p no:cacheprovider \
            -m "not integration and not system" \
            --cov=egpt \
            --cov-report=json:coverage-egpt.json \
            --cov-report=term \
            --ignore=./libs/agno/tests/unit/observability \
            ./libs/agno/tests/unit

      - name: Run product tests
        if: matrix.package == 'egpt'
        working-directory: .
        run: |
          set -e
          source .venv/bin/activate
          python -m pytest -q -p no:cacheprovider --timeout=120 product/tests

      - name: Run observability tests (isolated)
        if: matrix.package == 'egpt' && matrix.python-version == '3.12'
        working-directory: .
        env:
          EGPT_TELEMETRY: false
        run: |
          set -e
          source .venv/bin/activate
          # Install the instrumentor in isolation for observability tests only.
          # These tests are run separately to avoid the instrumentor's global
          # monkey-patching from affecting other tests in the suite.
          uv pip install openinference-instrumentation-agno
          python -m pytest \
            --timeout=60 --timeout-method=thread \
            -o log_cli=false \
            -p no:cacheprovider \
            ./libs/agno/tests/unit/observability

      - name: Publish unit coverage summary
        if: matrix.package == 'egpt' && matrix.python-version == '3.12'
        working-directory: .
        run: |
          set -e
          TOTAL=$(python -c "import json; d=json.load(open('coverage-egpt.json')); print(f'{d[\"totals\"][\"percent_covered\"]:.2f}')")
          echo "## Unit test coverage (EGPT-0.10 PR gate)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: **${TOTAL}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "Suite: \`libs/agno/tests/unit\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit coverage artifact
        if: matrix.package == 'egpt'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-egpt-py${{ matrix.python-version }}
          path: coverage-egpt.json
          if-no-files-found: error

      - name: Run egptctl tests
        if: matrix.package == 'egptctl'
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m pytest ./tests

      - name: Run egpt-infra tests
        if: matrix.package == 'egpt-infra'
        run: |
          source ../../.venv/bin/activate
          set +e
          python -m pytest tests
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No egpt-infra tests found; skipping."
            exit 0
          fi
          exit "$code"

      - name: Build package
        run: |
          set -e
          source ../../.venv/bin/activate
          python -m build

      - name: Check the egpt wheel contains no product, frontend or deploy files
        if: matrix.package == 'egpt'
        working-directory: .
        run: |
          set -e
          source .venv/bin/activate
          python scripts/check_wheel_contents.py "libs/agno/dist/egpt-*.whl"

  import-linter:
    # EGPT-1.11 (aicoe-tracker#52): encodes the integrations-boundary cells of ADR 0001's
    # allowed-import matrix (docs/adr/0001-layered-architecture.md) as import-linter contracts
    # in libs/agno/pyproject.toml. Promoted from informational to required (in ci-success's
    # `needs`) by EGPT-1.7c (aicoe-tracker#180), which cleared the last of the known debt this
    # job used to fail on -- the contracts carry no `ignore_imports` for layering debt, and the
    # retired ledger's terminal guard (libs/agno/tests/unit/test_import_linter_contracts.py)
    # plus the per-tree AST guards (context/channels/memory layout tests) keep the module-level
    # precision the contracts cannot express. This is the "CI fails on any cross-layer import
    # violation" gate #52's acceptance criteria ask for.
    name: import-linter
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: libs/agno
        run: |
          set -e
          uv venv ../../.venv --python 3.12
          source ../../.venv/bin/activate
          uv pip install -e .[dev]

      - name: Run lint-imports
        working-directory: libs/agno
        run: |
          set -e
          source ../../.venv/bin/activate
          lint-imports

  helm-lint:
    # `deploy` is live code -- the two Helm charts -- and until this job existed a PR touching
    # only deploy/** produced no check at all: `python` came out false, every heavy job (which
    # is the only place a chart was ever rendered) skipped, and ci-success went green having
    # looked at nothing. `frontend` is unused for the same reason the README states (no frontend
    # code yet); `deploy` is not.
    name: helm-lint
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: helm lint both charts
        run: |
          set -e
          helm lint deploy/helm/egpt-local-infra
          helm lint deploy/helm/egpt

      - name: helm template values.local.yaml (stub JWKS)
        run: |
          set -e
          echo '{"keys":[]}' > /tmp/stub-jwks.json
          helm template egpt deploy/helm/egpt -f deploy/helm/egpt/values.local.yaml \
            --set-file auth.jwks=/tmp/stub-jwks.json > /dev/null

      - name: helm template secrets.provider=keyVault
        run: |
          set -e
          helm template egpt deploy/helm/egpt --set secrets.provider=keyVault > /dev/null

      - name: helm template auth.enabled without jwks/audience -- expect failure
        run: |
          set -e
          if helm template egpt deploy/helm/egpt --set auth.enabled=true > /tmp/out.log 2>&1; then
            echo "expected helm template to fail: auth.enabled=true with no auth.jwks"
            cat /tmp/out.log
            exit 1
          fi
          grep -q "auth.jwks is empty" /tmp/out.log

      - name: helm template consolidator.replicaCount -- expect failure
        run: |
          set -e
          if helm template egpt deploy/helm/egpt --set consolidator.replicaCount=2 > /tmp/out.log 2>&1; then
            echo "expected helm template to fail: consolidator.replicaCount is not a setting"
            cat /tmp/out.log
            exit 1
          fi
          grep -q "is not a setting" /tmp/out.log

  unit-drivers-absent:
    # A unit test that needs an optional driver must gate on it (pytest.importorskip) so it
    # SKIPS where the driver is absent. `test-and-build` structurally cannot catch a missed
    # gate: it installs .[tests], which transitively pulls in every driver, so an ungated
    # test passes there and only breaks for someone who installed a subset. Five such
    # regressions shipped and all five were caught by a human reading the diff
    # (aicoe-tracker#161). This job is the machine that reads the diff.
    name: unit-drivers-absent
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # Normally ~13m, but seen at 25m18s (canceled at the old ceiling) on a slow runner --
    # same class of false failure as test-and-build's egpt legs above.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install egpt without the backend drivers
        working-directory: libs/agno
        run: |
          set -e
          uv venv ../../.venv --python 3.12
          source ../../.venv/bin/activate
          uv pip install -e .[tests]
          uv pip install brave-search --no-deps
          uv pip install -e tests/fixtures/egpt_dummy_provider
          # Remove exactly the storage/vectordb/channel/SaaS-SDK drivers, keeping everything
          # else test-and-build installs. Expressed as an uninstall rather than a lean extra
          # because the extras self-reference heavily (tests -> dev -> slack -> ...), so
          # subtracting after the fact is the only reliable way to express "minus drivers".
          # uv warns and exits 0 for anything not installed, so this stays correct as the
          # extras change.
          #
          # Invariant: one entry per driver family gated in tests/unit; extend this list when
          # gating a new family, or the gates and the job that enforces them drift apart and
          # the job goes blind to exactly the family it should be checking.
          #
          # opentelemetry-sdk only, not opentelemetry-api: pydocket (a hard fastmcp dependency,
          # and fastmcp/mcp stays installed here) unconditionally requires opentelemetry-api, so
          # removing it too would fail mcp-family tests in an install combination that can never
          # occur for real. opentelemetry-sdk has no such transitive pull -- it really is optional,
          # per egpt's own pyproject.toml extras -- so it's the one this job should catch going
          # unguarded (see egpt/tracing/exporter.py and egpt/tracing/schemas.py, which shipped
          # exactly that gap in v0.2.0).
          #
          # chromadb joins the uninstall list for the same reason: it imports
          # opentelemetry.sdk.resources unconditionally at its own module load (unrelated to
          # egpt), so leaving it installed while removing opentelemetry-sdk broke its collection
          # with an ImportError instead of a skip -- test_chromadb.py had no importorskip gate
          # because chromadb was never in this list before.
          uv pip uninstall \
            aioboto3 \
            aiosqlite \
            asyncmy \
            asyncpg \
            azure-search-documents \
            boto3 \
            botocore \
            chromadb \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            lancedb \
            neo4j \
            opentelemetry-sdk \
            psycopg \
            psycopg-binary \
            psycopg2-binary \
            pymysql \
            redshift-connector \
            slack-sdk \
            sqlglot \
            weaviate-client

      - name: Run unit tests with drivers absent
        env:
          EGPT_TELEMETRY: false
          EGPT_TEST_ENTRY_POINTS: "1"
        run: |
          set -e
          source .venv/bin/activate
          # Skips are the expected outcome here. Failures and collection errors are not:
          # each one is a test that forgot its gate.
          python -m pytest \
            -n auto --dist loadfile \
            --max-worker-restart=0 \
            --timeout=180 --timeout-method=thread \
            -o log_cli=false \
            -p no:cacheprovider \
            -m "not integration and not system" \
            ./libs/agno/tests/unit

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
      - changes
      - validate
      - validate-egpt-infra
      - test-and-build
      - unit-drivers-absent
      - import-linter
      - helm-lint
    # always() is intentional: without it, this job is skipped when an upstream
    # job fails, and GitHub branch protection treats "skipped" as "passed".
    # The shell checks below enforce the real result.
    if: always()
    steps:
      - name: Require the run-ci label on pull requests
        # On an unlabeled PR every upstream job is skipped, and the `!= success` checks below
        # would fail with five misleading "X failed: skipped" lines. Fail here with the actual
        # reason instead. Adding the label re-fires this workflow via the `labeled` event.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'run-ci')
        run: |
          echo "::error::CI did not run: add the 'run-ci' label to this pull request to run the full suite."
          exit 1

      - name: Require all jobs
        # `python` and `deploy` gate two independent groups of jobs (Python's heavy suite; the
        # chart's helm-lint), so each is checked -- and tolerated as skipped-by-design -- on its
        # own path filter rather than one early exit deciding for both. A PR that touches only
        # deploy/** must still get helm-lint's result checked here, not waved through because
        # python == 'false'.
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes failed: ${{ needs.changes.result }}"
            exit 1
          fi

          failed=0

          if [[ "${{ needs.changes.outputs.python }}" == "true" ]]; then
            if [[ "${{ needs.validate.result }}" != "success" ]]; then
              echo "validate failed: ${{ needs.validate.result }}"
              failed=1
            fi
            if [[ "${{ needs.validate-egpt-infra.result }}" != "success" ]]; then
              echo "validate-egpt-infra failed: ${{ needs.validate-egpt-infra.result }}"
              failed=1
            fi
            if [[ "${{ needs.test-and-build.result }}" != "success" ]]; then
              echo "test-and-build failed: ${{ needs.test-and-build.result }}"
              failed=1
            fi
            if [[ "${{ needs.unit-drivers-absent.result }}" != "success" ]]; then
              echo "unit-drivers-absent failed: ${{ needs.unit-drivers-absent.result }}"
              failed=1
            fi
            if [[ "${{ needs.import-linter.result }}" != "success" ]]; then
              echo "import-linter failed: ${{ needs.import-linter.result }}"
              failed=1
            fi
          else
            echo "No Python-relevant paths changed; Python jobs skipped by design."
          fi

          if [[ "${{ needs.changes.outputs.deploy }}" == "true" ]]; then
            if [[ "${{ needs.helm-lint.result }}" != "success" ]]; then
              echo "helm-lint failed: ${{ needs.helm-lint.result }}"
              failed=1
            fi
          else
            echo "No deploy-relevant paths changed; helm-lint skipped by design."
          fi

          if [[ "$failed" == "1" ]]; then
            exit 1
          fi
