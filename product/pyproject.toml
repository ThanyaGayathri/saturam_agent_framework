# Enterprise GPT retail product -- the code that is NOT the framework.
#
# `product/` is a separate distribution from `egpt` (libs/agno) on purpose. The framework
# wheel is built from libs/agno with `packages.find include = ["egpt*"]`, and import-linter's
# `root_package = "egpt"` governs the framework alone, so nothing here can leak into
# `pip install egpt`. This file exists so that `product/` is installable into the dev, demo
# and container environments the same way the framework is: `uv pip install -e "product[dev]"`.
#
# See docs/plan/delivery-plan.md, "Where the code lives".

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egpt-retail"
version = "0.1.0"
description = "Enterprise GPT retail product: contracts, executors, skills and the API contract."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # PINNED, and installed after libs/agno. Public PyPI already holds an unrelated
  # `egpt==0.0.1` (see .github/workflows/release.yml); an unpinned dependency resolves to
  # that package in any environment where our egpt is absent. A pin no public index can
  # satisfy fails loudly instead.
  #
  # `[markdown]` is here, not duplicated into deploy/Dockerfile and scripts/dev_setup.sh,
  # because this is the one place that actually needs it: `MarkdownChunking` (which requires
  # `unstructured`) is used by `product/egpt_retail/knowledge/prose.py`, product's own code,
  # not the framework's. Declaring the extra at its point of use means a future install site
  # gets it for free instead of needing to remember to ask for it (#253).
  "egpt[os,markdown]==0.2.0",
  # The model SDK is the product's choice, not the framework's: egpt[os] carries the server
  # stack and no provider SDK, and the dev venv only has `openai` through egpt[dev]. Found by
  # the first container run -- AzureOpenAI() raised ImportError inside the image and nowhere else.
  "openai",
  # RS256 verification. The framework declares bare `PyJWT`, which verifies HS256 only; with a
  # JWKS of RSA keys every key fails to parse ("RS256 requires 'cryptography'") and the
  # validator starts with zero keys. Present in the dev venv transitively, absent in the image.
  # Found by the first kind install (R2). Any RS256 deployment of egpt[os] needs this.
  "cryptography>=41.0",
  "psycopg[binary]",
  # R4 reads the raw drop from S3-compatible storage. Not inherited: egpt[os] carries no AWS
  # SDK (only the aws-bedrock extra does), and the framework's own S3Config cannot serve --
  # it has no endpoint_url, so it cannot address MinIO, and no get-object surface at all.
  "boto3",
  # AZ-A: R4 reads the raw drop from Azure Blob Storage (Azurite locally, real Azure Blob in
  # production). Not inherited: egpt[os] carries no Azure SDK at all.
  "azure-storage-blob",
  # The ambient/managed-identity credential path AzureBlobObjectStore falls back to when no
  # explicit account key is configured -- the Container Apps analogue of workload identity.
  "azure-identity",
  # #304: AzureKeyVaultSecretStore (configure/secrets.py), the production home for a
  # registered data source's credential. Not inherited: egpt[os] carries no Azure SDK at all.
  "azure-keyvault-secrets",
  "sqlalchemy",
  # R6's SQL guard (product/egpt_retail/app/sql_guard.py imports egpt.guardrails.sql_guard,
  # which imports sqlglot unconditionally). Not inherited: egpt[os] carries no sqlglot, only
  # egpt[sql] does, and this product depends on egpt[os] directly rather than egpt[sql].
  "sqlglot",
  "pgvector",
  "neo4j",
]

[project.scripts]
# The image's ENTRYPOINT. Five argv values: api, pipelines, consolidator, migrate,
# warehouse-migrate.
egpt-retail = "egpt_retail.entrypoints.__main__:main"

[project.optional-dependencies]
# Everything needed to regenerate and check the API contract, plus the test runner.
# Never installed into the runtime image.
#
# datamodel-code-generator, black and isort are pinned exactly: check_api_contract.py's
# check 4 regenerates api/models/_generated.py and fails unless it is byte-identical to the
# committed file, and datamodel-code-generator formats its output with whichever black/isort
# are installed. Left unpinned, the next release of any of the three can turn CI red on a PR
# that never touched the contract. Bump all three together, then run
# ./scripts/gen_api_models.sh and commit the regenerated file in the same change.
dev = [
  "datamodel-code-generator==0.76.2",
  "black==26.5.1",
  "isort==8.0.1",
  "openapi-spec-validator>=0.7",
  "build",
  "pytest",
  "httpx",
  "ruff",
  "mypy",
]

[tool.setuptools.packages.find]
include = ["egpt_retail*"]

[tool.setuptools.package-data]
# Data the product reads at runtime by path. Absent from here, an installed (non-editable)
# copy silently loses its ontology, fixtures, prompts and contract.
egpt_retail = [
  "py.typed",
  "ontology/*.json",
  "contracts/_fixtures/*.json",
  "contracts/_fixtures/landing/raw/*/*/*.ndjson",
  "skills/*.md",
  "api/openapi/*.yaml",
  "api/openapi/*.json",
  "api/openapi/paths/*.yaml",
  "api/openapi/schemas/*.yaml",
  # R4's transforms. These are the product's data pipeline, not documentation: without them
  # an installed copy has a warehouse package that cannot create a table or conform a row.
  # test_r4_sql_assets.py asserts every .sql on disk is covered by one of these three globs.
  "warehouse/sql/ddl/*.sql",
  "warehouse/sql/conform/*.sql",
  "warehouse/sql/checks/*.sql",
  "warehouse/sql/defects/*.sql",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Generated from the OpenAPI document by scripts/gen_api_models.sh. Not hand-edited.
"egpt_retail/api/models/_generated.py" = ["E501", "F401"]

[tool.mypy]
# Run through ./scripts/validate.sh, which sets MYPYPATH=libs/agno: the framework is an editable
# install behind an import-hook finder, invisible to mypy without an explicit source path.
#
# python_version is 3.12, not the package's 3.10 floor, and that is a decision rather than an
# oversight (open-items X-5). numpy 2.x ships stubs written with the `type` statement, which mypy
# refuses to parse under any target below 3.12 -- and it parses them whatever per-module
# override is set on numpy, or on the module that imports it (neo4j), because the stub is
# collected before follow_imports applies. So under "3.10" the product target failed on every
# dev box with a current numpy and passed in CI only by resolving an older one. The 3.10 floor
# is still enforced where it bites: ruff's target-version = py310 for syntax, and CI running the
# product tests on a real 3.10 interpreter (which is what caught the tomllib import, not mypy).
# Caveat: ruff's target-version catches syntax-shape drift (PEP 695 `type`/generic syntax,
# `except*`), not stdlib/typing-API-availability drift (e.g. `typing.override`) -- only the
# real-3.10 CI job catches that class, and only for the code paths it exercises.
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["tests*"]

[[tool.mypy.overrides]]
# The framework is checked by its own config in libs/agno/pyproject.toml. Here it is only the
# thing product/ types against: analysed for signatures, never reported on.
module = ["egpt.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# boto3 ships no type information and has no stub package in this environment. The framework
# takes the same position for the same library (see libs/agno/pyproject.toml). The surface
# egpt_retail.storage.s3 uses is three calls wide and is exercised for real by
# cookbook/94_retail/R04_minio_load.sh, which is a better guarantee than a stub would be.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
