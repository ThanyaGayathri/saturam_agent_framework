# KPI discovery, catalog, feasibility and health. Derived from kpi-registry.js and
# kpi-sources.js; the definition shape is Lane K's KPI formula contract.

/kpis:
  get:
    tags: [kpis]
    operationId: listKpis
    summary: The KPI registry, with feasibility per row.
    description: Flat. The prototype's categories -> sections -> kpis nesting is a rendering concern; `business_area` and `subject_area` are the two grouping keys it needs.
    x-egpt-scopes: [kpis:read]
    parameters:
      - name: business_area
        in: query
        required: false
        schema:
          $ref: '../schemas/common.yaml#/BusinessAreaId'
      - name: subject_area
        in: query
        required: false
        description: "Placeholder pending B2 (#231): `Kpi.subject_area` is not backed by the registry yet, so every KPI currently reports an empty string and this filter always returns `[]`."
        schema: {type: string}
      - name: active
        in: query
        required: false
        description: "Placeholder pending B2 (#231): `Kpi.active` is not backed by the registry yet, so every KPI currently reports `true` and `?active=false` always returns `[]`."
        schema: {type: boolean}
      - name: feasibility
        in: query
        required: false
        schema:
          $ref: '../schemas/common.yaml#/FeasibilityVerdict'
    responses:
      "200":
        description: KPIs.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/kpis.yaml#/Kpi'
            examples:
              default:
                summary: "`KpiRegistry` -- the evidence screen for R3. Three shipped KPIs from the contract fixture, one blocked."
                value:
                  - id: kpi_0001
                    identifier: stocklevel__days_of_stock
                    name: Days of Stock Remaining
                    description: Estimated days until stockout at current sell-through, per product at this stock level.
                    business_area: inventory
                    subject_area: Replenishment
                    concept: StockLevel
                    grain: product
                    result_shape: rowset
                    dialect: postgres
                    source_tables: [inventory, order_items, orders, products]
                    parameters: [{name: stock_level_name, kind: scalar, description: The stock level band.}]
                    time_window: {length: 30, unit: day}
                    validated_against_snapshot: "r3-contract.1"
                    level: operational
                    unit: Days
                    industry_benchmark: 14-30 days safety stock
                    active: true
                    source: shipped
                    dataset_ids: []
                    process_ids: [inv_5]
                    feasibility: {kpi_id: kpi_0001, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
                    updated_at: "2026-09-07T02:05:00Z"
                  - id: kpi_0002
                    identifier: supplier__on_time_rate_30d
                    name: Supplier On-Time Rate (30d)
                    description: Fraction of deliveries on time in the last 30 days.
                    business_area: supply_chain
                    subject_area: Supplier Management
                    concept: Supplier
                    grain: supplier
                    result_shape: scalar
                    dialect: postgres
                    source_tables: [supplier_deliveries]
                    parameters: [{name: supplier_id, kind: scalar, description: ""}]
                    time_window: {length: 30, unit: day}
                    validated_against_snapshot: "r3-contract.1"
                    level: operational
                    unit: "%"
                    industry_benchmark: ">95%"
                    active: true
                    source: shipped
                    dataset_ids: []
                    process_ids: [sc_1]
                    feasibility: {kpi_id: kpi_0002, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
                    updated_at: "2026-09-07T02:05:00Z"
                  - id: kpi_0003
                    identifier: product__avg_rating
                    name: Average Product Rating
                    description: Average star rating from reviews.
                    business_area: product
                    subject_area: Category Performance
                    concept: Product
                    grain: product
                    result_shape: scalar
                    dialect: postgres
                    source_tables: [product_reviews, web_sessions]
                    parameters: [{name: product_id, kind: scalar, description: ""}]
                    time_window: null
                    validated_against_snapshot: "r3-contract.1"
                    level: tactical
                    unit: Score
                    industry_benchmark: ""
                    active: true
                    source: customer
                    dataset_ids: []
                    process_ids: []
                    feasibility: {kpi_id: kpi_0003, verdict: partial, missing_tables: [web_sessions], rationale: "Missing from the semantic snapshot: web_sessions.", semantic_snapshot: "r3-contract.1"}
                    updated_at: "2026-09-07T09:30:00Z"
              empty:
                summary: No KPIs yet -- the registry screen's empty state.
                value: []
  post:
    tags: [kpis]
    operationId: createKpi
    summary: Author a KPI.
    x-egpt-scopes: [kpis:write]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/kpis.yaml#/KpiWrite'
          examples:
            default:
              value:
                name: Supplier Fill Rate
                description: Fraction of deliveries fulfilled (not cancelled).
                business_area: supply_chain
                subject_area: Supplier Management
                concept: Supplier
                grain: supplier
                result_shape: scalar
                dialect: postgres
                sql: "SELECT COUNT(CASE WHEN status != 'cancelled' THEN 1 END) * 1.0 / NULLIF(COUNT(*), 0) FROM supplier_deliveries WHERE supplier_id = {supplier_id}"
                source_tables: [supplier_deliveries]
                parameters: [{name: supplier_id, kind: scalar, description: ""}]
                time_window: null
                level: operational
                unit: "%"
                active: true
    responses:
      "201":
        description: Created, with its feasibility against the current snapshot.
        content:
          application/json:
            schema:
              $ref: '../schemas/kpis.yaml#/Kpi'
            examples:
              default:
                value:
                  id: kpi_0004
                  identifier: supplier__fill_rate
                  name: Supplier Fill Rate
                  description: Fraction of deliveries fulfilled (not cancelled).
                  business_area: supply_chain
                  subject_area: Supplier Management
                  concept: Supplier
                  grain: supplier
                  result_shape: scalar
                  dialect: postgres
                  sql: "SELECT COUNT(CASE WHEN status != 'cancelled' THEN 1 END) * 1.0 / NULLIF(COUNT(*), 0) FROM supplier_deliveries WHERE supplier_id = {supplier_id}"
                  source_tables: [supplier_deliveries]
                  parameters: [{name: supplier_id, kind: scalar, description: ""}]
                  time_window: null
                  validated_against_snapshot: "r3-contract.1"
                  level: operational
                  unit: "%"
                  industry_benchmark: ""
                  active: true
                  source: customer
                  dataset_ids: []
                  process_ids: []
                  feasibility: {kpi_id: kpi_0004, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
                  updated_at: "2026-09-07T10:00:00Z"
      "422":
        description: The formula failed construction. The message names the defect, exactly as `KpiDefinition.__post_init__` words it.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              positional:
                value: {detail: "supplier__fill_rate: formula uses 1 positional '?' marker(s). Use named {placeholders} with a declared KpiParameter, so arity and meaning can be checked before execution.", code: invalid_formula}
              drift:
                value: {detail: "supplier__fill_rate: formula reads ['deliveries'] which source_tables does not list. Feasibility would report ready while the formula is missing a table.", code: invalid_formula}
              vocabulary:
                value: {detail: "'warehouse_zone' is not a permitted grain. This deployment permits: brand, channel, customer, customer_segment, location, order, overall, product, product_category, supplier, time_period. Add it to the customer overlay if the business genuinely has it -- do not pick the nearest term.", code: invalid_vocabulary_term}
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

/kpis/suggestions:
  post:
    tags: [kpis]
    operationId: startKpiSuggestionRun
    summary: Start a suggestion run (K12); poll it for the candidates.
    description: |
      The K12 agent proposing candidate KPIs from the connected data, as a run rather than a
      response (#254): two frontier-tier model calls take minutes, not seconds. Returns the run
      `queued`; poll `GET /kpis/suggestions/{run_id}` until it is `succeeded` (then `result` is
      the suggestion list) or `failed` (then `error` says why). Nothing is stored beyond the run
      row itself -- a suggestion becomes a KPI only through `POST /kpis`, so this needs
      `kpis:read`, not `kpis:write`. The body narrows the run to one business area; an empty
      body suggests across every area.
    x-egpt-scopes: [kpis:read]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/kpis.yaml#/KpiSuggestionRunRequest'
          examples:
            default:
              summary: A focus -- the areas the customer cares about, proposed for first.
              value: {business_areas: [customer, marketing]}
            narrowed:
              summary: The older single-area filter (1.1.5), still honoured.
              value: {business_area: supply_chain}
            every_area:
              value: {}
    responses:
      "202":
        description: Accepted. Poll the run for completion.
        content:
          application/json:
            schema:
              $ref: '../schemas/kpis.yaml#/KpiSuggestionRun'
            examples:
              default:
                value:
                  id: sr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: queued
                  business_area: supply_chain
                  business_areas: []
                  created_at: "2026-09-14T10:00:00Z"
                  started_at: null
                  finished_at: null
                  result: null
                  error: null
                  phase: null
                  typical_duration_seconds: 94.0
      "422":
        description: The business area is not in the deployment's vocabulary.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              vocabulary:
                value: {detail: "'logistics' is not a permitted business_area. This deployment permits: inventory, marketing, sales, supply_chain. Add it to the customer overlay if the business genuinely has it -- do not pick the nearest term.", code: invalid_vocabulary_term}
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
  get:
    tags: [kpis]
    operationId: listKpiSuggestions
    deprecated: true
    summary: Candidate KPIs proposed from the connected data (K12), synchronously. Deprecated.
    description: |
      Read on demand and not stored; a suggestion becomes a KPI only through `POST /kpis`. Each
      is traceable to named tables, and the feasibility on it is a set difference, not the
      agent's opinion.

      Deprecated by `POST /kpis/suggestions` + `GET /kpis/suggestions/{run_id}` (#254): the run
      this serves inside the request takes minutes, and the request is now held to the
      deployment's suggestion timeout -- `504` past it, where it used to hang. Kept because
      removing a path is a breaking change; new callers should start a run and poll it.
    x-egpt-scopes: [kpis:read]
    parameters:
      - name: business_area
        in: query
        required: false
        schema:
          $ref: '../schemas/common.yaml#/BusinessAreaId'
    responses:
      "200":
        description: Suggestions.
        content:
          application/json:
            schema:
              $ref: '../schemas/kpis.yaml#/KpiSuggestionList'
            examples:
              default:
                value:
                  suggestions:
                    - identifier: supplier__avg_lead_time_days
                      name: Average Supplier Lead Time
                      description: Average days between expected and actual delivery; positive means late.
                      business_area: supply_chain
                      concept: Supplier
                      grain: supplier
                      result_shape: scalar
                      rationale: supplier_deliveries carries expected_date and actual_date for every delivery.
                      derived_from_tables: [supplier_deliveries]
                      confidence: high
                      proposed_sql: "SELECT AVG(actual_date - expected_date) FROM supplier_deliveries WHERE supplier_id = {supplier_id} AND actual_date IS NOT NULL"
                      feasibility: {kpi_id: supplier__avg_lead_time_days, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
                      proposed_by: {identifier: kpi_suggestion, version: "0.1.0"}
                  notes: ""
                  semantic_snapshot: "r3-contract.1"
              refusal:
                summary: The agent had nothing traceable to propose and said so, in the schema.
                value:
                  suggestions: []
                  notes: "No accepted concept in business_area 'marketing' maps to a harvested table, so no suggestion would be traceable to an input."
                  semantic_snapshot: "r3-contract.1"
      "504":
        description: The run did not finish within the deployment's suggestion timeout. Start a run with `POST /kpis/suggestions` and poll it instead.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              timeout:
                value: {detail: "The suggestion run did not finish within 180s. Use POST /kpis/suggestions and poll the run instead.", code: timeout}

/kpis/suggestions/{run_id}:
  get:
    tags: [kpis]
    operationId: getKpiSuggestionRun
    summary: One suggestion run, for polling.
    description: |
      Poll until `status` is `succeeded` or `failed`. `result.suggestions[].proposed_sql` is
      present only for a caller holding `kpis:write`, exactly as on the synchronous route --
      the run is shared, the SQL gate is per reader. A run whose serving instance was lost
      mid-run reports `failed` here once the deployment's timeout plus a grace period has
      passed, so a poller always reaches a terminal state.
    x-egpt-scopes: [kpis:read]
    parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    responses:
      "200":
        description: The run.
        content:
          application/json:
            schema:
              $ref: '../schemas/kpis.yaml#/KpiSuggestionRun'
            examples:
              running:
                value:
                  id: sr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: running
                  business_area: supply_chain
                  business_areas: []
                  created_at: "2026-09-14T10:00:00Z"
                  started_at: "2026-09-14T10:00:01Z"
                  finished_at: null
                  result: null
                  error: null
                  phase: proposing
                  typical_duration_seconds: 94.0
              succeeded:
                value:
                  id: sr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: succeeded
                  business_area: supply_chain
                  business_areas: []
                  created_at: "2026-09-14T10:00:00Z"
                  started_at: "2026-09-14T10:00:01Z"
                  finished_at: "2026-09-14T10:01:27Z"
                  result:
                    suggestions:
                      - identifier: supplier__avg_lead_time_days
                        name: Average Supplier Lead Time
                        description: Average days between expected and actual delivery; positive means late.
                        business_area: supply_chain
                        concept: Supplier
                        grain: supplier
                        result_shape: scalar
                        rationale: supplier_deliveries carries expected_date and actual_date for every delivery.
                        derived_from_tables: [supplier_deliveries]
                        confidence: high
                        proposed_sql: "SELECT AVG(actual_date - expected_date) FROM supplier_deliveries WHERE supplier_id = {supplier_id} AND actual_date IS NOT NULL"
                        feasibility: {kpi_id: supplier__avg_lead_time_days, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
                        proposed_by: {identifier: kpi_suggestion, version: "0.1.0"}
                    notes: ""
                    semantic_snapshot: "r3-contract.1"
                  error: null
                  phase: checking
                  typical_duration_seconds: 94.0
              failed:
                summary: The bound was hit; the row says so instead of the request hanging.
                value:
                  id: sr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: failed
                  business_area: supply_chain
                  business_areas: []
                  created_at: "2026-09-14T10:00:00Z"
                  started_at: "2026-09-14T10:00:01Z"
                  finished_at: "2026-09-14T10:03:01Z"
                  result: null
                  error: "The suggestion run did not finish within 180s."
                  phase: proposing
                  typical_duration_seconds: 94.0
      "404":
        description: No such run.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              not_found:
                value: {detail: "No suggestion run 'sr_missing'.", code: not_found}
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

/kpis/health:
  get:
    tags: [kpis]
    operationId: listKpiHealth
    summary: Freshness of every KPI from gold.
    x-egpt-scopes: [kpis:read]
    responses:
      "200":
        description: Health per KPI.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/kpis.yaml#/KpiHealth'
            examples:
              default:
                value:
                  - {kpi_id: kpi_0001, identifier: stocklevel__days_of_stock, status: fresh, last_computed_at: "2026-09-07T02:20:00Z", as_of: "2026-09-06T23:59:59Z", staleness_hours: 8.5, last_run_id: run_gold_20260907, last_error: null}
                  - {kpi_id: kpi_0002, identifier: supplier__on_time_rate_30d, status: failed, last_computed_at: "2026-09-06T02:20:00Z", as_of: "2026-09-05T23:59:59Z", staleness_hours: 32.5, last_run_id: run_gold_20260907, last_error: "column supplier_deliveries.actual_date does not exist"}
                  - {kpi_id: kpi_0003, identifier: product__avg_rating, status: never_computed, last_computed_at: null, as_of: null, staleness_hours: null, last_run_id: null, last_error: null}
              empty:
                value: []

/kpis/import:
  post:
    tags: [kpis]
    operationId: importKpis
    summary: Import KPIs from CSV.
    x-egpt-scopes: [kpis:write]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/kpis.yaml#/KpiImportRequest'
          examples:
            default:
              value:
                csv: "name,description,business_area,grain,sql,source_tables\nSupplier Fill Rate,Fraction of deliveries fulfilled,supply_chain,supplier,\"SELECT COUNT(*) FROM supplier_deliveries WHERE supplier_id = {supplier_id}\",supplier_deliveries\n"
                dry_run: false
    responses:
      "200":
        description: What was imported and what was refused, row by row.
        content:
          application/json:
            schema:
              $ref: '../schemas/kpis.yaml#/KpiImportResult'
            examples:
              default:
                value:
                  imported: [supplier__fill_rate]
                  rejected:
                    - {row: 3, reason: "product__avg_rating: formula uses undeclared parameter(s) ['product_id']"}
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

/kpis/{kpi_id}:
  get:
    tags: [kpis]
    operationId: getKpi
    summary: One KPI.
    x-egpt-scopes: [kpis:read]
    parameters:
      - $ref: '#/x-egpt-parameters/kpiId'
    responses:
      "200":
        description: The KPI.
        content:
          application/json:
            schema:
              $ref: '../schemas/kpis.yaml#/Kpi'
            examples:
              default:
                value:
                  id: kpi_0002
                  identifier: supplier__on_time_rate_30d
                  name: Supplier On-Time Rate (30d)
                  description: Fraction of deliveries on time in the last 30 days.
                  business_area: supply_chain
                  subject_area: Supplier Management
                  concept: Supplier
                  grain: supplier
                  result_shape: scalar
                  dialect: postgres
                  sql: "SELECT COUNT(CASE WHEN status = 'on_time' THEN 1 END) * 1.0 / NULLIF(COUNT(*), 0) FROM supplier_deliveries WHERE supplier_id = {supplier_id}"
                  source_tables: [supplier_deliveries]
                  parameters: [{name: supplier_id, kind: scalar, description: ""}]
                  time_window: {length: 30, unit: day}
                  validated_against_snapshot: "r3-contract.1"
                  level: operational
                  unit: "%"
                  industry_benchmark: ">95%"
                  active: true
                  source: shipped
                  dataset_ids: []
                  process_ids: [sc_1]
                  feasibility: {kpi_id: kpi_0002, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
                  updated_at: "2026-09-07T02:05:00Z"
      "404":
        $ref: '#/x-egpt-responses/NotFound'
  patch:
    tags: [kpis]
    operationId: updateKpi
    summary: Edit a KPI. A formula edit re-validates and moves the KPI back to review against the current snapshot.
    x-egpt-scopes: [kpis:write]
    parameters:
      - $ref: '#/x-egpt-parameters/kpiId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/kpis.yaml#/KpiWrite'
          examples:
            default:
              value: {name: Supplier On-Time Rate (30d), description: Fraction of deliveries on time in the last 30 days., business_area: supply_chain, grain: supplier, sql: "SELECT COUNT(CASE WHEN status = 'on_time' THEN 1 END) * 1.0 / NULLIF(COUNT(*), 0) FROM supplier_deliveries WHERE supplier_id = {supplier_id}", source_tables: [supplier_deliveries], parameters: [{name: supplier_id, kind: scalar}], active: false}
    responses:
      "200":
        description: Updated.
        content:
          application/json:
            schema:
              $ref: '../schemas/kpis.yaml#/Kpi'
            examples:
              default:
                value:
                  id: kpi_0002
                  identifier: supplier__on_time_rate_30d
                  name: Supplier On-Time Rate (30d)
                  description: Fraction of deliveries on time in the last 30 days.
                  business_area: supply_chain
                  subject_area: Supplier Management
                  concept: Supplier
                  grain: supplier
                  result_shape: scalar
                  dialect: postgres
                  sql: "SELECT COUNT(CASE WHEN status = 'on_time' THEN 1 END) * 1.0 / NULLIF(COUNT(*), 0) FROM supplier_deliveries WHERE supplier_id = {supplier_id}"
                  source_tables: [supplier_deliveries]
                  parameters: [{name: supplier_id, kind: scalar, description: ""}]
                  time_window: {length: 30, unit: day}
                  validated_against_snapshot: "r3-contract.1"
                  level: operational
                  unit: "%"
                  industry_benchmark: ">95%"
                  active: false
                  source: shipped
                  dataset_ids: []
                  process_ids: [sc_1]
                  feasibility: {kpi_id: kpi_0002, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
                  updated_at: "2026-09-07T10:05:00Z"
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'
      "422":
        description: The edited formula failed construction.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              invalid:
                value: {detail: "supplier__on_time_rate_30d: declares parameter(s) ['supplier_id'] the formula never uses", code: invalid_formula}
  delete:
    tags: [kpis]
    operationId: deleteKpi
    summary: Retire a KPI.
    description: Refused while a dashboard tile, an alert definition or an activated use case references it; the message names them.
    x-egpt-scopes: [kpis:write]
    parameters:
      - $ref: '#/x-egpt-parameters/kpiId'
    responses:
      "204":
        description: Deleted.
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'
      "409":
        description: Still referenced.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              conflict:
                value: {detail: "supplier__on_time_rate_30d is referenced by dashboard dsh_supply and alert alr_0002. Remove those references first.", code: still_referenced}

/kpis/{kpi_id}/feasibility:
  get:
    tags: [kpis]
    operationId: getKpiFeasibility
    summary: Whether this KPI can be computed against the current snapshot.
    description: A set difference between the formula's source tables and the semantic layer's tables. Takes no opinion from anything.
    x-egpt-scopes: [kpis:read]
    parameters:
      - $ref: '#/x-egpt-parameters/kpiId'
    responses:
      "200":
        description: The verdict.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Feasibility'
            examples:
              ready:
                value: {kpi_id: kpi_0002, verdict: ready, missing_tables: [], rationale: Every source table is present in the semantic snapshot., semantic_snapshot: "r3-contract.1"}
              partial:
                value: {kpi_id: kpi_0003, verdict: partial, missing_tables: [web_sessions], rationale: "Missing from the semantic snapshot: web_sessions.", semantic_snapshot: "r3-contract.1"}
              blocked:
                value: {kpi_id: kpi_0009, verdict: blocked, missing_tables: [campaigns, campaign_spend], rationale: "Missing from the semantic snapshot: campaign_spend, campaigns.", semantic_snapshot: "r3-contract.1"}
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/kpi-sources:
  get:
    tags: [kpis]
    operationId: listKpiSources
