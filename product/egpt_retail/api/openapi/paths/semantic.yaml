                        business_area: sales
                        source_tables: [crm_deal, crm_quote]
                        result_shape: scalar
                        rationale: The harvested schema has both quote and deal tables with a shared deal_id, and every dashboard example this deployment ships asks for conversion.
                        feasibility: ready
                        feasibility_reason: Both source tables are joinable on deal_id.
                        missing_tables: []
                      proposer: kpi_suggestion_skill@1.0.0
                      state: pending
                      reviewer: null
                      decided_at: null
                      decision_note: ""
                      applied_at: null
                      apply_error: null
                      created_at: "2026-09-07T02:03:40Z"
                    - id: b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5
                      kind: use_case
                      target: which-brands-are-slowest-to-close
                      payload:
