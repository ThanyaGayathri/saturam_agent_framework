                  decided_at: "2026-09-07T09:16:05Z"
                  harvest_id: hv_20260907_0200
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "409":
        description: Already decided.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              conflict:
                value: {detail: "Proposal prop_0003 was accepted on 2026-09-07T09:12:00Z by analyst@example.test.", code: already_decided}

/semantic/proposals/accept:
  post:
    tags: [semantic]
    operationId: acceptSemanticProposalsBulk
    summary: Accept many proposals in one decision.
    description: A harvest produces hundreds of proposals; a gate per proposal is the obvious tool and the wrong one (G5). Every id in the request is decided or none is.
    x-egpt-scopes: [semantic:review]
