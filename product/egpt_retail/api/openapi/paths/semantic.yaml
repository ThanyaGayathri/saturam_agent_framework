                        rationale: The RFQ KPIs this deployment already has cover conversion but not cycle time; the harvested tables carry both quote and close timestamps.
                        kpi_identifiers: [rfq__quote_to_deal_conversion_rate]
                        derived_from_tables: [crm_deal, crm_quote]
                        confidence: medium
                        shape: ranked_list
                        shape_ready: true
                        shape_missing: []
                      proposer: use_case_suggestion_skill@1.0.0
                      state: accepted
                      reviewer: analyst@example.test
                      decided_at: "2026-09-07T09:12:00Z"
                      decision_note: ""
                      applied_at: null
