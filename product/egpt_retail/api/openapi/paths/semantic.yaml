/semantic/proposals:
  get:
    tags: [semantic]
    operationId: listSemanticProposals
    summary: K7 proposals awaiting or past review -- KPI and use-case suggestions, plus harvest-time enrichment.
    description: |
      The review screen's read (D10, F2). This is the one caller expected to see unreviewed
      content, and it needs `semantic:read_proposed`. `kind` may repeat -- the store filters
      one kind per call internally, so `?kind=kpi&kind=use_case` (what the review screen asks
      for) is answered as two reads merged into one list.
    x-egpt-scopes: [semantic:read_proposed]
    parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: '../schemas/semantic.yaml#/ProposalDecision'
      - name: kind
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '../schemas/semantic.yaml#/ProposalKind'
    responses:
      "200":
        description: Proposals.
        content:
          application/json:
            schema:
              $ref: '../schemas/semantic.yaml#/ProposalList'
            examples:
              default:
                value:
                  proposals:
                    - id: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
                      kind: kpi
                      target: rfq__quote_to_deal_conversion_rate
                      payload:
                        identifier: rfq__quote_to_deal_conversion_rate
                        name: Quote-to-deal conversion rate
                        description: Share of RFQs that became a won deal.
                        sql: "SELECT ..."
