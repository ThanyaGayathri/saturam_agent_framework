    responses:
      "200":
        description: The decided proposals.
        content:
          application/json:
            schema:
              $ref: '../schemas/semantic.yaml#/ProposalList'
            examples:
              default:
                value:
                  proposals:
                    - id: prop_0001
                      kind: synonym
                      target: {concept: StockLevel, table: null, column: null}
                      value: stock position
                      rationale: The description defines the concept as a band of how much is on hand, which is what a stock position states.
                      confidence: high
                      decision: accepted
                      proposed_by: {identifier: synonym_proposer, version: "1.0.0"}
                      proposed_at: "2026-09-07T02:03:40Z"
                      decided_by: analyst@example.test
                      decided_at: "2026-09-07T09:20:00Z"
                      harvest_id: hv_20260907_0200
                    - id: prop_0002
                      kind: question_pattern
                      target: {concept: StockLevel, table: null, column: null}
                      value: "what needs reordering?"
                      rationale: The description names deciding what to reorder as the concept's purpose.
                      confidence: high
                      decision: accepted
                      proposed_by: {identifier: synonym_proposer, version: "1.0.0"}
                      proposed_at: "2026-09-07T02:03:40Z"
                      decided_by: analyst@example.test
                      decided_at: "2026-09-07T09:20:00Z"
                      harvest_id: hv_20260907_0200
                  counts: {proposed: 0, accepted: 2, rejected: 0}
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "409":
        description: At least one id was already decided; nothing was changed.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              conflict:
                value: {detail: "prop_0003 was already decided. No proposal in this request was changed.", code: already_decided}

# Reusable pieces local to this fragment. The bundler inlines them.
x-egpt-parameters:
  includeProposed:
    name: include_proposed
    in: query
    required: false
    schema: {type: boolean, default: false}
    description: |
      Return rows still awaiting review. Defaults to false on every read. Setting it true
      requires the `semantic:read_proposed` scope; without it the response is 403, not a
      silently filtered 200. `GET /semantic/tables/{name}` and `GET /semantic/concepts/{name}`
      mark a proposed row `status: proposed`; the list endpoints this parameter also gates
      (`listSemanticTables`, `listSemanticConcepts`, `listSemanticBusinessAreas`) return
      proposed rows unmarked -- a known gap, see CHANGELOG.md.

x-egpt-responses:
  InsufficientScope:
    description: The token lacks a scope this operation requires.
    content:
      application/json:
        schema:
          $ref: '../schemas/common.yaml#/Error'
        examples:
          insufficient_scope:
            value: {detail: "Insufficient permissions. Required scopes: semantic:read_proposed.", code: insufficient_scope}
  SemanticUnavailable:
    description: The reader could not answer. Distinct from every empty result above -- an empty list is an answer; this is not.
    content:
      application/json:
        schema:
          $ref: '../schemas/common.yaml#/Error'
        examples:
          semantic_unavailable:
            value: {detail: "The semantic read stub has no fixture loaded. Load one with StubSemanticRead.from_fixture(path), or point the caller at the graph-backed reader once K5 lands.", code: semantic_unavailable}
