              empty:
                value: []

x-egpt-parameters:
  alertId:
    name: alert_id
    in: path
    required: true
    schema: {type: string}
  eventId:
    name: event_id
    in: path
    required: true
    schema: {type: string}
  scheduleId:
    name: schedule_id
    in: path
    required: true
    schema: {type: string}

x-egpt-responses:
  InsufficientScope:
    description: The token lacks a scope this operation requires.
    content:
      application/json:
        schema:
          $ref: '../schemas/common.yaml#/Error'
        examples:
          insufficient_scope:
            value: {detail: "Insufficient permissions. Required scopes: alerts:write.", code: insufficient_scope}
  NotFound:
    description: No such resource.
    content:
      application/json:
        schema:
          $ref: '../schemas/common.yaml#/Error'
        examples:
          not_found:
            value: {detail: "Not found.", code: not_found}
