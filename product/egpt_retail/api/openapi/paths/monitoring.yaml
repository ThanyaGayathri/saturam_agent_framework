/monitoring/execution-health:
  get:
    tags: [monitoring]
    operationId: getExecutionHealth
    summary: Is it running? Per use case, from run history.
    x-egpt-scopes: [monitoring:read]
    responses:
      "200":
        description: Execution health.
        content:
          application/json:
            schema:
              $ref: '../schemas/monitoring.yaml#/ExecutionHealth'
            examples:
              default:
                value:
                  as_of: "2026-09-07T11:50:00Z"
                  use_cases:
                    - {use_case_id: uc_0001, title: RFQ funnel -- weekly, version: 3, last_run_status: succeeded, last_run_at: "2026-09-07T05:00:00Z", runs_7d: 7, failures_7d: 1, silent: false, gates_waiting: 0, cost_7d: {input_tokens: 28400, output_tokens: 4210, drift_pct: 3.1}}
                    - {use_case_id: uc_0002, title: Supplier reliability watch, version: 1, last_run_status: null, last_run_at: null, runs_7d: 0, failures_7d: 0, silent: true, gates_waiting: 0, cost_7d: {input_tokens: 0, output_tokens: 0, drift_pct: null}}
              empty:
                value: {as_of: "2026-09-07T11:50:00Z", use_cases: []}

/monitoring/quality:
  get:
    tags: [monitoring]
    operationId: getQualityAssessment
    summary: Is it still right? Per use case, from the assessment pass.
    x-egpt-scopes: [monitoring:read]
    responses:
      "200":
        description: Quality.
        content:
          application/json:
            schema:
              $ref: '../schemas/monitoring.yaml#/QualityAssessment'
            examples:
              default:
                value:
                  as_of: "2026-09-07T06:00:00Z"
                  use_cases:
                    - {use_case_id: uc_0001, version: 3, verdict: healthy, golden_pass_rate: 0.95, drift_score: 0.04, assessed_at: "2026-09-07T06:00:00Z", notes: ""}
                    - {use_case_id: uc_0002, version: 1, verdict: unknown, golden_pass_rate: null, drift_score: null, assessed_at: "2026-09-07T06:00:00Z", notes: "No golden set on this version yet."}
              degraded:
                summary: Runs green, answers worse -- the failure execution health cannot see.
                value:
                  as_of: "2026-09-07T06:00:00Z"
                  use_cases:
                    - {use_case_id: uc_0001, version: 4, verdict: degraded, golden_pass_rate: 0.6, drift_score: 0.02, assessed_at: "2026-09-07T06:00:00Z", notes: "Golden pass rate fell from 0.95 on version 3 to 0.6 after the funnel_explanation prompt edit (0.1.0 -> 0.2.0)."}

/monitoring/schedules/silent:
