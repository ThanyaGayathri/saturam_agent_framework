        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/dashboards/{dashboard_id}/refresh:
  post:
    tags: [dashboards]
    operationId: refreshDashboard
    summary: Recompute every query tile now.
    description: Runs each `query` tile through the guard and the warehouse, bounded per statement, and replaces its cached result. `kpi` tiles are untouched -- gold refreshes on its own schedule. This is the "Refresh now" a `manual` schedule relies on.
    x-egpt-scopes: [dashboards:write]
    parameters:
      - $ref: '#/x-egpt-parameters/dashboardId'
    responses:
      "200":
        description: The recomputed data.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/DashboardData'
            examples:
              default:
                value:
                  dashboard_id: dsh_supply
                  tiles:
                    - {tile_id: tl_1, kpi_identifier: supplier__on_time_rate_30d, status: fresh, value: 0.91, unit: "%", delta: -0.04, series: [{at: "2026-08-31T00:00:00Z", value: 0.95}, {at: "2026-09-07T00:00:00Z", value: 0.91}], rows: [], columns: [], as_of: "2026-09-06T23:59:59Z", computed_at: "2026-09-07T02:20:00Z", provenance_ref: run_gold_20260907}
