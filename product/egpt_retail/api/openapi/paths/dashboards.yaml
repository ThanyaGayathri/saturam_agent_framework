    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dashboards.yaml#/TilePatch'
          examples:
            description_only:
              value: {description: "Share of trading hours where a store had zero on-hand units of a listed SKU."}
    responses:
      "200":
        description: The dashboard, with the edited tile.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/Dashboard'
            examples:
              default:
                value:
                  id: dsh_supply
                  name: Supply chain
                  description: Supplier reliability at a glance.
                  tiles:
                    - {id: tl_1, source: kpi, kpi_identifier: supplier__on_time_rate_30d, query: null, title: On-time rate (30d), chart: number, position: {x: 0, y: 0, w: 3, h: 2}, grain_value: null, description: "Share of trading hours where a store had zero on-hand units of a listed SKU.", rationale: ""}
                  filters: [{table: inventory, column: category}]
