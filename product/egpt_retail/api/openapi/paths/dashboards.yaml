                    - {id: tl_4, source: query, kpi_identifier: null, query: {sql: "SELECT supplier_id, count(*) AS late FROM silver.supplier_deliveries WHERE delivered_at > promised_at GROUP BY 1 ORDER BY 2 DESC LIMIT 10", dialect: postgres, source_tables: [supplier_deliveries], x: {column: supplier_id, kind: category, label: "", unit: ""}, y: [{column: late, kind: category, label: Late deliveries, unit: count}], series_by: null}, title: Late deliveries by supplier, chart: bar, position: {x: 0, y: 4, w: 6, h: 2}, grain_value: null, description: Suppliers with the most deliveries after their promised date., rationale: ""}
                  filters: [{table: inventory, column: category}]
