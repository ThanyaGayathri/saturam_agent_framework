    x-egpt-scopes: [dashboards:write]
    parameters:
      - $ref: '#/x-egpt-parameters/dashboardId'
    responses:
      "204":
        description: Deleted.
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/dashboards/{dashboard_id}/data:
  get:
    tags: [dashboards]
    operationId: getDashboardData
    summary: Every tile's values -- kpi tiles from gold, query tiles from their cached result.
    description: |
      One gold read per dashboard, not one per tile, and no live SQL for a query tile, which is
      what keeps a four-tile dashboard from issuing four warehouse scans on every open. Each
      tile carries the computation stamp its rows hold.

      `f` is zero or more `table.column:value` selections -- repeat the parameter once per
      selected value, never a comma-joined list (a distinct value can itself contain a comma,
      e.g. a city named "Dallas, TX") -- read from the URL rather than the saved dashboard,
      since a filter's *values* are per-viewer, transient view-time state (R13.1), never
      persisted, and restricted to columns in the dashboard's own `filters`. With none given,
      this is exactly the cached read above; with at least one, every `query` tile it reaches
      (its `source_tables` intersects an active predicate's table) is recomputed live through
      the warehouse read guard, AND-combining every selection that applies to it; a tile no
      active filter reaches keeps reading from the cache.
    x-egpt-scopes: [dashboards:read]
    parameters:
      - $ref: '#/x-egpt-parameters/dashboardId'
      - name: f
        in: query
        required: false
        schema:
          type: array
          items: {type: string}
        style: form
        explode: true
        description: "A `table.column:value` filter selection; repeat once per value, and again for more than one column."
        example: ["inventory.category:Produce", "inventory.category:Dairy"]
    responses:
      "200":
        description: The data.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/DashboardData'
            examples:
              default:
                value:
                  dashboard_id: dsh_supply
                  tiles:
                    - {tile_id: tl_1, kpi_identifier: supplier__on_time_rate_30d, status: fresh, value: 0.91, unit: "%", delta: -0.04, series: [{at: "2026-08-31T00:00:00Z", value: 0.95}, {at: "2026-09-07T00:00:00Z", value: 0.91}], rows: [], as_of: "2026-09-06T23:59:59Z", computed_at: "2026-09-07T02:20:00Z", provenance_ref: run_gold_20260907}
                    - {tile_id: tl_2, kpi_identifier: supplier__on_time_rate_30d, status: fresh, value: null, unit: "%", delta: null, series: [], rows: [{supplier_id: sup_014, value: 0.71}, {supplier_id: sup_003, value: 0.88}, {supplier_id: sup_021, value: 0.97}], as_of: "2026-09-06T23:59:59Z", computed_at: "2026-09-07T02:20:00Z", provenance_ref: run_gold_20260907}
                    - {tile_id: tl_3, kpi_identifier: null, status: fresh, value: null, unit: count, delta: 3, series: [{at: "2026-06-22T00:00:00Z", value: 31}, {at: "2026-06-29T00:00:00Z", value: 34}], rows: [{wk: "2026-06-22T00:00:00", stockouts: 31}, {wk: "2026-06-29T00:00:00", stockouts: 34}], columns: [wk, stockouts], as_of: null, computed_at: "2026-09-07T02:31:00Z", provenance_ref: null}
                  read_at: "2026-09-07T11:10:00Z"
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/dashboards/{dashboard_id}/filter-columns:
  get:
    tags: [dashboards]
    operationId: getDashboardFilterColumns
    summary: Candidate filter columns across this dashboard's own query tiles.
    description: |
      Text-typed, non-personal-data columns of the tables this dashboard's `query` tiles read --
      what the creation-step filter picker offers, and what a write's `filters` is checked
      against. Empty when the dashboard has no `query` tile (a `kpi` tile is not filterable
      this way, R13.1).
    x-egpt-scopes: [dashboards:read]
    parameters:
      - $ref: '#/x-egpt-parameters/dashboardId'
    responses:
      "200":
        description: Candidate columns.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/dashboards.yaml#/DashboardFilterColumn'
            examples:
              default:
                value: [{table: inventory, column: category}, {table: inventory, column: warehouse}]
              empty:
                value: []
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/dashboards/{dashboard_id}/filter-values:
  get:
    tags: [dashboards]
    operationId: getDashboardFilterValues
    summary: Distinct values of one of this dashboard's chosen filter columns.
    description: For a column's dropdown on the published dashboard. 422 for a `table`/`column` pair that is not one of this dashboard's own `filters` -- this never runs against an arbitrary column, only ones the picker already offered and a write already accepted.
    x-egpt-scopes: [dashboards:read]
    parameters:
      - $ref: '#/x-egpt-parameters/dashboardId'
      - name: table
        in: query
        required: true
        schema: {type: string}
      - name: column
        in: query
        required: true
        schema: {type: string}
    responses:
      "200":
        description: Distinct values.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/DashboardFilterValues'
            examples:
              default:
                value: {table: inventory, column: category, values: [Produce, Dairy, Bakery, Frozen]}
      "404":
        $ref: '#/x-egpt-responses/NotFound'
      "422":
        description: Not one of this dashboard's filter columns.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              invalid:
                value: {detail: "orders.email is not one of this dashboard's filter columns.", code: not_a_filter_column}

x-egpt-parameters:
  dashboardId:
    name: dashboard_id
    in: path
    required: true
    schema: {type: string}
  tileId:
    name: tile_id
    in: path
    required: true
    schema: {type: string}

x-egpt-responses:
  InsufficientScope:
    description: The token lacks a scope this operation requires.
    content:
      application/json:
        schema:
          $ref: '../schemas/common.yaml#/Error'
        examples:
          insufficient_scope:
            value: {detail: "Insufficient permissions. Required scopes: dashboards:write.", code: insufficient_scope}
  NotFound:
    description: No such dashboard.
    content:
      application/json:
        schema:
          $ref: '../schemas/common.yaml#/Error'
        examples:
          not_found:
            value: {detail: "No dashboard 'dsh_9999'.", code: not_found}
