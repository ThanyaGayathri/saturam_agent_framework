          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              refused:
                value: {detail: "Not permitted to read shipments: outside the semantic layer's allow-list.", code: query_refused}

/dashboards/{dashboard_id}/tiles/{tile_id}:
  patch:
    tags: [dashboards]
    operationId: updateDashboardTile
    summary: Edit one tile. Omitted fields are left unchanged; the tile keeps its id.
