# Dashboards (R13, composed charts in 1.2.0). Storage, gold reads for kpi tiles, cached guarded
# reads for query tiles, per-tile edits, and the compose-then-poll suggestion run.

/dashboards:
  get:
    tags: [dashboards]
    operationId: listDashboards
    summary: Dashboards visible to the caller.
    x-egpt-scopes: [dashboards:read]
    responses:
      "200":
        description: Dashboards.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/dashboards.yaml#/Dashboard'
            examples:
              default:
                value:
                  - id: dsh_supply
                    name: Supply chain
                    description: Supplier reliability at a glance.
                    tiles:
                      - {id: tl_1, source: kpi, kpi_identifier: supplier__on_time_rate_30d, query: null, title: On-time rate (30d), chart: number, position: {x: 0, y: 0, w: 3, h: 2}, grain_value: null, description: Deliveries that arrived by their promised date, last 30 days., rationale: ""}
                      - {id: tl_2, source: kpi, kpi_identifier: supplier__on_time_rate_30d, query: null, title: On-time rate by supplier, chart: table, position: {x: 3, y: 0, w: 9, h: 4}, grain_value: null, description: "", rationale: ""}
                      - {id: tl_3, source: query, kpi_identifier: null, query: {sql: "SELECT date_trunc('week', snapshot_at) AS wk, count(*) FILTER (WHERE on_hand_qty = 0) AS stockouts FROM silver.inventory WHERE snapshot_at >= now() - interval '12 weeks' GROUP BY 1 ORDER BY 1 LIMIT 100", dialect: postgres, source_tables: [inventory], x: {column: wk, kind: time, label: Week, unit: ""}, y: [{column: stockouts, kind: category, label: Stock-outs, unit: count}], series_by: null}, title: Stock-outs by week, chart: line, position: {x: 0, y: 2, w: 3, h: 2}, grain_value: null, description: Inventory rows with zero on hand, per week, last 12 weeks., rationale: The purpose asks where stock-outs are trending.}
                    filters: [{table: inventory, column: category}]
                    refresh_schedule: nightly
                    visibility: team
                    owner: analyst@example.test
                    created_at: "2026-09-03T09:00:00Z"
                    updated_at: "2026-09-06T17:00:00Z"
              empty:
                value: []
  post:
    tags: [dashboards]
    operationId: createDashboard
    summary: Create a dashboard from kpi and query tiles.
    description: Every `kpi` tile's `kpi_identifier` must exist and be `ready`; a blocked KPI cannot be tiled, because there would be nothing in gold to read. Every `query` tile's SQL must pass the warehouse read guard; a refused statement is a 422 naming why. Query tiles are computed once on create, then on the refresh schedule.
    x-egpt-scopes: [dashboards:write]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dashboards.yaml#/DashboardWrite'
          examples:
            default:
              value:
                name: Supply chain
                description: Supplier reliability at a glance.
                tiles:
                  - {source: kpi, kpi_identifier: supplier__on_time_rate_30d, title: On-time rate (30d), chart: number, position: {x: 0, y: 0, w: 3, h: 2}, description: Deliveries that arrived by their promised date, last 30 days.}
                  - {source: query, query: {sql: "SELECT date_trunc('week', snapshot_at) AS wk, count(*) FILTER (WHERE on_hand_qty = 0) AS stockouts FROM silver.inventory WHERE snapshot_at >= now() - interval '12 weeks' GROUP BY 1 ORDER BY 1 LIMIT 100", source_tables: [inventory], x: {column: wk, kind: time}, y: [{column: stockouts}]}, title: Stock-outs by week, chart: line, position: {x: 0, y: 2, w: 3, h: 2}, description: Inventory rows with zero on hand, per week, last 12 weeks.}
                filters: [{table: inventory, column: category}]
                refresh_schedule: nightly
                visibility: team
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/Dashboard'
            examples:
              default:
                value:
                  id: dsh_supply
                  name: Supply chain
                  description: Supplier reliability at a glance.
                  tiles:
                    - {id: tl_1, source: kpi, kpi_identifier: supplier__on_time_rate_30d, query: null, title: On-time rate (30d), chart: number, position: {x: 0, y: 0, w: 3, h: 2}, grain_value: null, description: Deliveries that arrived by their promised date, last 30 days., rationale: ""}
                    - {id: tl_3, source: query, kpi_identifier: null, query: {sql: "SELECT date_trunc('week', snapshot_at) AS wk, count(*) FILTER (WHERE on_hand_qty = 0) AS stockouts FROM silver.inventory WHERE snapshot_at >= now() - interval '12 weeks' GROUP BY 1 ORDER BY 1 LIMIT 100", dialect: postgres, source_tables: [inventory], x: {column: wk, kind: time, label: "", unit: ""}, y: [{column: stockouts, kind: category, label: "", unit: ""}], series_by: null}, title: Stock-outs by week, chart: line, position: {x: 0, y: 2, w: 3, h: 2}, grain_value: null, description: Inventory rows with zero on hand, per week, last 12 weeks., rationale: ""}
                  filters: [{table: inventory, column: category}]
                  refresh_schedule: nightly
                  visibility: team
                  owner: analyst@example.test
                  created_at: "2026-09-07T11:00:00Z"
                  updated_at: "2026-09-07T11:00:00Z"
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "422":
        description: A tile references a KPI that is not ready.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              invalid:
                value: {detail: "product__avg_rating is partial (missing: web_sessions) and cannot be tiled.", code: kpi_not_ready}

/dashboards/suggestions:
  post:
    tags: [dashboards]
    operationId: startDashboardSuggestionRun
    summary: Compose a dashboard from a purpose and selected metrics; poll it for the result.
    description: |
      An agent composing a dashboard -- charts and a name -- for what the caller says they
      want to track (filter columns are added afterward, by a person, in the dashboard
      builder). It reads the selected metrics'
      definitions, the semantic layer's tables and columns behind them (descriptions and
      reviewed meanings included, personal-data columns withheld) and the join edges between
      them, then writes the charts the purpose needs: a metric's own SQL where it already
      answers, a composed query across the tables where it does not. Every composed query is
      checked by the warehouse read guard and dry-run before the caller sees it. A run rather
      than a response, the same shape #254 gave KPI suggestions: returns the run `queued`, poll
      `GET /dashboards/suggestions/{run_id}` until `succeeded` (then `result` is the composed
      dashboard) or `failed`. Nothing is stored beyond the run row -- a suggestion becomes a
      dashboard only through `POST /dashboards`, so this needs `dashboards:read`.
    x-egpt-scopes: [dashboards:read]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dashboards.yaml#/DashboardSuggestionRunRequest'
          examples:
            default:
              value:
                purpose: "Show me where stock-outs are costing us margin and whether late suppliers are the cause. Weekly, last 12 weeks."
                kpi_identifiers: [stocklevel__stockout_risk_count, supplier__on_time_rate_30d]
                table_names: []
                chart_budget: 5
    responses:
      "202":
        description: Accepted. Poll the run for completion.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/DashboardSuggestionRun'
            examples:
              default:
                value:
                  id: dsr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: queued
                  stage: null
                  purpose: "Show me where stock-outs are costing us margin and whether late suppliers are the cause. Weekly, last 12 weeks."
                  created_at: "2026-09-15T10:00:00Z"
                  started_at: null
                  finished_at: null
                  result: null
                  error: null
      "422":
        description: The purpose was empty.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              empty:
                value: {detail: "purpose must not be empty.", code: invalid_request}
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

/dashboards/suggestions/{run_id}:
  get:
    tags: [dashboards]
    operationId: getDashboardSuggestionRun
    summary: One dashboard suggestion run, for polling.
    description: |
      Poll until `status` is `succeeded` or `failed`. A run whose serving instance was lost
      mid-run reports `failed` here once the deployment's timeout plus a grace period has
      passed, so a poller always reaches a terminal state.
    x-egpt-scopes: [dashboards:read]
    parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    responses:
      "200":
        description: The run.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/DashboardSuggestionRun'
            examples:
              running:
                value:
                  id: dsr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: running
                  stage: guarding
                  purpose: "Show me where stock-outs are costing us margin and whether late suppliers are the cause. Weekly, last 12 weeks."
                  created_at: "2026-09-15T10:00:00Z"
                  started_at: "2026-09-15T10:00:01Z"
                  finished_at: null
                  result: null
                  error: null
              succeeded:
                value:
                  id: dsr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: succeeded
                  stage: done
                  purpose: "Show me where stock-outs are costing us margin and whether late suppliers are the cause. Weekly, last 12 weeks."
                  created_at: "2026-09-15T10:00:00Z"
                  started_at: "2026-09-15T10:00:01Z"
                  finished_at: "2026-09-15T10:00:42Z"
                  result:
                    name: Stock-outs vs margin
                    charts:
                      - title: Late deliveries this week
                        chart: number
                        source: kpi
                        kpi_identifier: supplier__on_time_rate_30d
                        grain_value: null
                        query: null
                        description: Deliveries that arrived after their promised date, Monday to Sunday.
                        rationale: The purpose asks whether late suppliers are the cause; this is the metric already computed for it.
                        guard: {status: ok, detail: "", tables: []}
                        preview: null
                      - title: Stock-outs by week
                        chart: line
                        source: query
                        kpi_identifier: null
                        grain_value: null
                        query: {sql: "SELECT date_trunc('week', snapshot_at) AS wk, count(*) FILTER (WHERE on_hand_qty = 0) AS stockouts FROM silver.inventory WHERE snapshot_at >= now() - interval '12 weeks' GROUP BY 1 ORDER BY 1 LIMIT 100", dialect: postgres, source_tables: [inventory], x: {column: wk, kind: time, label: Week, unit: ""}, y: [{column: stockouts, kind: category, label: Stock-outs, unit: count}], series_by: null}
                        description: Inventory rows with zero on hand, per week, last 12 weeks.
                        rationale: Shows whether stock-outs are trending in the window the purpose names.
                        guard: {status: ok, detail: "", tables: [inventory]}
                        preview: {guard: {status: ok, detail: "", tables: [inventory]}, sql: "SELECT date_trunc('week', snapshot_at) AS wk, count(*) FILTER (WHERE on_hand_qty = 0) AS stockouts FROM silver.inventory WHERE snapshot_at >= now() - interval '12 weeks' GROUP BY 1 ORDER BY 1 LIMIT 100", columns: [wk, stockouts], rows: [{wk: "2026-06-22T00:00:00", stockouts: 31}, {wk: "2026-06-29T00:00:00", stockouts: 34}], duration_ms: 412, error: null}
                    filters: [{table: inventory, column: category}]
                    notes: ""
                    context: {kpi_identifiers: [stocklevel__stockout_risk_count, supplier__on_time_rate_30d], table_names: [inventory, supplier_deliveries, products], described_columns: 21, total_columns: 24, withheld_columns: [customers.email]}
                  error: null
              failed:
                summary: The bound was hit; the row says so instead of the request hanging.
                value:
                  id: dsr_2f6c1a9e4b7d4c0e8a1f3b5d7e9c2a4b
                  status: failed
                  stage: drafting
                  purpose: "Show me where stock-outs are costing us margin and whether late suppliers are the cause. Weekly, last 12 weeks."
                  created_at: "2026-09-15T10:00:00Z"
                  started_at: "2026-09-15T10:00:01Z"
                  finished_at: "2026-09-15T10:03:01Z"
                  result: null
                  error: "The suggestion run did not finish within 180s."
      "404":
        description: No such run.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              not_found:
                value: {detail: "No suggestion run 'dsr_missing'.", code: not_found}
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

/dashboards/queries/preview:
  post:
    tags: [dashboards]
    operationId: previewDashboardQuery
    summary: Check one query against the warehouse read guard and run it, bounded.
    description: |
      What the chart editor's "Run preview" calls. The statement goes through the same guard
      every other retail read passes -- one read statement, tables restricted to the semantic
      layer (narrowed to `table_names` when given), personal-data columns dropped from the
      projection, a LIMIT added or lowered to the row cap -- and, when it passes, runs with a
      short statement timeout and returns at most 50 rows. Nothing is stored.
    x-egpt-scopes: [dashboards:write]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/dashboards.yaml#/QueryPreviewRequest'
          examples:
            default:
              value:
                query: {sql: "SELECT category, sum(total_amount) AS revenue FROM silver.orders o JOIN silver.products p ON p.product_id = o.product_id GROUP BY 1 ORDER BY 2 DESC"}
                table_names: [orders, products]
    responses:
      "200":
        description: The verdict and, when the statement ran, a sample of its result.
        content:
          application/json:
            schema:
              $ref: '../schemas/dashboards.yaml#/QueryPreview'
            examples:
              rewritten:
                summary: Passed after the guard added a LIMIT.
                value:
                  guard: {status: rewritten, detail: "Added LIMIT 1000 (the row cap).", tables: [orders, products]}
                  sql: "SELECT category, sum(total_amount) AS revenue FROM silver.orders AS o JOIN silver.products AS p ON p.product_id = o.product_id GROUP BY 1 ORDER BY 2 DESC LIMIT 1000"
                  columns: [category, revenue]
                  rows: [{category: Dairy, revenue: 42300.0}, {category: Bakery, revenue: 31050.0}]
                  duration_ms: 412
                  error: null
              refused:
                summary: The guard refused; nothing ran.
                value:
                  guard: {status: refused, detail: "Not permitted to read shipments: outside the semantic layer's allow-list.", tables: [shipments]}
                  sql: "SELECT * FROM shipments"
                  columns: []
                  rows: []
                  duration_ms: 0
                  error: null
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

