# Configure. Derived from configure-workspace.js (internalSources, llmModels, cloudProfile,
# externalIntegrations), business-areas.js and processes.js.

/configure/sources:
  get:
    tags: [configure]
    operationId: listSources
    summary: Internal sources.
    x-egpt-scopes: [config:read]
    responses:
      "200":
        description: Sources.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/configure.yaml#/InternalSource'
            examples:
              default:
                summary: The one source most deployments have -- the warehouse.
                value:
                  - id: src_warehouse
                    source_type: postgres
                    name: Warehouse (silver + gold)
                    host: egpt-warehouse.internal
                    port: 5432
                    database_name: egpt_warehouse
                    schema: silver
                    auth_method: username_password
                    username: egpt_reader
                    ssl_mode: require
                    permission_level: read_only
                    has_credentials: true
                    harvest_state: modelled
                    last_harvest_id: hv_20260907_0200
                    last_harvest_at: "2026-09-07T02:00:00Z"
                    created_at: "2026-09-01T10:00:00Z"
              empty:
                summary: "`ConfigureDatabaseEmpty` -- nothing connected yet."
                value: []
  post:
    tags: [configure]
    operationId: createSource
    summary: Connect an internal source.
    x-egpt-scopes: [configure:write]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/configure.yaml#/InternalSourceWrite'
          examples:
            default:
              value:
                source_type: postgres
                name: Warehouse (silver + gold)
                host: egpt-warehouse.internal
                port: 5432
                database_name: egpt_warehouse
                schema: silver
                auth_method: username_password
                username: egpt_reader
                password: "********"
                ssl_mode: require
                permission_level: read_only
    responses:
      "201":
        description: Created. Credentials are stored, never echoed.
        content:
          application/json:
            schema:
              $ref: '../schemas/configure.yaml#/InternalSource'
            examples:
              default:
                value:
                  id: src_warehouse
                  source_type: postgres
                  name: Warehouse (silver + gold)
                  host: egpt-warehouse.internal
                  port: 5432
                  database_name: egpt_warehouse
                  schema: silver
                  auth_method: username_password
                  username: egpt_reader
                  ssl_mode: require
                  permission_level: read_only
                  has_credentials: true
                  harvest_state: not_started
                  last_harvest_id: null
                  last_harvest_at: null
                  created_at: "2026-09-07T10:00:00Z"
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

/configure/sources/{source_id}:
  get:
    tags: [configure]
    operationId: getSource
    summary: One source.
    x-egpt-scopes: [config:read]
    parameters:
      - $ref: '#/x-egpt-parameters/sourceId'
    responses:
      "200":
        description: The source.
        content:
          application/json:
            schema:
              $ref: '../schemas/configure.yaml#/InternalSource'
            examples:
              default:
                value:
                  id: src_warehouse
                  source_type: postgres
                  name: Warehouse (silver + gold)
                  host: egpt-warehouse.internal
                  port: 5432
                  database_name: egpt_warehouse
                  schema: silver
                  auth_method: username_password
                  username: egpt_reader
                  ssl_mode: require
                  permission_level: read_only
                  has_credentials: true
                  harvest_state: modelled
                  last_harvest_id: hv_20260907_0200
                  last_harvest_at: "2026-09-07T02:00:00Z"
                  created_at: "2026-09-01T10:00:00Z"
      "404":
        $ref: '#/x-egpt-responses/NotFound'
  patch:
    tags: [configure]
    operationId: updateSource
    summary: Update a source. Omitted fields are unchanged.
    x-egpt-scopes: [configure:write]
    parameters:
      - $ref: '#/x-egpt-parameters/sourceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/configure.yaml#/InternalSourcePatch'
          examples:
            default:
              value: {source_type: postgres, name: Warehouse, host: egpt-warehouse.internal, database_name: egpt_warehouse, auth_method: username_password, password: "********"}
    responses:
      "200":
        description: Updated.
        content:
          application/json:
            schema:
              $ref: '../schemas/configure.yaml#/InternalSource'
            examples:
              default:
                value:
                  id: src_warehouse
                  source_type: postgres
                  name: Warehouse
                  host: egpt-warehouse.internal
                  port: 5432
                  database_name: egpt_warehouse
                  schema: silver
                  auth_method: username_password
                  username: egpt_reader
                  ssl_mode: require
                  permission_level: read_only
                  has_credentials: true
                  harvest_state: modelled
                  last_harvest_id: hv_20260907_0200
                  last_harvest_at: "2026-09-07T02:00:00Z"
                  created_at: "2026-09-01T10:00:00Z"
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'
  delete:
    tags: [configure]
    operationId: deleteSource
    summary: Disconnect a source, and remove what its harvest left behind.
    description: |
      A source is more than its row and its stored secret: harvesting it wrote its tables into
      the semantic graph, tagged with its id, and it may have left saved KPI suggestions. The
      delete removes all of it -- the source's tables, columns and their edges in the graph (the
      shared ontology concepts they linked to stay), its suggestion runs, its row and its
      secret. It used to remove only the row and the secret, and the tables it left kept
      claiming their schema, so the next source registered with the same schema was refused
      by the schema-collision guard (`harvest_state: needs_review`) on behalf of a source that
      no longer existed.

      The graph is cleaned **first**. If it (or the suggestion store) cannot be reached the
      answer is `503` and the source is **kept**, in full, so the delete can simply be tried
      again -- deleting the row anyway would be the orphan this exists to prevent. A source
      that was never harvested (`harvest_state: not_started`) has nothing in the graph and is
      deleted without needing it. Dismissed KPI suggestions are kept: a dismissal is a decision
      about a suggestion, not part of a source.
    x-egpt-scopes: [configure:write]
    parameters:
      - $ref: '#/x-egpt-parameters/sourceId'
    responses:
      "204":
        description: Deleted, along with its tables in the semantic graph and its saved suggestions.
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'
      "503":
        description: The source's tables (or saved suggestions) could not be removed, so the source was **not** deleted. Try again.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              graph_unreachable:
                value: {detail: "This source's tables could not be removed from the semantic graph, so the source was not deleted. Try again in a moment.", code: service_unavailable}

/configure/sources/{source_id}/test:
  post:
    tags: [configure]
    operationId: testSource
    summary: Try the connection with the stored credentials.
    x-egpt-scopes: [configure:write]
    parameters:
      - $ref: '#/x-egpt-parameters/sourceId'
    responses:
      "200":
        description: "The outcome. A failure is a 200 with `ok: false` -- the request succeeded, the connection did not."
        content:
          application/json:
            schema:
              type: object
              required: [ok, detail, tested_at]
              properties:
                ok: {type: boolean}
                detail: {type: string}
                tested_at:
                  $ref: '../schemas/common.yaml#/Timestamp'
            examples:
              ok:
                value: {ok: true, detail: "Connected as egpt_reader; 7 tables visible in schema silver.", tested_at: "2026-09-07T10:01:00Z"}
              failed:
                value: {ok: false, detail: "Authentication failed for user egpt_reader.", tested_at: "2026-09-07T10:01:00Z"}
      "404":
        $ref: '#/x-egpt-responses/NotFound'

