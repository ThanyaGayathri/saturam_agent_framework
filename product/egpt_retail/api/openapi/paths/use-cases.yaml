/use-cases/{use_case_id}/spec:
  get:
    tags: [use-cases]
    operationId: getUseCaseSpec
    summary: The last extracted spec.
    x-egpt-scopes: [use-cases:read]
    parameters:
      - $ref: '#/x-egpt-parameters/useCaseId'
    responses:
      "200":
        description: The spec.
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/Spec'
            examples:
              default:
                value:
                  use_case_id: uc_0002
                  question: Which suppliers are slipping on on-time delivery?
                  business_area: supply_chain
                  entities: [{concept: Supplier, role: subject}, {concept: Supplier, role: group_by}]
                  kpi_identifiers: [supplier__on_time_rate_30d]
                  grain: supplier
                  time_window: {length: 30, unit: day}
                  delivery: in_app
                  notes: ""
                  extracted_by: {identifier: spec_extraction, version: "0.1.0"}
                  semantic_snapshot: "r3-contract.1"
      "404":
        description: No spec has been extracted yet, or no such use case.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              not_found:
                value: {detail: "No spec extracted for uc_0002 yet. POST to extract one.", code: not_found}
  post:
    tags: [use-cases]
    operationId: extractUseCaseSpec
    summary: Extract the spec from the draft's questions.
    description: Runs the spec-extraction agent (small tier). Values are drawn from the semantic layer's closed sets; anything the deployment cannot express lands in `notes`, never in a coined value.
    x-egpt-scopes: [use-cases:write]
    parameters:
      - $ref: '#/x-egpt-parameters/useCaseId'
    responses:
      "200":
        description: The extracted spec.
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/Spec'
            examples:
              default:
                value:
                  use_case_id: uc_0002
                  question: Which suppliers are slipping on on-time delivery?
                  business_area: supply_chain
                  entities: [{concept: Supplier, role: subject}, {concept: Supplier, role: group_by}]
                  kpi_identifiers: [supplier__on_time_rate_30d]
                  grain: supplier
                  time_window: {length: 30, unit: day}
                  delivery: in_app
                  notes: ""
                  extracted_by: {identifier: spec_extraction, version: "0.1.0"}
                  semantic_snapshot: "r3-contract.1"
              partial:
                summary: The question asked for something the deployment has no concept for. Said so, in the schema.
                value:
                  use_case_id: uc_0002
                  question: Which suppliers are slipping, and which carriers are to blame?
                  business_area: supply_chain
                  entities: [{concept: Supplier, role: subject}]
                  kpi_identifiers: [supplier__on_time_rate_30d]
                  grain: supplier
                  time_window: {length: 30, unit: day}
                  delivery: in_app
                  notes: "'carriers' matches no concept in this deployment's semantic layer; that part of the question was not extracted."
                  extracted_by: {identifier: spec_extraction, version: "0.1.0"}
                  semantic_snapshot: "r3-contract.1"
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/use-cases/{use_case_id}/gaps:
  get:
    tags: [use-cases]
    operationId: getUseCaseGaps
    summary: What the spec needs that the connected data lacks.
    description: Deterministic. Set differences against the semantic layer and the registry, and join-path lookups. Feasible means every gap list is empty.
    x-egpt-scopes: [use-cases:read]
    parameters:
      - $ref: '#/x-egpt-parameters/useCaseId'
    responses:
      "200":
        description: The gap check.
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/GapCheck'
            examples:
              feasible:
                value: {use_case_id: uc_0002, feasible: true, gaps: [], semantic_snapshot: "r3-contract.1", checked_at: "2026-09-07T09:52:00Z"}
              gaps:
                value:
                  use_case_id: uc_0003
                  feasible: false
                  gaps:
                    - {kind: partial_kpi, subject: product__avg_rating, detail: "Missing from the semantic snapshot: web_sessions. Connect the web analytics source to close this."}
                    - {kind: no_join_path, subject: "product_reviews -> supplier_deliveries", detail: "The semantic layer holds no join between product_reviews and supplier_deliveries. A mapping proposal from the next harvest may add one."}
                  semantic_snapshot: "r3-contract.1"
                  checked_at: "2026-09-07T09:52:00Z"
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/use-cases/{use_case_id}/plan:
  get:
    tags: [use-cases]
    operationId: getUseCasePlan
    summary: The compiled workflow, as steps four and five of the builder render it.
    description: A view, never authored. Each step is an executor from the registry or an agent carrying a skill; the strings here are the ones the stored workflow holds.
    x-egpt-scopes: [use-cases:read]
    parameters:
      - $ref: '#/x-egpt-parameters/useCaseId'
    responses:
      "200":
        description: The plan.
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/Plan'
            examples:
              default:
                summary: The RFQ chain (D12) -- explain-only, one model step.
                value:
                  use_case_id: uc_0001
                  version: 3
                  workflow_component_id: cmp_wf_0001
                  steps:
                    - {index: 1, kind: executor, ref: check_preflight, name: Preflight, description: Confirm every KPI the spec names is ready and every table it reads is exposed., inputs: [spec], outputs: [preflight_result], permits_or_blocks: true, model_tier: null, estimated_seconds: 1}
                    - {index: 2, kind: executor, ref: read_gold, name: Read the funnel KPIs from gold, description: Read quote_requests_by_brand and quote_to_deal_rate at brand grain for the bound as-of date., inputs: [spec, as_of], outputs: [rows, freshness], permits_or_blocks: false, model_tier: null, estimated_seconds: 2}
                    - {index: 3, kind: executor, ref: sample_rows, name: Sample supporting rows, description: Pull a bounded sample through the SQL guard for the explanation to cite., inputs: [rows], outputs: [samples], permits_or_blocks: true, model_tier: null, estimated_seconds: 2}
                    - {index: 4, kind: agent, ref: funnel_explanation, name: Explain the funnel, description: One model step. Explains the numbers; never decides anything., inputs: [rows, samples, freshness], outputs: [explanation], permits_or_blocks: false, model_tier: small, estimated_seconds: 12}
                    - {index: 5, kind: executor, ref: record_provenance, name: Record provenance, description: Write the provenance record for this run., inputs: [rows, samples, freshness, explanation], outputs: [provenance_ref], permits_or_blocks: false, model_tier: null, estimated_seconds: 1}
                    - {index: 6, kind: executor, ref: deliver_in_app, name: Deliver, description: Post the answer in-app with an email pointer (D13)., inputs: [explanation, provenance_ref], outputs: [output_ref], permits_or_blocks: false, model_tier: null, estimated_seconds: 1}
                  compiled_at: "2026-09-06T14:00:00Z"
      "404":
        description: No plan yet -- the use case has no compiled workflow -- or no such use case.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
            examples:
              not_found:
                value: {detail: "uc_0002 has no compiled workflow yet. Complete the draft and run the gap check first.", code: not_found}

/use-cases/{use_case_id}/preflight:
  post:
    tags: [use-cases]
    operationId: runUseCasePreflight
    summary: May this use case run now?
    description: The deterministic executor the activation and run buttons call. A block names its reason.
    x-egpt-scopes: [use-cases:write]
    parameters:
      - $ref: '#/x-egpt-parameters/useCaseId'
    responses:
      "200":
        description: "The result. A block is a 200 with `allowed: false`."
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/PreflightResult'
            examples:
              allowed:
                value:
                  use_case_id: uc_0001
                  allowed: true
                  checks:
                    - {name: kpis_ready, passed: true, reason: "supplier__on_time_rate_30d: ready."}
                    - {name: tables_exposed, passed: true, reason: All tables the spec reads are exposed by the semantic layer.}
                    - {name: gold_fresh, passed: true, reason: "Gold as of 2026-09-06T23:59:59Z, within the 36h freshness bound."}
                    - {name: guard_role, passed: true, reason: Warehouse role egpt_reader is read-only.}
                  blocked_by: []
                  checked_at: "2026-09-07T05:00:00Z"
              blocked:
                summary: A referenced KPI is blocked. Preflight blocks and names it.
                value:
                  use_case_id: uc_0003
                  allowed: false
                  checks:
                    - {name: kpis_ready, passed: false, reason: "product__avg_rating: partial -- missing from the semantic snapshot: web_sessions."}
                    - {name: tables_exposed, passed: true, reason: All tables the spec reads are exposed by the semantic layer.}
                    - {name: gold_fresh, passed: true, reason: "Gold as of 2026-09-06T23:59:59Z, within the 36h freshness bound."}
                    - {name: guard_role, passed: true, reason: Warehouse role egpt_reader is read-only.}
                  blocked_by: [kpis_ready]
                  checked_at: "2026-09-07T09:55:00Z"
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'
      "404":
        $ref: '#/x-egpt-responses/NotFound'

/use-cases/{use_case_id}/activate:
  post:
    tags: [use-cases]
    operationId: activateUseCase
    summary: Publish the compiled workflow and start its schedule.
    description: Runs preflight first and refuses on a block. Level three and above requires `use-cases:activate`, which only the admin role holds (G11) -- separation of duties at activation is enforced by role, as the activation screen shows.
    x-egpt-scopes: [use-cases:write]
    parameters:
      - $ref: '#/x-egpt-parameters/useCaseId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/use-cases.yaml#/ActivationRequest'
          examples:
            default:
              value: {level: 1, autonomy: copilot, schedule: weekly}
    responses:
      "200":
        description: Activated.
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/UseCase'
            examples:
              default:
                value:
                  id: uc_0002
                  title: Supplier reliability watch
                  description: Which suppliers are slipping and where to dual-source.
                  business_area: supply_chain
                  subject_area: Supplier Management
                  tier: operational
                  status: activated
                  source: user
                  level: 1
                  autonomy: copilot
                  tags: [suppliers, otif]
                  sample_question: Which suppliers are slipping on on-time delivery?
                  supporting_questions: []
                  process_id: sc_1
                  linked_kpi_ids: [kpi_0002]
                  workflow_component_id: cmp_wf_0002
                  version: 1
                  gallery_order: null
                  last_run: null
                  updated_at: "2026-09-07T10:00:00Z"
      "403":
        description: The token lacks `use-cases:write`, or the level asked for needs `use-cases:activate`.
        content:
          application/json:
