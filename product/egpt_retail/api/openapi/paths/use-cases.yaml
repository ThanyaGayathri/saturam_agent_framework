# Use cases. Derived from use-cases-catalog.js (the catalog) and use-case-draft.js (which is
# hardcoded model output and maps to R9's spec, gap check and plan rather than to storage).
#
# Definitions themselves are versioned framework components (`/components`); this fragment is
# the retail view over them plus the builder's working state.

/use-cases:
  get:
    tags: [use-cases]
    operationId: listUseCases
    summary: The catalog -- templates, drafts and activated use cases.
    x-egpt-scopes: [use-cases:read]
    parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '../schemas/use-cases.yaml#/UseCaseStatus'
      - name: source
        in: query
        required: false
        schema:
          $ref: '../schemas/use-cases.yaml#/UseCaseSource'
      - name: business_area
        in: query
        required: false
        schema:
          $ref: '../schemas/common.yaml#/BusinessAreaId'
      - name: q
        in: query
        required: false
        schema: {type: string}
        description: Free-text search over title, description and tags. Every token must match.
    responses:
      "200":
        description: Use cases.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/use-cases.yaml#/UseCase'
            examples:
              default:
                summary: "`UseCaseGallery` -- one shipped template, one activated, one draft."
                value:
                  - id: uc_tpl_rfq
                    title: RFQ and Quote Pipeline
                    description: Explain where quote requests are lost between request, quote and deal, and which brands and regions drive it.
                    business_area: sales
                    subject_area: Conversion
                    tier: operational
                    status: template
                    source: template
                    level: 1
                    autonomy: copilot
                    tags: [rfq, quotes, funnel]
                    sample_question: Where are we losing quote requests before they become deals?
                    supporting_questions: ["Which brands convert worst from quote to deal?", "Has quote turnaround time changed this quarter?"]
                    process_id: null
                    linked_kpi_ids: []
                    workflow_component_id: null
                    version: 1
                    gallery_order: 1
                    last_run: null
                    updated_at: "2026-09-01T00:00:00Z"
                  - id: uc_0001
                    title: RFQ funnel -- weekly
                    description: The RFQ template, activated for the sales team.
                    business_area: sales
                    subject_area: Conversion
                    tier: operational
                    status: activated
                    source: user
                    level: 1
                    autonomy: copilot
                    tags: [rfq]
                    sample_question: Where are we losing quote requests before they become deals?
                    supporting_questions: []
                    process_id: null
                    linked_kpi_ids: [kpi_0002]
                    workflow_component_id: cmp_wf_0001
                    version: 3
                    gallery_order: null
                    last_run: {id: run_0042, status: succeeded, started_at: "2026-09-07T05:00:00Z", finished_at: "2026-09-07T05:01:12Z"}
                    updated_at: "2026-09-06T14:00:00Z"
                  - id: uc_0002
                    title: Supplier reliability watch
                    description: ""
                    business_area: supply_chain
                    subject_area: ""
                    tier: null
                    status: draft
                    source: user
                    level: 2
                    autonomy: copilot
                    tags: []
                    sample_question: Which suppliers are slipping on on-time delivery?
                    supporting_questions: []
                    process_id: sc_1
                    linked_kpi_ids: []
                    workflow_component_id: null
                    version: 0
                    gallery_order: null
                    last_run: null
                    updated_at: "2026-09-07T09:40:00Z"
              empty:
                summary: "`UseCasesEmpty`."
                value: []
  post:
    tags: [use-cases]
    operationId: createUseCase
    summary: Start a use case, from a template or from scratch.
    x-egpt-scopes: [use-cases:write]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/use-cases.yaml#/UseCaseWrite'
          examples:
            from_template:
              value: {title: RFQ funnel -- weekly, description: "The RFQ template, activated for the sales team.", business_area: sales, template_id: uc_tpl_rfq, autonomy: copilot, level: 1}
            from_scratch:
              value: {title: Supplier reliability watch, description: "", business_area: supply_chain, sample_question: "Which suppliers are slipping on on-time delivery?", process_id: sc_1}
    responses:
      "201":
        description: Created as a draft.
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/UseCase'
            examples:
              default:
                value:
                  id: uc_0002
                  title: Supplier reliability watch
                  description: ""
                  business_area: supply_chain
                  subject_area: ""
                  tier: null
                  status: draft
                  source: user
                  level: 1
                  autonomy: copilot
                  tags: []
                  sample_question: Which suppliers are slipping on on-time delivery?
                  supporting_questions: []
                  process_id: sc_1
                  linked_kpi_ids: []
                  workflow_component_id: null
                  version: 0
                  gallery_order: null
                  last_run: null
                  updated_at: "2026-09-07T09:40:00Z"
      "403":
        $ref: '#/x-egpt-responses/InsufficientScope'

/use-cases/suggestions:
  get:
    tags: [use-cases]
    operationId: listUseCaseSuggestions
    summary: Use cases proposed from the connected data (K13).
    x-egpt-scopes: [use-cases:read]
    parameters:
      - name: business_area
        in: query
        required: false
        schema:
          $ref: '../schemas/common.yaml#/BusinessAreaId'
    responses:
      "200":
        description: Suggestions, each traceable to the tables that make it feasible.
        content:
          application/json:
            schema:
              $ref: '../schemas/use-cases.yaml#/UseCaseSuggestionList'
            examples:
              default:
                value:
                  suggestions:
                    - title: Supplier lead-time drift
                      description: Flag suppliers whose actual lead time has diverged from expected over the last quarter.
                      business_area: supply_chain
                      rationale: supplier_deliveries holds expected_date and actual_date per delivery, and supplier__avg_lead_time_days is ready.
                      derived_from_tables: [supplier_deliveries]
                      kpi_identifiers: [supplier__on_time_rate_30d]
                      confidence: high
                      template_id: null
                  notes: ""
                  semantic_snapshot: "r3-contract.1"
              refusal:
                value:
                  suggestions: []
                  notes: "No harvested table maps to a concept in business_area 'marketing'."
                  semantic_snapshot: "r3-contract.1"

