# KPI discovery, catalog, feasibility and health. The definition half mirrors
# egpt_retail/contracts/kpi.py (v2.0.0); the presentation half comes from kpi-registry.js.

Grain:
  type: string
  description: A term from the deployment's `grain` vocabulary (shipped ontology plus overlay). A string validated at runtime, not an enum -- see CHANGELOG 2.0.0 of the KPI formula shape.
  examples: [overall, product, supplier, location, time_period]

ResultShape:
  type: string
  enum: [scalar, rowset]
  description: Mirrors `egpt_retail.contracts.kpi.ResultShape`. A `rowset` cannot be alerted on or trended.

Dialect:
  type: string
  enum: [postgres, sqlite]

ParameterKind:
  type: string
  enum: [predicate, scalar]
  description: "`predicate` is an interpolated SQL fragment from an accepted proposal; `scalar` is a driver-bound value. Never interchangeable."

KpiParameter:
  type: object
  required: [name, kind]
  properties:
    name: {type: string}
    kind:
      $ref: './kpis.yaml#/ParameterKind'
    description: {type: string, default: ""}

TimeWindow:
  type: object
  description: A declared lookback relative to the run's as-of date. Never written into the SQL, so yesterday's number can be recomputed.
  required: [length, unit]
  properties:
    length: {type: integer, minimum: 1}
    unit:
      $ref: './kpis.yaml#/TimeWindowUnit'

FormulaExplanation:
  type: object
  description: A human-readable rendering of `sql`, for the discovery panel's FORMULA card -- not a numerator/denominator KPI-to-KPI link (there is no such linkage), just two plain-English labels a renderer can lay out as a fraction. Optional; a KPI without one falls back to showing only the raw SQL.
  required: [expression_before]
  properties:
    expression_before:
      type: string
      description: 'Everything in the expression before the ratio, or the whole expression verbatim when there is no ratio -- e.g. "value = ROUND( 100 x" or "value = COUNT(*)".'
    numerator_label:
      type: [string, "null"]
      description: Plain-English description of the ratio's numerator, e.g. "count of buy inquiries with converted_to_quote = true". Null when the formula has no ratio.
    denominator_label:
      type: [string, "null"]
      description: Plain-English description of the ratio's denominator. Null in exactly the same cases as `numerator_label`.
    expression_after:
      type: string
      default: ""
      description: 'Everything after the ratio, or empty when there is no ratio -- e.g. ", 1 )".'
    condition_label:
      type: [string, "null"]
      description: 'A plain-English "where ..." sentence describing the formula''s filter/window. Null when there''s nothing beyond the ratio itself worth naming.'

KpiLevel:
  type: string
  enum: [strategic, operational, tactical]

SourceTableStatus:
  type: object
  description: One `source_tables` entry's most recent load, read from `quality.load_run`/`quality.load_stream_count` (the same rows the load pipeline itself writes).
  required: [table]
  properties:
    table: {type: string}
    loaded_at:
      type: [string, "null"]
      format: date-time
      description: When the load that produced this table's current row count finished. Null when the table has never loaded.
    row_count: {type: [integer, "null"]}
    load_verdict:
      type: [string, "null"]
      description: "That load's own quality-gate verdict: `passed`, `blocked`, or `failed`."

Kpi:
  type: object
  description: |
    One KPI, as the registry holds it (K11) and the discovery screen renders it. The formula
    fields are the contract shape; the presentation fields are what the registry screen shows.
    `feasibility` is embedded so the list renders its ready/partial/blocked badges without a
    call per row -- it is still a set difference, computed on read, never stored.
  required: [id, identifier, name, description, business_area, grain, result_shape, source_tables, source, active, feasibility]
  properties:
    id: {type: string}
    identifier:
      type: string
      description: "`<concept>__<name>`, stable across edits. What provenance and gold rows reference."
    name: {type: string}
    description: {type: string}
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    subject_area: {type: string, default: ""}
    concept: {type: [string, "null"]}
    grain:
      $ref: './kpis.yaml#/Grain'
    result_shape:
      $ref: './kpis.yaml#/ResultShape'
    dialect:
      $ref: './kpis.yaml#/Dialect'
    sql:
      type: string
      description: The formula with `{named}` placeholders. Returned only to callers holding `kpis:write`; a viewer sees the field absent.
    formula_explanation:
      oneOf:
        - $ref: './kpis.yaml#/FormulaExplanation'
        - type: "null"
      description: A human-readable rendering of `sql`, for the FORMULA card. Gated behind `kpis:write` the same way `sql` is (`_may_read_sql`) -- its labels can name the same columns/tables the formula reads, so it is exactly the schema detail that gate exists to withhold from a `kpis:read`-only caller. Null for a hand-authored KPI, one adopted before this field existed, or a viewer without the scope.
    source_tables:
      type: array
      items: {type: string}
    parameters:
      type: array
      items:
        $ref: './kpis.yaml#/KpiParameter'
    time_window:
      oneOf:
        - $ref: './kpis.yaml#/TimeWindow'
        - type: "null"
    validated_against_snapshot: {type: [string, "null"]}
    level:
      oneOf:
        - $ref: './kpis.yaml#/KpiLevel'
        - type: "null"
    unit: {type: string, default: ""}
    industry_benchmark: {type: string, default: ""}
    rationale:
      type: [string, "null"]
      description: Why the model proposed this KPI -- the sentence naming the tables or concepts it derives from, carried over from `KpiSuggestion.rationale` when the KPI was adopted. Null on a KPI authored by hand or adopted before this field existed.
    business_value:
      type: [string, "null"]
      description: What tracking this KPI lets someone decide or catch, carried over from `KpiSuggestion.business_value` on adopt. Null on a KPI authored by hand or adopted before this field existed.
    active: {type: boolean}
    source:
      $ref: './kpis.yaml#/KpiOrigin'
    dataset_ids:
      type: array
      items: {type: string}
    process_ids:
      type: array
      items: {type: string}
    dashboard_names:
      type: array
      items: {type: string}
      default: []
      description: Names of the dashboards with a tile naming this KPI, sorted. Computed on read from the dashboard table, never stored on the KPI itself -- the same reference check `DELETE /kpis/{kpi_id}` already runs to refuse deleting a KPI still in use, generalized into a read path. Empty when nothing references it yet.
    source_table_status:
      type: array
      items:
        $ref: './kpis.yaml#/SourceTableStatus'
      default: []
      description: Each of `source_tables`' most recent load, from the warehouse's own load history -- only populated by `GET /kpis/{kpi_id}` (a list read never pays for N per-row warehouse queries), and only for a table that resolves to a known landed stream and has actually loaded at least once. Always `[]`, never a partial failure, when the warehouse is unreachable -- this is enrichment for the detail panel, not core KPI data.
    feasibility:
      $ref: './common.yaml#/Feasibility'
    updated_at:
      $ref: './common.yaml#/Timestamp'

KpiWrite:
  type: object
  description: Authoring a KPI. The formula is validated at construction (declared parameters match placeholders, source tables cover the formula) and refused with 422 naming the defect.
  required: [name, description, business_area, grain, sql, source_tables]
  properties:
    identifier: {type: string}
    name: {type: string}
    description: {type: string}
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    subject_area: {type: string}
    concept: {type: [string, "null"]}
    grain:
      $ref: './kpis.yaml#/Grain'
    result_shape:
      $ref: './kpis.yaml#/ResultShape'
    dialect:
      $ref: './kpis.yaml#/Dialect'
    sql: {type: string}
    formula_explanation:
      oneOf:
        - $ref: './kpis.yaml#/FormulaExplanation'
        - type: "null"
      description: The suggestion's `formula_explanation`, resent verbatim when adopting a proposal so the registry keeps it. Optional; an update that omits it carries the stored value forward like every other optional field here.
    source_tables:
      type: array
      items: {type: string}
    parameters:
      type: array
      items:
        $ref: './kpis.yaml#/KpiParameter'
    time_window:
      oneOf:
        - $ref: './kpis.yaml#/TimeWindow'
        - type: "null"
    level:
      oneOf:
        - $ref: './kpis.yaml#/KpiLevel'
        - type: "null"
    unit: {type: string}
    industry_benchmark: {type: string}
    rationale:
      type: [string, "null"]
      description: The suggestion's `rationale`, resent verbatim when adopting a proposal so the registry keeps it. Optional; an update that omits it carries the stored value forward like every other optional field here.
    business_value:
      type: [string, "null"]
      description: The suggestion's `business_value`, resent verbatim on adopt. Optional, carried forward on update when omitted.
    active: {type: boolean}
    dataset_ids:
      type: array
      items: {type: string}
    process_ids:
      type: array
      items: {type: string}

KpiSuggestion:
  type: object
  description: A candidate KPI proposed by the K12 agent. Typed for direct rendering; every closed-set value from the deployment's vocabulary; traceable to named tables or it was invented.
  required: [identifier, name, description, business_area, grain, result_shape, rationale, derived_from_tables, confidence]
  properties:
    identifier: {type: string}
    name: {type: string}
    description: {type: string}
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    concept: {type: [string, "null"]}
    grain:
      $ref: './kpis.yaml#/Grain'
    result_shape:
      $ref: './kpis.yaml#/ResultShape'
    rationale:
      type: string
      description: One sentence naming the tables or concepts it derives from.
    business_value:
      type: [string, "null"]
      description: One or two sentences on why this metric is worth tracking -- what it lets someone decide or catch, distinct from `rationale`'s data provenance. Null on a suggestion from before this field existed.
    derived_from_tables:
      type: array
      items: {type: string}
      minItems: 1
    confidence:
      $ref: './common.yaml#/Confidence'
    proposed_sql: {type: [string, "null"]}
    formula_explanation:
      oneOf:
        - $ref: './kpis.yaml#/FormulaExplanation'
        - type: "null"
      description: A human-readable rendering of `proposed_sql`, for the discovery card's preview before the KPI is adopted. Gated behind `kpis:write` the same way `proposed_sql` is -- its labels can name the same columns/tables the formula reads.
    feasibility:
      $ref: './common.yaml#/Feasibility'
    proposed_by:
      $ref: './common.yaml#/SkillRef'

KpiSuggestionList:
  type: object
  required: [suggestions, notes]
  properties:
    suggestions:
      type: array
      items:
        $ref: './kpis.yaml#/KpiSuggestion'
    notes:
      type: string
      description: Empty on a clean run; otherwise what was missing (the skill template's refusal shape).
    semantic_snapshot: {type: string}

KpiSuggestionRunStatus:
  type: string
  description: Where a suggestion run is. The same four words as `HarvestStatus`, for the same shape.
  enum: [queued, running, succeeded, failed]

KpiSuggestionRunPhase:
  type: string
  description: |
    The stage a `running` suggestion run is in, in order: `reading` (the semantic layer the
    agents are shown is being gathered), `proposing` (the model calls), `checking` (assembly
    and feasibility against the snapshot). What a screen's stepper shows.
  enum: [reading, proposing, checking]

KpiSuggestionRunRequest:
  type: object
  description: |
    What to run. Empty means suggest across every business area with no focus.
    `business_areas` is the focus: the areas the customer cares about, handed to the agents
    as a priority ("propose for these first"), never as a filter -- a proposal outside them
    is kept when the data clearly supports it. `business_area` (one id) is the older
    narrowing filter, applied to what comes back; kept for callers written against 1.1.5,
    new callers should send `business_areas`.
  properties:
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    business_areas:
      type: array
      description: The focus. Each id must be in the deployment's vocabulary (422 otherwise); duplicates are dropped, order is kept.
      items:
        $ref: './common.yaml#/BusinessAreaId'
    ask:
      type: [string, "null"]
      maxLength: 2000
      description: |
        What the customer wants to measure, in their own words ("Add KPI" -> AI generated).
        Handed to the agents as the request to answer first, after the focus and before the
        standing ask -- a steer, never a filter: what comes back is still every metric the data
        supports, judged and stamped exactly as an unprompted run's would be, so a request the
        harvest cannot back produces no invented metric, only the agent's note saying so.
        Whitespace-only reads as absent.

KpiSuggestionRun:
  type: object
  description: |
    One run of the K12 suggestion agent, started by `POST /kpis/suggestions` and polled at
    `GET /kpis/suggestions/{run_id}` (#254). A run is two frontier-tier model calls and can
    take minutes, so it is not served inside a request. `result` is the same
    `KpiSuggestionList` the synchronous route returns, present once `status` is `succeeded`;
    `error` is why there is none, present once `failed`. A run whose executor was lost
    (the serving instance restarted mid-run) is reported `failed` by the read side after the
    deployment's timeout plus a grace period, never `running` forever.

    Two fields are for the person waiting: `phase` is the stage a `running` run is in, and
    `typical_duration_seconds` is how long this deployment's recent runs took, so a screen
    can set an expectation up front and show progress against it.
  required: [id, status, created_at]
  properties:
    id: {type: string}
    status:
      $ref: './kpis.yaml#/KpiSuggestionRunStatus'
    business_area:
      type: [string, "null"]
      description: The area the run was narrowed to, or null for every area.
    business_areas:
      type: array
      default: []
      description: The focus the run was started with (`KpiSuggestionRunRequest.business_areas`), echoed so a poller can see what was asked for. Empty when none.
      items:
        $ref: './common.yaml#/BusinessAreaId'
    ask:
      type: [string, "null"]
      description: The request the run was started with (`KpiSuggestionRunRequest.ask`), echoed so a screen restoring a run can say what it was for. Null when none.
    created_at:
      $ref: './common.yaml#/Timestamp'
    started_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    finished_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    result:
      oneOf:
        - $ref: './kpis.yaml#/KpiSuggestionList'
        - type: "null"
    error:
      type: [string, "null"]
      description: Written for the person polling. A timeout names the bound it hit.
    phase:
      oneOf:
        - $ref: './kpis.yaml#/KpiSuggestionRunPhase'
        - type: "null"
      description: |
        Set while `running`, as each stage begins; null on a `queued` run and on a
        `running` one that has not reached its first stage yet. Kept as it was once the run
        is terminal, so a `failed` run says where it failed.
    typical_duration_seconds:
      type: [number, "null"]
      description: |
        The median wall-clock seconds of this deployment's last few successful runs, or null
        before any has succeeded. An expectation, not a bound: a run may take longer, and the
        deployment's timeout is the only limit.

KpiHealthStatus:
  type: string
  enum: [fresh, stale, never_computed, failed, not_scheduled]

KpiHealth:
  type: object
  description: Freshness from gold (R5). Every gold row is stamped with source and computation time; this is that stamp surfaced.
  required: [kpi_id, status]
  properties:
    kpi_id: {type: string}
    identifier: {type: string}
    status:
      $ref: './kpis.yaml#/KpiHealthStatus'
    last_computed_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    as_of:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
      description: The bound as-of date the last materialisation computed against.
    staleness_hours: {type: [number, "null"]}
    last_run_id: {type: [string, "null"]}
    last_error: {type: [string, "null"]}

KpiSource:
  type: object
  description: A user-added dataset in the KPI gallery (kpi-sources.js). More than a connection -- it carries the business context that turns rows into metrics.
  required: [id, name, description, business_areas]
  properties:
    id: {type: string}
    name: {type: string}
    description: {type: string}
    source_id:
      type: [string, "null"]
      description: The configured internal source it comes from, if known.
    table: {type: [string, "null"]}
    business_areas:
      type: array
      items:
        $ref: './common.yaml#/BusinessAreaId'
    attributes:
      type: array
      items: {type: string}
    linked_kpi_ids:
      type: array
      items: {type: string}
    created_at:
      $ref: './common.yaml#/Timestamp'

KpiSourceWrite:
  type: object
  required: [name, description]
  properties:
    name: {type: string}
    description: {type: string}
    source_id: {type: [string, "null"]}
    table: {type: [string, "null"]}
    business_areas:
      type: array
      items:
        $ref: './common.yaml#/BusinessAreaId'
    attributes:
      type: array
      items: {type: string}
    linked_kpi_ids:
      type: array
      items: {type: string}

KpiImportRequest:
  type: object
  description: The CSV import panel. One row per KPI; columns match `KpiWrite` field names. Rows that fail construction are reported, not silently dropped.
  required: [csv]
  properties:
    csv: {type: string}
    dry_run: {type: boolean, default: false}

KpiImportResult:
  type: object
  required: [imported, rejected]
  properties:
    imported:
      type: array
      items: {type: string}
      description: Identifiers created.
    rejected:
      type: array
      items:
        $ref: './kpis.yaml#/KpiImportRejection'

TimeWindowUnit:
  type: string
  enum: [day, week, month, quarter, year]

KpiOrigin:
  type: string
  enum: [shipped, customer]
  description: Whether the KPI shipped with the product or the customer authored it.

KpiImportRejection:
  type: object
  required: [row, reason]
  properties:
    row: {type: integer}
    reason: {type: string}

KpiSeriesInterval:
  type: string
  enum: [day]
  description: The spacing of `KpiSeries.points`. Gold materialises once a night (D7), so `day` is the only interval today; a coarser one would be an aggregation this contract does not define.

KpiSeries:
  type: object
  description: |
    One KPI's value over its last business dates, read from `gold.kpi_value` -- the same rows
    a dashboard's `line`/`bar` tile plots, addressed by KPI rather than by tile. One point per
    business date the KPI materialised for; a night with no row is absent, not `null` (`null`
    means the formula returned NULL that night). Nothing is recomputed on read.

    A KPI whose grain is not `overall` has one row per dimension value each night; `dimension`
    names the one the points follow (the caller's choice, else the first seen) and
    `dimensions` lists every value the latest night carried, so a screen can offer the others.
  required: [kpi_identifier, grain, interval, days, dimension, dimensions, points, value, delta, status]
  properties:
    kpi_identifier: {type: string}
    grain:
      $ref: './kpis.yaml#/Grain'
    interval:
      $ref: './kpis.yaml#/KpiSeriesInterval'
    days:
      type: integer
      minimum: 1
      description: The window the points were read over, ending at `as_of`.
    unit: {type: string, default: ""}
    dimension:
      type: [object, "null"]
      additionalProperties: true
      description: The grain-key values the points follow; `null` for an `overall` KPI.
    dimensions:
      type: array
      items:
        type: object
        additionalProperties: true
      description: Every dimension the latest business date carried, in gold's row order, capped at 25.
    points:
      type: array
      items:
        $ref: './dashboards.yaml#/SeriesPoint'
      description: Oldest first.
    value:
      type: [number, "null"]
      description: The latest point's value; what a `number` tile of this KPI shows.
    delta:
      type: [number, "null"]
      description: "`value` minus the previous point's value; `null` with fewer than two points."
    as_of:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    computed_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    status:
      $ref: './kpis.yaml#/KpiHealthStatus'
    provenance_ref: {type: [string, "null"]}

KpiComputeStatus:
  type: string
  enum: [materialised, failed, skipped]
  description: Mirrors `gold.kpi_run.status` for the one KPI the call materialised.

KpiComputeResult:
  type: object
  description: |
    The outcome of materialising one KPI for today's business date on demand -- the same
    guarded pass the nightly run performs (`materialise_gold`), narrowed to one identifier.
    `materialised` wrote today's row(s) and `GET /kpis/{kpi_id}/series` now has today's point;
    `failed` names the formula's own error; `skipped` names why the pass would not run it.
  required: [kpi_identifier, as_of, status, rows_written, run_id]
  properties:
    kpi_identifier: {type: string}
    as_of:
      type: string
      format: date
      description: The business date written.
    status:
      $ref: './kpis.yaml#/KpiComputeStatus'
    rows_written: {type: integer, minimum: 0}
    run_id: {type: string}
    error: {type: [string, "null"]}
    reason: {type: [string, "null"]}
