# Dashboards: a named set of KPI references with layout, filters, a refresh schedule and a
# visibility rule. Reads go to gold and nothing else -- never silver, never a live aggregation.

ChartKind:
  type: string
  enum: [number, line, bar, table]

TilePosition:
  type: object
  required: [x, y, w, h]
  properties:
    x: {type: integer, minimum: 0}
    y: {type: integer, minimum: 0}
    w: {type: integer, minimum: 1}
    h: {type: integer, minimum: 1}

Tile:
  type: object
  required: [id, kpi_identifier, chart, position]
  properties:
    id: {type: string}
    kpi_identifier: {type: string}
    title: {type: string, default: ""}
    chart:
      $ref: './dashboards.yaml#/ChartKind'
    position:
      $ref: './dashboards.yaml#/TilePosition'
    grain_value:
      type: [string, "null"]
      description: For a KPI at a non-overall grain, which row -- a supplier id, a location -- this tile shows. Null shows the top-N as a table.

TileWrite:
  type: object
  required: [kpi_identifier, chart, position]
  properties:
    kpi_identifier: {type: string}
    title: {type: string}
    chart:
      $ref: './dashboards.yaml#/ChartKind'
    position:
      $ref: './dashboards.yaml#/TilePosition'
    grain_value: {type: [string, "null"]}

DashboardFilter:
  type: object
  required: [field, value]
  properties:
    field:
      $ref: './dashboards.yaml#/DashboardFilterField'
    value: {type: string}

RefreshSchedule:
  type: string
  enum: [nightly, daily, weekly, hourly, manual]
  description: |
    How often the dashboard's numbers are recomputed -- the declared cadence, stored for the
    scheduler to honour. `nightly` (the default) follows gold: as soon as the nightly
    materialisation completes (D7). `daily` is once a day at a fixed morning time (06:00),
    reading what gold holds. `weekly` is Monday mornings. `hourly` is every hour, capped in
    practice by how often gold materialises. `manual` is only when asked. Distinct from
    delivery (who is sent what, and when), which this contract does not yet carry.

Visibility:
  type: string
  enum: [private, team, everyone]

Dashboard:
  type: object
  required: [id, name, tiles, filters, refresh_schedule, visibility, owner, created_at, updated_at]
  properties:
    id: {type: string}
    name: {type: string}
    description: {type: string, default: ""}
    tiles:
      type: array
      items:
        $ref: './dashboards.yaml#/Tile'
    filters:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardFilter'
    refresh_schedule:
      $ref: './dashboards.yaml#/RefreshSchedule'
    visibility:
      $ref: './dashboards.yaml#/Visibility'
    owner: {type: string}
    created_at:
      $ref: './common.yaml#/Timestamp'
    updated_at:
      $ref: './common.yaml#/Timestamp'

DashboardWrite:
  type: object
  required: [name]
  properties:
    name: {type: string}
    description: {type: string}
    tiles:
      type: array
      items:
        $ref: './dashboards.yaml#/TileWrite'
    filters:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardFilter'
    refresh_schedule:
      $ref: './dashboards.yaml#/RefreshSchedule'
    visibility:
      $ref: './dashboards.yaml#/Visibility'

SeriesPoint:
  type: object
  required: [at, value]
  properties:
    at:
      $ref: './common.yaml#/Timestamp'
    value: {type: [number, "null"]}

TileData:
  type: object
  description: One tile's values from gold, with the stamp every gold row carries so a stale number is distinguishable from a wrong one.
  required: [tile_id, kpi_identifier, status, computed_at]
  properties:
    tile_id: {type: string}
    kpi_identifier: {type: string}
    status:
      $ref: './kpis.yaml#/KpiHealthStatus'
    value: {type: [number, "null"]}
    unit: {type: string, default: ""}
    delta:
      type: [number, "null"]
      description: Change against the previous period at the same grain.
    series:
      type: array
      items:
        $ref: './dashboards.yaml#/SeriesPoint'
    rows:
      type: array
      items: {type: object, additionalProperties: true}
      description: For a `rowset` KPI or a table chart.
    as_of:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    computed_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    provenance_ref: {type: [string, "null"]}

DashboardData:
  type: object
  required: [dashboard_id, tiles, read_at]
  properties:
    dashboard_id: {type: string}
    tiles:
      type: array
      items:
        $ref: './dashboards.yaml#/TileData'
    read_at:
      $ref: './common.yaml#/Timestamp'

DashboardFilterField:
  type: string
  enum: [business_area, time_window]

DashboardSuggestionRunStatus:
  type: string
  description: Where a dashboard suggestion run is. The same four words as `KpiSuggestionRunStatus`.
  enum: [queued, running, succeeded, failed]

DashboardSuggestionRunRequest:
  type: object
  description: What to run. `purpose` is the caller's own words for what the dashboard should help them track.
  required: [purpose]
  properties:
    purpose:
      type: string
      minLength: 1
    preselected_kpi_identifiers:
      type: array
      description: >-
        KPIs the caller already picked before asking for a suggestion (e.g. selected on the KPI
        discovery grid before opening "Create dashboard"). Passed to the agent as already-chosen
        context, not validated here -- an unknown or no-longer-ready identifier is simply not one
        the agent can propose a tile for, the same as any other name it invents.
      items:
        type: string

DashboardTileSuggestion:
  type: object
  description: One candidate metric for the dashboard. Always a real, registered, ready KPI -- the agent selects from this deployment's own registry, it does not invent one.
  required: [kpi_identifier, name, rationale]
  properties:
    kpi_identifier: {type: string}
    name: {type: string}
    rationale:
      type: string
      description: One sentence naming why this metric fits the stated purpose.

DashboardSuggestion:
  type: object
  description: |
    A suggested dashboard configuration for the given purpose, editable before creation. Every
    tile names a real, ready KPI from this deployment's registry; the one filter this agent may
    propose is `business_area`, the one `DashboardFilterField` with a well-defined value space
    to draw from today -- `time_window` has no established value shape anywhere in this contract
    yet (#222), so this agent never proposes one rather than inventing a format nothing else
    would recognise.
  required: [name, tiles, filters, notes]
  properties:
    name: {type: string}
    tiles:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardTileSuggestion'
    filters:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardFilter'
    notes:
      type: string
      description: Empty on a clean run; otherwise what was missing or why the list is short.

DashboardSuggestionRun:
  type: object
  description: |
    One run of the dashboard suggestion agent, started by `POST /dashboards/suggestions` and
    polled at `GET /dashboards/suggestions/{run_id}` -- the same run-then-poll shape #254 gave
    KPI suggestions, for the same reason: a live model call takes long enough that it does not
    belong inside one request, and the api serves from more than one instance. `result` is
    present once `status` is `succeeded`; `error` is why there is none, present once `failed`.
    A run whose executor was lost (the serving instance restarted mid-run) is reported `failed`
    by the read side after the deployment's timeout plus a grace period, never `running` forever.
  required: [id, status, created_at]
  properties:
    id: {type: string}
    status:
      $ref: './dashboards.yaml#/DashboardSuggestionRunStatus'
    purpose: {type: string}
    created_at:
      $ref: './common.yaml#/Timestamp'
    started_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    finished_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    result:
      oneOf:
        - $ref: './dashboards.yaml#/DashboardSuggestion'
        - type: "null"
    error:
      type: [string, "null"]
      description: Written for the person polling. A timeout names the bound it hit.
