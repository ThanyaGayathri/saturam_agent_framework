# Dashboards: a named set of tiles with layout, filters, a refresh schedule and a visibility
# rule. A `kpi` tile references a registered KPI and reads gold; a `query` tile carries its own
# guarded SQL and reads a cached result. Neither runs SQL when a dashboard is opened -- never
# silver, never a live aggregation.

ChartKind:
  type: string
  enum: [number, line, bar, table]

TileSource:
  type: string
  enum: [kpi, query]
  description: |
    Where a tile's numbers come from. `kpi` (the default): a registered, ready KPI's gold
    view. `query`: the tile's own SQL, checked by the warehouse read guard and cached on the
    dashboard's refresh schedule.

AxisKind:
  type: string
  enum: [time, category]

ChartAxis:
  type: object
  description: One result column a `query` tile plots. `kind` matters on the x axis only.
  required: [column]
  properties:
    column: {type: string}
    kind:
      $ref: './dashboards.yaml#/AxisKind'
    label: {type: string, default: ""}
    unit: {type: string, default: ""}

TileQuery:
  type: object
  description: |
    A `query` tile's SQL and how its result maps onto the chart. `source_tables` is derived
    by the server from the SQL at write time and returned for information; a client value is
    ignored. Postgres dialect, one read statement, tables restricted to the semantic layer.
  required: [sql]
  properties:
    sql: {type: string, minLength: 1}
    dialect: {type: string, default: postgres}
    source_tables:
      type: array
      items: {type: string}
    x:
      oneOf:
        - $ref: './dashboards.yaml#/ChartAxis'
        - type: "null"
    y:
      type: array
      items:
        $ref: './dashboards.yaml#/ChartAxis'
    series_by: {type: [string, "null"]}

TilePosition:
  type: object
  required: [x, y, w, h]
  properties:
    x: {type: integer, minimum: 0}
    y: {type: integer, minimum: 0}
    w: {type: integer, minimum: 1}
    h: {type: integer, minimum: 1}

Tile:
  type: object
  required: [id, chart, position, source]
  properties:
    id: {type: string}
    source:
      $ref: './dashboards.yaml#/TileSource'
    kpi_identifier:
      type: [string, "null"]
      description: The KPI a `kpi` tile reads. Null on a `query` tile.
    query:
      oneOf:
        - $ref: './dashboards.yaml#/TileQuery'
        - type: "null"
    title: {type: string, default: ""}
    chart:
      $ref: './dashboards.yaml#/ChartKind'
    position:
      $ref: './dashboards.yaml#/TilePosition'
    grain_value:
      type: [string, "null"]
      description: For a KPI at a non-overall grain, which row -- a supplier id, a location -- this tile shows. Null shows the top-N as a table.
    description:
      type: string
      default: ""
      description: Shown under the chart. Editable; never used to run anything.
    rationale:
      type: string
      default: ""
      description: Why the suggestion agent proposed this chart. Empty on a hand-built tile.

TileWrite:
  type: object
  required: [chart, position]
  description: |
    A tile to create or replace. `source` defaults to `kpi`, which requires `kpi_identifier`;
    `query` requires `query`. `id`, when given on a whole-dashboard write, keeps that tile's
    identity across the write instead of minting a new one -- what lets a per-tile edit leave
    every other tile's id stable.
  properties:
    id: {type: [string, "null"]}
    source:
      $ref: './dashboards.yaml#/TileSource'
    kpi_identifier: {type: [string, "null"]}
    query:
      oneOf:
        - $ref: './dashboards.yaml#/TileQuery'
        - type: "null"
    title: {type: string}
    chart:
      $ref: './dashboards.yaml#/ChartKind'
    position:
      $ref: './dashboards.yaml#/TilePosition'
    grain_value: {type: [string, "null"]}
    description: {type: string}
    rationale: {type: string}

TilePatch:
  type: object
  description: A partial edit of one tile. Every field optional; an omitted field is left unchanged. A changed `query` is re-checked by the guard and recomputed.
  properties:
    title: {type: string}
    chart:
      $ref: './dashboards.yaml#/ChartKind'
    position:
      $ref: './dashboards.yaml#/TilePosition'
    grain_value: {type: [string, "null"]}
    query:
      $ref: './dashboards.yaml#/TileQuery'
    description: {type: string}

DashboardFilter:
  type: object
  required: [field, value]
  properties:
    field:
      $ref: './dashboards.yaml#/DashboardFilterField'
    value: {type: string}

RefreshSchedule:
  type: string
  enum: [nightly, daily, weekly, hourly, manual]
  description: |
    How often the dashboard's numbers are recomputed -- the declared cadence, stored for the
    scheduler to honour. `nightly` (the default) follows gold: as soon as the nightly
    materialisation completes (D7). `daily` is once a day at a fixed morning time (06:00),
    reading what gold holds. `weekly` is Monday mornings. `hourly` is every hour, capped in
    practice by how often gold materialises. `manual` is only when asked. Distinct from
    delivery (who is sent what, and when), which this contract does not yet carry.

Visibility:
  type: string
  enum: [private, team, everyone]

Dashboard:
  type: object
  required: [id, name, tiles, filters, refresh_schedule, visibility, owner, created_at, updated_at]
  properties:
    id: {type: string}
    name: {type: string}
    description: {type: string, default: ""}
    tiles:
      type: array
      items:
        $ref: './dashboards.yaml#/Tile'
    filters:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardFilter'
    refresh_schedule:
      $ref: './dashboards.yaml#/RefreshSchedule'
    visibility:
      $ref: './dashboards.yaml#/Visibility'
    owner: {type: string}
    created_at:
      $ref: './common.yaml#/Timestamp'
    updated_at:
      $ref: './common.yaml#/Timestamp'

DashboardWrite:
  type: object
  required: [name]
  properties:
    name: {type: string}
    description: {type: string}
    tiles:
      type: array
      items:
        $ref: './dashboards.yaml#/TileWrite'
    filters:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardFilter'
    refresh_schedule:
      $ref: './dashboards.yaml#/RefreshSchedule'
    visibility:
      $ref: './dashboards.yaml#/Visibility'

SeriesPoint:
  type: object
  required: [at, value]
  properties:
    at:
      $ref: './common.yaml#/Timestamp'
    value: {type: [number, "null"]}

TileData:
  type: object
  description: One tile's values from gold, with the stamp every gold row carries so a stale number is distinguishable from a wrong one.
  required: [tile_id, status, computed_at]
  properties:
    tile_id: {type: string}
    kpi_identifier:
      type: [string, "null"]
      description: Null on a `query` tile.
    status:
      $ref: './kpis.yaml#/KpiHealthStatus'
    value: {type: [number, "null"]}
    unit: {type: string, default: ""}
    delta:
      type: [number, "null"]
      description: Change against the previous period at the same grain.
    series:
      type: array
      items:
        $ref: './dashboards.yaml#/SeriesPoint'
    rows:
      type: array
      items: {type: object, additionalProperties: true}
      description: For a `rowset` KPI, a table chart, or a `query` tile's cached result.
    columns:
      type: array
      items: {type: string}
      description: Column order of `rows`, for a `query` tile. Empty on a `kpi` tile.
    as_of:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    computed_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    provenance_ref: {type: [string, "null"]}

DashboardData:
  type: object
  required: [dashboard_id, tiles, read_at]
  properties:
    dashboard_id: {type: string}
    tiles:
      type: array
      items:
        $ref: './dashboards.yaml#/TileData'
    read_at:
      $ref: './common.yaml#/Timestamp'

DashboardFilterField:
  type: string
  enum: [business_area, time_window]

DashboardSuggestionRunStatus:
  type: string
  description: Where a dashboard suggestion run is. The same four words as `KpiSuggestionRunStatus`.
  enum: [queued, running, succeeded, failed]

DashboardSuggestionRunRequest:
  type: object
  description: |
    What to run. `purpose` is the caller's own words for what the dashboard should help them
    track. `kpi_identifiers` are the metrics the agent reads as context -- their definitions
    and the tables behind them -- not a list it must tile one for one. `table_names` widens
    the tables it may read beyond those the metrics name. `chart_budget` is a soft cap on
    how many charts to compose; the agent may return fewer.
  required: [purpose]
  properties:
    purpose:
      type: string
      minLength: 1
    kpi_identifiers:
      type: array
      items: {type: string}
    table_names:
      type: array
      items: {type: string}
    chart_budget:
      type: [integer, "null"]
      minimum: 1
      maximum: 12

DashboardSuggestionStage:
  type: string
  description: Where a running suggestion is, for the person waiting. `reading` the metrics and tables, `drafting` charts, `guarding` each query, `previewing` each with real rows.
  enum: [reading, drafting, guarding, previewing, done]

QueryGuardStatus:
  type: string
  enum: [ok, rewritten, refused]
  description: |
    What the warehouse read guard made of a query. `ok`: passed unchanged. `rewritten`: passed
    after a mechanical fix -- a personal-data column dropped from the projection, a missing
    LIMIT added, a LIMIT above the row cap lowered; `detail` says which. `refused`: not
    runnable, `detail` says why; the chart is kept as a stub so the SQL can be fixed.

QueryGuardVerdict:
  type: object
  required: [status, detail]
  properties:
    status:
      $ref: './dashboards.yaml#/QueryGuardStatus'
    detail: {type: string}
    tables:
      type: array
      items: {type: string}
      description: The tables the statement reads, once parsed.

QueryPreview:
  type: object
  description: One query's guard verdict and, when it ran, a bounded sample of its result.
  required: [guard, columns, rows, duration_ms]
  properties:
    guard:
      $ref: './dashboards.yaml#/QueryGuardVerdict'
    sql:
      type: string
      description: The statement as it would run -- the caller's, or the guard's rewrite of it.
    columns:
      type: array
      items: {type: string}
    rows:
      type: array
      items: {type: object, additionalProperties: true}
    duration_ms: {type: integer}
    error:
      type: [string, "null"]
      description: The database's own refusal when the guard passed the statement but the warehouse did not (a typo in a column name, say).

QueryPreviewRequest:
  type: object
  required: [query]
  properties:
    query:
      $ref: './dashboards.yaml#/TileQuery'
    table_names:
      type: array
      items: {type: string}
      description: Narrows the allow-list to these tables when given; otherwise the whole semantic layer.

DashboardChartSuggestion:
  type: object
  description: |
    One composed chart. `source: kpi` reuses a registered, ready KPI's own SQL through gold
    (`kpi_identifier` set, `query` null); `source: query` carries SQL the agent composed from
    the tables it was shown (`query` set). Every `query` chart passed through the warehouse
    read guard and a bounded dry run before reaching the caller; `guard` and `preview` say what
    happened. `description` is written for the person reading the dashboard and is theirs to
    edit.
  required: [title, chart, source, description, rationale, guard]
  properties:
    title: {type: string}
    chart:
      $ref: './dashboards.yaml#/ChartKind'
    source:
      $ref: './dashboards.yaml#/TileSource'
    kpi_identifier: {type: [string, "null"]}
    grain_value: {type: [string, "null"]}
    query:
      oneOf:
        - $ref: './dashboards.yaml#/TileQuery'
        - type: "null"
    description: {type: string}
    rationale: {type: string}
    guard:
      $ref: './dashboards.yaml#/QueryGuardVerdict'
    preview:
      oneOf:
        - $ref: './dashboards.yaml#/QueryPreview'
        - type: "null"

DashboardSuggestion:
  type: object
  description: |
    A suggested dashboard for the given purpose, editable before creation: a name, the charts
    the agent composed from the selected metrics and the tables behind them, and -- when the
    purpose names one -- a `business_area` filter, the one `DashboardFilterField` with a
    well-defined value space (`time_window` has no established value shape in this contract
    yet, #222). `context` says what the agent was shown.
  required: [name, charts, filters, notes]
  properties:
    name: {type: string}
    charts:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardChartSuggestion'
    filters:
      type: array
      items:
        $ref: './dashboards.yaml#/DashboardFilter'
    notes:
      type: string
      description: Empty on a clean run; otherwise what was missing, why the list is short, or what was dropped.
    context:
      $ref: './dashboards.yaml#/SuggestionContextSummary'

SuggestionContextSummary:
  type: object
  description: What the agent read, for the review screen to show.
  properties:
    kpi_identifiers:
      type: array
      items: {type: string}
    table_names:
      type: array
      items: {type: string}
    described_columns: {type: integer}
    total_columns: {type: integer}
    withheld_columns:
      type: array
      items: {type: string}
      description: Personal-data columns, as `table.column`, never shown to the agent.

DashboardSuggestionRun:
  type: object
  description: |
    One run of the dashboard suggestion agent, started by `POST /dashboards/suggestions` and
    polled at `GET /dashboards/suggestions/{run_id}` -- the same run-then-poll shape #254 gave
    KPI suggestions, for the same reason: a live model call takes long enough that it does not
    belong inside one request, and the api serves from more than one instance. `result` is
    present once `status` is `succeeded`; `error` is why there is none, present once `failed`.
    A run whose executor was lost (the serving instance restarted mid-run) is reported `failed`
    by the read side after the deployment's timeout plus a grace period, never `running` forever.
  required: [id, status, created_at]
  properties:
    id: {type: string}
    status:
      $ref: './dashboards.yaml#/DashboardSuggestionRunStatus'
    stage:
      oneOf:
        - $ref: './dashboards.yaml#/DashboardSuggestionStage'
        - type: "null"
    purpose: {type: string}
    created_at:
      $ref: './common.yaml#/Timestamp'
    started_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    finished_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    result:
      oneOf:
        - $ref: './dashboards.yaml#/DashboardSuggestion'
        - type: "null"
    error:
      type: [string, "null"]
      description: Written for the person polling. A timeout names the bound it hit.
