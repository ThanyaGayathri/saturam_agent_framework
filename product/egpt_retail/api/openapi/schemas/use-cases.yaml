# Use cases: the catalog, the builder draft, R9's spec / gap check / plan, preflight,
# activation and runs. Derived from use-cases-catalog.js and use-case-draft.js -- the second
# of which is hardcoded model output, not storage, and maps to endpoints rather than a resource.

UseCaseStatus:
  type: string
  enum: [template, draft, activated, paused, retired]

UseCaseSource:
  type: string
  enum: [template, user]
  description: Whether the entry shipped with the product as a template or the customer authored it.

UseCaseShape:
  type: string
  enum: [inform, alert, recommend, act]
  description: |
    What the use case does to the world (1.2.0, R-15): nothing, notify, write after a person
    approves, write unattended. The shape is a property of the spec -- each shape has its own
    form, chosen before the form is filled -- and it decides the parameter list, the workflow
    the orchestration compiler generates, the readiness checks, and who may activate.
    Mirrors `contracts.use_case.UseCaseShape`; the shipped vocabulary `use_case_shape` renders
    the same four.

UseCaseTemplate:
  type: string
  enum: [kpi_change, document_to_record]
  description: |
    The sequence within a shape, where a shape has more than one (1.2.0). `kpi_change` is the
    Act sequence as section 07 describes it; `document_to_record` is the Act sequence a
    document-driven automation needs -- receive, screen, extract, resolve -- before the same
    guarded write. Both are Act. The interface reads the template from the requirement's own
    words and never asks for it; the compiler checks it belongs to the shape.

Autonomy:
  type: string
  enum: [copilot, autopilot]
  description: "`copilot` surfaces decision cards for a person; `autopilot` executes within guardrails."

UseCase:
  type: object
  description: |
    A use case is three artifacts -- a stored workflow component, the skill prompts its agent
    steps carry, and a spec record holding what the author asked for. This is the catalog view
    over all three. `level` is the autonomy level the activation screen shows; activating at
    three or above needs the admin role (G11).
  required: [id, title, description, business_area, status, source, level, autonomy, version, updated_at]
  properties:
    id: {type: string}
    title: {type: string}
    description: {type: string}
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    subject_area: {type: string, default: ""}
    tier:
      oneOf:
        - $ref: './kpis.yaml#/KpiLevel'
        - type: "null"
    status:
      $ref: './use-cases.yaml#/UseCaseStatus'
    source:
      $ref: './use-cases.yaml#/UseCaseSource'
    level:
      type: integer
      minimum: 1
      maximum: 5
    autonomy:
      $ref: './use-cases.yaml#/Autonomy'
    tags:
      type: array
      items: {type: string}
    sample_question: {type: string, default: ""}
    supporting_questions:
      type: array
      items: {type: string}
    process_id: {type: [string, "null"]}
    linked_kpi_ids:
      type: array
      items: {type: string}
    workflow_component_id:
      type: [string, "null"]
      description: The framework component (`/components`) holding the compiled workflow, once one exists.
    version:
      type: integer
      description: Bumped on publish. Runs and golden sets are attributed to a version (R15).
    gallery_order: {type: [integer, "null"]}
    last_run:
      oneOf:
        - $ref: './use-cases.yaml#/UseCaseRunSummary'
        - type: "null"
    updated_at:
      $ref: './common.yaml#/Timestamp'

UseCaseWrite:
  type: object
  required: [title, description, business_area]
  properties:
    title: {type: string}
    description: {type: string}
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    subject_area: {type: string}
    tags:
      type: array
      items: {type: string}
    sample_question: {type: string}
    supporting_questions:
      type: array
      items: {type: string}
    process_id: {type: [string, "null"]}
    linked_kpi_ids:
      type: array
      items: {type: string}
    autonomy:
      $ref: './use-cases.yaml#/Autonomy'
    level:
      type: integer
      minimum: 1
      maximum: 5
    template_id:
      type: [string, "null"]
      description: When creating from a template, the template's id; the draft is prefilled from it.

UseCaseDraft:
  type: object
  description: |
    The builder's working state, steps one to nine. Persisted as a whole because the wizard
    reads and writes it as a whole. Steps four and five (`plan_items`, `tasks`) are deliberately
    absent: they are derived views served by `GET /use-cases/{id}/plan` over the compiled
    workflow, never authored here -- a plan authored in parallel with the workflow is the
    failure the build plan names.
  required: [version, step1, step2, step3, step8]
  properties:
    version: {type: integer}
    step1:
      $ref: './use-cases.yaml#/DraftStep1'
    step2:
      $ref: './use-cases.yaml#/DraftStep2'
    step3:
      $ref: './use-cases.yaml#/DraftStep3'
    step6:
      $ref: './use-cases.yaml#/DraftStep6'
    step7:
      $ref: './use-cases.yaml#/DraftStep7'
    step8:
      $ref: './use-cases.yaml#/DraftStep8'
    step9:
      $ref: './use-cases.yaml#/DraftStep9'
    updated_at:
      $ref: './common.yaml#/Timestamp'

SpecEntity:
  type: object
  required: [concept, role]
  properties:
    concept:
      type: string
      description: A concept name from the semantic layer. Closed set, rendered from `GET /semantic/concepts`.
    role:
      $ref: './use-cases.yaml#/SpecEntityRole'

Spec:
  type: object
  description: |
    What the author asked for, extracted by the spec-extraction agent (R9, Lane R's first
    skill). Every closed-set value comes from the semantic layer and the vocabulary; an entity
    the deployment does not have cannot appear here, it appears in `notes` instead.
  required: [use_case_id, question, business_area, entities, kpi_identifiers, grain, notes, extracted_by]
  properties:
    use_case_id: {type: string}
    question: {type: string}
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    entities:
      type: array
      items:
        $ref: './use-cases.yaml#/SpecEntity'
    kpi_identifiers:
      type: array
      items: {type: string}
    grain:
      $ref: './kpis.yaml#/Grain'
    time_window:
      oneOf:
        - $ref: './kpis.yaml#/TimeWindow'
        - type: "null"
    delivery:
      $ref: './monitoring.yaml#/DeliveryChannel'
    notes:
      type: string
      description: Empty on a clean extraction; otherwise what the question asked for that the deployment cannot express.
    questions:
      type: array
      items: {type: string}
      description: |
        Clarifying questions for the author (1.1.0, R9). Where `notes` records what could not be
        expressed, this records what the agent needs answered before the spec is complete -- a
        metric it could not match to the registry, or a sentence ambiguous about whether the use
        case should act. Empty on a clean extraction. A question is the refusal shape for an
        unknown; the agent never coins a value to avoid asking one.
    extracted_by:
      $ref: './common.yaml#/SkillRef'
    semantic_snapshot: {type: string}
    shape:
      oneOf:
        - $ref: './use-cases.yaml#/UseCaseShape'
        - type: "null"
      description: |
        The shape the form was filled against (1.2.0, R-15). Null only on a spec extracted
        before a shape was chosen; the compiler refuses a null shape rather than defaulting
        to Inform.
    template:
      oneOf:
        - $ref: './use-cases.yaml#/UseCaseTemplate'
        - type: "null"
      description: The sequence within the shape, where the shape has more than one (1.2.0). Null means the shape's own sequence.
    parameters:
      type: object
      additionalProperties: true
      description: |
        The per-shape form's values, keyed by parameter name exactly as
        `contracts.use_case.SHAPE_PARAMETERS[shape]` (or `TEMPLATE_PARAMETERS[template]`)
        lists them (1.2.0, R-15): for Inform `metrics, dimensions, comparison, schedule,
        recipient`; for Alert `metric, operator, threshold, scope, severity, recipient,
        schedule`; for Recommend `candidates, metrics, guardrails, approver, write target,
        timeout behaviour, schedule`; for Act `candidates, metrics, guardrails, write target,
        per-run cap, rollback, schedule`; for the `document_to_record` template `source
        mailbox, message filter, document type, extraction template, example document,
        master data, match thresholds, guardrails, recipient, acknowledge, write target,
        target objects, created as, per-run cap, rollback, schedule`. Keys may be written as
        the name or its slug (`per-run cap` or `per_run_cap`). The gap check and the compiler
        read this one place; a value the author typed on the form (the draft) still wins over
        a value the extractor put here, and the compiled workflow records which.

        Value shapes, so the interface and the compiler agree: `guardrails` is a list of
        `{metric, operator (gte|lte), threshold, unit}` for the KPI shapes and a list of
        `GuardrailRule` rows for `document_to_record` (1.4.0; the legacy `{id, param}` rows
        naming the purchase-order preset -- duplicate_po, unknown_sender, first_time_product,
        quantity_anomaly, due_date_sanity, restricted_product -- are still read);
        `extraction template` is a shipped template's id or an `ExtractionTemplate` object
        the form assembled (1.4.0); `target objects` is a shipped mapping's id or a
        `RecordMapping` object the form assembled over the target's live fields (1.5.0); `candidates` is `{concept, filter}`;
        `recipient` is `{who, channels[]}` where channels are `DeliveryChannel` values;
        `master data` is `{customer, contact, shipTo, product, orderHistory}` naming
        semantic-layer objects; `match thresholds` is `{address, product, name, ambiguity,
        aiDisambiguation}`; `timeout behaviour` is one of `cancel, remind, escalate, proceed`;
        `created as` is `draft` or `active`. Everything else is a string.

GapKind:
  type: string
  enum: [missing_table, blocked_kpi, partial_kpi, unknown_concept, no_join_path, unsupported_area, missing_parameter, unknown_grain]
  description: |
    `missing_parameter` (1.1.0, R9): a slot the chosen autonomy shape requires (build plan, section 07)
    that the draft and spec do not fill -- metrics, dimensions, comparison, schedule, recipient for
    Inform; candidates, guardrails, approver, write target and more for Recommend and Act. `subject`
    is the parameter name; `detail` says which builder field fills it, or that none exists yet.

    `unknown_grain` (1.1.1, R9): `spec.grain` is not in this deployment's grain vocabulary.
    The same ground truth `spec_extractor.validate_spec` checks at extraction time, re-checked
    here so a coined value is caught deterministically whether or not that validator ran first.
    `subject` is the coined value; `detail` says to add it to the customer overlay or pick a
    listed one.

Gap:
  type: object
  required: [kind, subject, detail]
  properties:
    kind:
      $ref: './use-cases.yaml#/GapKind'
    subject: {type: string}
    detail:
      type: string
      description: What to connect or confirm to close the gap. Written for the customer.

GapCheck:
  type: object
  description: A deterministic check of the spec against the semantic layer and the KPI registry. Set differences and join-path lookups; no model is consulted.
  required: [use_case_id, feasible, gaps, semantic_snapshot, checked_at]
  properties:
    use_case_id: {type: string}
    feasible: {type: boolean}
    gaps:
      type: array
      items:
        $ref: './use-cases.yaml#/Gap'
    semantic_snapshot: {type: string}
    checked_at:
      $ref: './common.yaml#/Timestamp'

PlanStepKind:
  type: string
  enum: [executor, agent]

PlanStep:
  type: object
  description: One step of the compiled workflow. `ref` is an executor name from the registry or a skill identifier -- the same strings the stored workflow holds.
  required: [index, kind, ref, name, description]
  properties:
    index: {type: integer}
    kind:
      $ref: './use-cases.yaml#/PlanStepKind'
    ref: {type: string}
    name: {type: string}
    description: {type: string}
    inputs:
      type: array
      items: {type: string}
    outputs:
      type: array
      items: {type: string}
    permits_or_blocks:
      type: boolean
      description: True for the executors that can stop the run -- preflight, guard, feasibility. Always false for an agent step, by the alignment rules.
    model_tier:
      oneOf:
        - $ref: './configure.yaml#/ModelTier'
        - type: "null"
    estimated_seconds: {type: [integer, "null"]}

Plan:
  type: object
  description: A view over the compiled workflow, never authored separately. Steps four and five of the prototype's wizard render this.
  required: [use_case_id, version, steps, compiled_at]
  properties:
    use_case_id: {type: string}
    version: {type: integer}
    workflow_component_id: {type: [string, "null"]}
    steps:
      type: array
      items:
        $ref: './use-cases.yaml#/PlanStep'
    compiled_at:
      $ref: './common.yaml#/Timestamp'

PreflightCheck:
  type: object
  required: [name, passed, reason]
  properties:
    name: {type: string}
    passed: {type: boolean}
    reason: {type: string}

PreflightResult:
  type: object
  description: Whether the use case may run now. A deterministic executor's answer; if it blocks, the reason is one a person can act on.
  required: [use_case_id, allowed, checks, checked_at]
  properties:
    use_case_id: {type: string}
    allowed: {type: boolean}
    checks:
      type: array
      items:
        $ref: './use-cases.yaml#/PreflightCheck'
    blocked_by:
      type: array
      items: {type: string}
      description: Names of the checks that failed.
    checked_at:
      $ref: './common.yaml#/Timestamp'

ActivationRequest:
  type: object
  properties:
    level:
      type: integer
      minimum: 1
      maximum: 5
    autonomy:
      $ref: './use-cases.yaml#/Autonomy'
    schedule:
      $ref: './use-cases.yaml#/ScheduleCadence'

RunStatus:
  type: string
  enum: [queued, running, succeeded, failed, blocked, cancelled]

RunTrigger:
  type: string
  enum: [schedule, manual, activation, regression]
  description: "`regression` (1.6.0): a rehearsal over the golden cases the platform started because the use case changed."
RunMode:
  type: string
  enum: [live, rehearse]
  description: |
    `live` writes to the target and sends what it sends. `rehearse` (1.3.0) runs the same
    compiled workflow with every side effect held and, where the template has one, over the
    deployment's sample set -- the rehearse screen's numbers come from this, not from a
    simulation of their own.

UseCaseRunSummary:
  type: object
  required: [id, status, started_at]
  properties:
    id: {type: string}
    status:
      $ref: './use-cases.yaml#/RunStatus'
    started_at:
      $ref: './common.yaml#/Timestamp'
    finished_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"

UseCaseRun:
  type: object
  description: One run, keyed by use case and version (G12), holding its status, output reference and provenance reference. What "why did last Tuesday's run say that" hits.
  required: [id, use_case_id, use_case_version, status, trigger, started_at]
  properties:
    id: {type: string}
    use_case_id: {type: string}
    use_case_version: {type: integer}
    status:
      $ref: './use-cases.yaml#/RunStatus'
    trigger:
      $ref: './use-cases.yaml#/RunTrigger'
    started_at:
      $ref: './common.yaml#/Timestamp'
    finished_at:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
    framework_run_id:
      type: [string, "null"]
      description: The framework's run id, for the session and run-history endpoints.
    output_ref:
      type: [string, "null"]
      description: Where the delivered answer lives -- a report id, or a knowledge document id once ingested (G12).
    provenance_ref:
      type: [string, "null"]
      description: "`GET /runs/{run_id}/provenance`."
    summary: {type: string, default: ""}
    blocked_reason: {type: [string, "null"]}
    cost:
      $ref: './use-cases.yaml#/RunCost'
    mode:
      $ref: './use-cases.yaml#/RunMode'
    result:
      type: [object, "null"]
      additionalProperties: true
      description: |
        What the run's last executor returned (1.3.0): for a document-to-record run, the batch
        -- `documents` carried through with what was written, `exceptions` with their class and
        detail, `stats` per stage, `rollback` -- so the interface shows what was created and what
        was held without re-running anything. Null while queued or running, and for a run that
        failed before any executor returned.

UseCaseSuggestion:
  type: object
  description: A use case proposed from the connected data and the catalog (K13). Shares inputs and output discipline with KPI suggestion.
  required: [title, description, business_area, rationale, derived_from_tables, kpi_identifiers, confidence]
  properties:
    title: {type: string}
    description: {type: string}
    business_area:
      $ref: './common.yaml#/BusinessAreaId'
    rationale: {type: string}
    derived_from_tables:
      type: array
      items: {type: string}
      minItems: 1
    kpi_identifiers:
      type: array
      items: {type: string}
    confidence:
      $ref: './common.yaml#/Confidence'
    template_id: {type: [string, "null"]}

UseCaseSuggestionList:
  type: object
  required: [suggestions, notes]
  properties:
    suggestions:
      type: array
      items:
        $ref: './use-cases.yaml#/UseCaseSuggestion'
    notes: {type: string}
    semantic_snapshot: {type: string}

SpecEntityRole:
  type: string
  enum: [subject, filter, measure, group_by]

ScheduleCadence:
  type: string
  enum: [once, daily, weekly, monthly, hourly, every_15_minutes, every_5_minutes, every_minute]
  description: |
    The four the KPI shapes offer, plus the poll intervals a document-driven use case
    offers (1.3.0): a mailbox is polled, not read nightly.

DraftViewMode:
  type: string
  enum: [flow, list]

DraftStep1:
  type: object
  required: [title, description, category]
  properties:
    title: {type: string}
    description: {type: string}
    category:
      $ref: './common.yaml#/BusinessAreaId'
    tags: {type: string}
    autonomy:
      $ref: './use-cases.yaml#/Autonomy'

DraftStep2:
  type: object
  required: [primary_question]
  properties:
    primary_question: {type: string}
    supporting_questions:
      type: array
      items: {type: string}

DraftStep3:
  type: object
  description: Data scope. Every id here is a configured source, a knowledge collection or a semantic table -- validated on save, so the plan cannot reference something that does not exist.
  properties:
    confirmed_source_ids:
      type: array
      items: {type: string}
    confirmed_knowledge_ids:
      type: array
      items: {type: string}
    semantic_tables:
      type: array
      items: {type: string}

DraftStep6:
  type: object
  properties:
    view_mode:
      $ref: './use-cases.yaml#/DraftViewMode'

DraftStep7:
  type: object
  properties:
    acknowledged: {type: boolean}

DraftStep8:
  type: object
  required: [schedule]
  properties:
    schedule:
      $ref: './use-cases.yaml#/ScheduleCadence'
    guardrail_amount: {type: [number, "null"]}
    delivery:
      $ref: './monitoring.yaml#/DeliveryChannel'
    recipient: {type: string}

DraftStep9:
  type: object
  properties:
    execution_done: {type: boolean}

RunCost:
  type: object
  properties:
    model_tier: {type: string}
    input_tokens: {type: integer}
    output_tokens: {type: integer}

ExtractionTemplateField:
  type: object
  required: [name]
  properties:
    name: {type: string, description: "snake_case field name; the extraction step fills exactly this."}
    required: {type: boolean, default: false}
    hint:
      type: string
      default: ""
      description: Where on the document the field is usually found, for the extractor.
ExtractionTemplate:
  type: object
  description: |
    A document kind the Extract stage fills (1.4.0). The three shipped ones are rows of the
    same shape; a template a person assembles on the form, or the model drafts from a
    description and an example, is stored on the use case's spec as the `extraction template`
    parameter and runs the same extractor. Nothing about a template is code.
  required: [label, header, lines]
  properties:
    id:
      type: string
      description: Slug; derived from the label when absent.
    label: {type: string}
    record: {type: string, default: "", description: "What one document becomes: order, payable, return, receipt."}
    header:
      type: array
      items:
        $ref: './use-cases.yaml#/ExtractionTemplateField'
    lines:
      type: array
      items:
        $ref: './use-cases.yaml#/ExtractionTemplateField'
    source:
      type: string
      enum: [shipped, drafted, authored]
      description: Where the template came from; `authored` when absent.
ExtractionTemplateDraftRequest:
  type: object
  required: [description]
  properties:
    description: {type: string, description: "The use case's own words: what arrives and what it should become."}
    label: {type: string, description: "The document kind's name, when the person has one."}
    example_text: {type: string, description: "The text of an example document, when one is at hand."}
    example_document_b64: {type: string, description: "A PDF of an example document, base64; its text layer is read server-side."}
ExtractionTemplateDraft:
  type: object
  required: [template, notes]
  properties:
    template:
      $ref: './use-cases.yaml#/ExtractionTemplate'
    notes: {type: string, description: "What the model was unsure about; empty on a clean draft."}
GuardrailRuleKind:
  type: object
  description: A kind of check the platform can evaluate (1.4.0). A guardrail is one of these applied to a field with parameters.
  required: [id, label, check, scope, params, exception]
  properties:
    id: {type: string}
    label: {type: string}
    check: {type: string, description: "The check in plain words, with {field} and parameter placeholders."}
    scope: {type: string, enum: [header, line, any, none]}
    params:
      type: object
      additionalProperties: {type: number}
      description: Parameter names with their defaults.
    needs: {type: [string, "null"], description: "The master-data role the check reads, or null."}
    exception: {type: string}
GuardrailRule:
  type: object
  description: |
    One business guardrail (1.4.0): a kind applied to a field, with its parameters and the
    exception it raises. The `guardrails` parameter of a `document_to_record` spec is a list
    of these; the six purchase-order rows keep their ids and exception classes as a preset.
  required: [id, kind]
  properties:
    id: {type: string}
    kind: {type: string}
    label: {type: string}
    field: {type: [string, "null"]}
    line_field: {type: [string, "null"], description: "For total checks, the line field summed; for item checks, the resolved entity on the line."}
    params:
      type: object
      additionalProperties: {type: number}
    exception: {type: string}
    needs: {type: [string, "null"]}

TargetObject:
  type: object
  description: One object a write target lets the integration create (1.5.0), read live from the target.
  required: [name, label]
  properties:
    name: {type: string}
    label: {type: string}
    custom: {type: boolean, default: false}
TargetField:
  type: object
  description: One createable field of a target object, read live (1.5.0).
  required: [name, label, type, required]
  properties:
    name: {type: string}
    label: {type: string}
    type: {type: string, description: "The target's own type name: string, reference, date, double, picklist, ..."}
    required: {type: boolean, description: "A create fails without it: not nillable and no default."}
    reference_to:
      type: array
      items: {type: string}
    length: {type: [integer, "null"]}
    picklist_values:
      type: array
      items: {type: string}
    custom: {type: boolean, default: false}
TargetObjectDescription:
  type: object
  required: [name, label, fields]
  properties:
    name: {type: string}
    label: {type: string}
    fields:
      type: array
      items:
        $ref: './use-cases.yaml#/TargetField'
MappingFieldRow:
  type: object
  description: |
    One target field and where its value comes from (1.5.0). `source` is a list of source
    expressions over the resolved document, the first non-empty winning: a header field by
    name (`po_number`), `line.<field>`, `customer.<key>`, `ship_to.<key>`, `product.<key>`,
    `$pricebook_id`, `$today`, or a literal `=Draft`. `transform` is one of `date`,
    `date_not_before_today`, `number`, `text:<n>`.
  required: [target, source]
  properties:
    target: {type: string}
    source:
      type: array
      items: {type: string}
    required: {type: boolean, default: false}
    transform: {type: [string, "null"]}
    label: {type: string, default: ""}
ChildMapping:
  type: object
  required: [object, parent_field, fields]
  properties:
    object: {type: string}
    parent_field: {type: string, description: "The child's reference to the parent, filled with the parent's new id."}
    fields:
      type: array
      items:
        $ref: './use-cases.yaml#/MappingFieldRow'
RecordMapping:
  type: object
  description: |
    How a resolved document becomes the target's objects (1.5.0): a parent object with its
    field rows, an optional child repeated per line, the status field `created as` sets, and
    the rollback action. The two Salesforce mappings that ship are rows of this shape; a
    mapping the form assembles over the target's live object metadata is stored on the spec
    as the `target objects` parameter and runs the same interpreter.
  required: [label, object, fields]
  properties:
    id: {type: string}
    label: {type: string}
    target: {type: string, default: salesforce}
    object: {type: string}
    record: {type: string, default: "", description: "What the mapping creates, matched against a template's `record` when suggesting."}
    source:
      type: string
      enum: [shipped, suggested, authored]
    fields:
      type: array
      items:
        $ref: './use-cases.yaml#/MappingFieldRow'
    child:
      oneOf:
        - $ref: './use-cases.yaml#/ChildMapping'
        - type: "null"
    status_field: {type: [string, "null"]}
    status_values:
      type: object
      additionalProperties: {type: string}
      description: "`created as` value -> the status written: {draft: Draft, active: Activated}."
    rollback_action: {type: string, default: delete}
MappingSuggestRequest:
  type: object
  required: [template, parent]
  properties:
    template:
      $ref: './use-cases.yaml#/ExtractionTemplate'
    parent: {type: string, description: "The parent object's name, described live."}
    child: {type: [string, "null"], description: "The per-line object's name, when there is one."}
    label: {type: string}

RehearsalSource:
  type: string
  enum: [mailbox, cases, generated]
  description: |
    What a rehearsal runs over (1.6.0): chosen messages from the connected mailbox (writes
    held, nothing flagged); the use case's own golden cases; or the set the platform
    generates from the template. Absent means the mailbox when one is connected and a model
    can read it, else the generated set.
RunRequest:
  type: object
  description: |
    What to run over (1.6.0). Only a rehearsal reads it; a live run always polls the mailbox.
  properties:
    source:
      $ref: './use-cases.yaml#/RehearsalSource'
    message_ids:
      type: array
      items: {type: string}
      description: "With source mailbox, only these message ids; absent means every message matching the filter."
    case_ids:
      type: array
      items: {type: string}
      description: "With source cases or generated, only these cases; absent means every one."
MailboxAttachment:
  type: object
  required: [filename, content_type, size]
  properties:
    filename: {type: string}
    content_type: {type: string}
    size: {type: integer}
MailboxMessage:
  type: object
  description: |
    One message in the connected mailbox that matches the use case's filter (1.6.0), without
    its body or attachment bytes.
  required: [id, sender, subject]
  properties:
    id: {type: string}
    sender: {type: string}
    sender_domain: {type: string, default: ""}
    from_address: {type: string, default: ""}
    subject: {type: string}
    received_at: {type: string, default: ""}
    size: {type: integer, default: 0, description: "Bytes; a listing reads headers only, so attachments are not itemised."}
    attachments:
      type: array
      items:
        $ref: './use-cases.yaml#/MailboxAttachment'
    processed_before:
      type: boolean
      default: false
      description: A live run already carried this message.
CaseStatus:
  type: string
  enum: [untested, pass, fail]
CaseExpected:
  type: object
  description: |
    What a golden case expects (1.6.0) -- the outcome (`created`, or an exception class) and
    header values, authored by accepting a run's output or supplied on upload.
  properties:
    outcome: {type: string}
    extracted:
      type: object
      additionalProperties: true
    line_count: {type: [integer, "null"]}
    sample_id:
      type: string
      description: Set on the curated purchase-order set only.
GoldenCase:
  type: object
  description: |
    A document with what the person expects of it (1.6.0): uploaded, or generated by the
    platform from the template. Re-run whenever the template, guardrails or mapping change;
    `last_status` is the verdict of the last run, `untested` while nothing is expected yet.
  required: [id, use_case_id, label, source, last_status]
  properties:
    id: {type: string}
    use_case_id: {type: string}
    label: {type: string}
    source: {type: string, enum: [uploaded, generated]}
    sender: {type: string, default: ""}
    subject: {type: string, default: ""}
    filename: {type: string, default: document.pdf}
    expected:
      oneOf:
        - $ref: './use-cases.yaml#/CaseExpected'
        - type: "null"
    last_status:
      $ref: './use-cases.yaml#/CaseStatus'
    last_run_id: {type: [string, "null"]}
    last_result:
      type: [object, "null"]
      additionalProperties: true
      description: "The last verdict: outcome, expected outcome, each check, and what the run observed."
    created_at:
      $ref: './common.yaml#/Timestamp'
GoldenCaseWrite:
  type: object
  required: [label, document_b64]
  properties:
    label: {type: string}
    sender:
      type: string
      description: The address the document is treated as sent from; the customer lookup reads its domain.
    subject: {type: string}
    filename: {type: string}
    document_b64: {type: string, description: "A PDF, base64."}
    expected:
      oneOf:
        - $ref: './use-cases.yaml#/CaseExpected'
        - type: "null"

ProbeName:
  type: string
  enum: [mailbox, target, master_data, model, golden, gold, delivery, dry_answer]
ProbeResult:
  type: object
  description: |
    One live connectivity probe (1.6.0): the platform actually opened the thing -- logged into
    the mailbox, took a token from the target, read the master data, sent one call to the
    model, read the golden cases -- and says what it found. Extra fields carry the numbers
    (matching messages, row counts, pass counts).
  additionalProperties: true
  required: [name, passed, reason, elapsed_ms]
  properties:
    name:
      $ref: './use-cases.yaml#/ProbeName'
    passed: {type: boolean}
    reason: {type: string}
    elapsed_ms: {type: integer}

GoldenCaseUpdate:
  type: object
  description: |
    Fields a person may change on a case (1.6.0). Absent fields are left alone; an explicit
    null `expected` clears the expectation.
  properties:
    label: {type: string}
    sender: {type: string}
    subject: {type: string}
    expected:
      oneOf:
        - $ref: './use-cases.yaml#/CaseExpected'
        - type: "null"
AnalyticsSuggestRequest:
  type: object
  required: [question]
  properties:
    question: {type: string, description: "The ask, in the person's own words."}
    recipient: {type: string, description: "A default address when the ask names none."}
AnalyticsFeasibility:
  type: string
  enum: [ready, buildable]
  description: "`ready` when gold holds a row; `buildable` when the first run computes it."
AnalyticsKpiSuggestion:
  type: object
  required: [identifier, name, grain, score, why, feasibility]
  properties:
    identifier: {type: string}
    name: {type: string}
    grain: {type: string}
    business_area: {type: string, nullable: true}
    unit: {type: string}
    score: {type: integer, description: "The lexical match, for ordering; not a probability."}
    why: {type: string, description: "The ask's own words that chose this KPI."}
    feasibility:
      $ref: './use-cases.yaml#/AnalyticsFeasibility'
    latest_as_of: {type: string, format: date, nullable: true}
AnalyticsSuggestion:
  type: object
  required: [kind, title, business_areas, kpis, dimensions, comparison, schedule, outputs, recipients, uncovered, notes]
  properties:
    kind: {type: string, enum: [monitoring, diagnostic], description: "A standing report, or a question about one movement run once and promoted if kept."}
    title: {type: string}
    business_areas: {type: array, items: {type: string}}
    kpis:
      type: array
      items:
        $ref: './use-cases.yaml#/AnalyticsKpiSuggestion'
    dimensions: {type: array, items: {type: string}, description: "The grains the chosen KPIs break down by."}
    comparison: {type: string, enum: [prior_period, prior_year]}
    comparison_reason: {type: string}
    schedule: {type: string, description: "A `ScheduleCadence` value."}
    schedule_reason: {type: string}
    window: {type: [integer, "null"], minimum: 1, description: "Days the numbers cover, when the ask names a period (last week, monthly); null means each KPI's own declared window."}
    outputs: {type: array, items: {type: string, enum: [report, dashboard, alert]}}
    recipients: {type: array, items: {type: string}}
    uncovered: {type: array, items: {type: string}, description: "Words of the ask no registered KPI covers."}
    notes: {type: array, items: {type: string}}
ObjectSuggestRequest:
  type: object
  required: [template]
  properties:
    template:
      $ref: './use-cases.yaml#/ExtractionTemplate'
    description: {type: string, description: "The use case's own words, for the object labels to be read against."}
    target: {type: string, description: "The target system; `salesforce` when absent."}
ObjectSuggestion:
  type: object
  required: [object, label, score, why]
  properties:
    object: {type: string}
    label: {type: string}
    child: {type: [string, "null"], description: "The per-line object, when the template has lines and the target has one."}
    score: {type: integer}
    why: {type: string}
    shipped_mapping: {type: [string, "null"], description: "A shipped mapping's id for exactly this pair, when one exists."}
