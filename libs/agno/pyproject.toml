[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["egpt*"]

[tool.setuptools.package-data]
# The starter definition templates (EGPT-2.8) and the admin console page (EGPT-2.9) ship in the
# wheel: seeding a tenant and authoring an agent are operator tasks, and `pip install egpt` has
# to be enough for them. Without these entries the directories are silently absent from the built
# distribution and only work from a checkout -- for the console that means EgptOS(enable_console=
# True) serves 500s. `console_asset_path().is_file()` in tests/unit/os/test_console_route.py is
# the guard.
egpt = ["py.typed", "registry/templates/*.json", "os/static/console/*.html"]
include = ["LICENSE"]

[tool.pytest.ini_options]
log_cli = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests requiring external services or API keys",
    "system: tests requiring Docker-compose environment",
]

[tool.importlinter]
# Encodes the *integrations boundary* of the allowed-import matrix from
# docs/adr/0001-layered-architecture.md (EGPT-1.1): the matrix's N cells between
# core/orchestration/services/api and integrations. ADR 0001 is authoritative for the matrix
# cells; this config is the enforcement mechanism EGPT-1.11 (aicoe-tracker#52) adds on top of it.
#
# Scope note (deliberately narrower than the full matrix): a first attempt at also encoding the
# matrix's *layer-ordering* cells (core-/services-/orchestration-must-not-import-upward) surfaced
# ~42 additional direct violations that are not toolkit/connector debt like A8/A13, but look like
# deliberate design choices nobody has reconciled with ADR 0001 yet -- e.g. `egpt.run.{agent,base,
# team,workflow}` (core) structurally referencing `egpt.reasoning`/`egpt.workflow` types, the
# `Remote*` wrapper classes (`agent.remote`, `team.remote`, `workflow.remote`, plus `_run`/
# `_telemetry`) coupling orchestration to `egpt.os`/`egpt.client`/`egpt.remote` for HTTP/telemetry,
# and `egpt.eval.*` coupling services to `egpt.api.evals`. Enforcing those cells needs a real
# design decision (or an ADR amendment), not a lint rule -- see aicoe-tracker#180 instead of
# silently masking or arbitrarily deciding it here. This config sticks to the
# integrations boundary, which is what aicoe-tracker#52/#157/#158 actually discuss.
#
# Further scope note: `egpt.db`, `egpt.models`, `egpt.vectordb`, `egpt.knowledge`, `egpt.tools`,
# and (since EGPT-1.7a moved the context connectors into `egpt.integrations.context.*`)
# `egpt.context` all mix a stable core/orchestration interface with dynamically-added concrete
# backend/provider/toolkit/connector shim packages. Those trees already have dedicated AST-based
# guards that handle exactly that granularity (libs/agno/tests/unit/{tools/test_toolkit_layout,
# knowledge/test_knowledge_layout,vectordb/test_backend_layout,db/test_backend_resolution,
# context/test_context_layout,models/...}.py) -- `test_context_layout.py` in particular already
# checks both directions this config would otherwise want to check for `egpt.context`: no
# non-shim `egpt.context.*` module names a concrete `egpt.integrations.context.*` module, and no
# `egpt.integrations.context.*` module names `egpt.agent`/`egpt.team`/`egpt.workflow` (the exact
# edge the `RunnableLike` protocol + `construct_runnable` seam in `egpt/registry/protocols.py` /
# `egpt/run/utils.py` exists to close). Hand-listing every shim subdirectory here would duplicate
# those guards and go stale on every new extra or connector, so this config's source_modules list
# the packages that are NOT already covered that way. `egpt.memory` joined this family HALFWAY
# (EGPT-1.7c follow-up, aicoe-tracker#180): its substrate backends live under
# `egpt.integrations.memory` and must import its envelope types, so it left the second
# contract's forbidden_modules in favor of `tests/unit/memory/test_memory_layout.py` (which
# names the exact importable type island) -- but it STAYS in the first contract's
# source_modules, because unlike the trees above it contains no backend shims, so the inward
# "must not import integrations" direction loses nothing by staying lint-enforced.
# `egpt.cloud` has no `__init__.py` today
# (only `cloud/aws/`, which is provider-specific and arguably belongs in integrations per ADR
# 0001's own module mapping) and isn't an importable package yet -- out of scope.
#
# `egpt.container`, `egpt.providers`, `egpt.settings` postdate ADR 0001's inventory and are not
# yet classified in the matrix -- but unlike `egpt.cloud`/the mixed trees above, they ARE
# included below (in both contracts' module lists), specifically because `allow_indirect_imports
# = true` makes an *excluded* module an undetectable stepping-stone: with direct-imports-only
# checking, a chain like `egpt.agent -> egpt.container -> egpt.integrations.X` is invisible
# unless `egpt.container` is itself a listed module, since neither hop is checked on its own.
# `egpt.os` already imports `egpt.container`, `egpt.memory` already imports `egpt.providers`, and
# `egpt.api`/`egpt.os`/`egpt.registry` already import `egpt.settings` in production code, so
# leaving these three off the list would leave a real, silently-exploitable gap rather than a
# hypothetical one. Including them here closes the detection gap without prejudging their formal
# ADR layer classification, which is still pending.
root_package = "egpt"

# --- Integrations column (matrix's N cells for core/orchestration/services/api -> integrations) ---
# `egpt.integrations` is a single entry that covers the whole tree regardless of how many backend/
# provider/toolkit shim subdirectories it grows. The handful of still-loose modules below are
# physically outside `egpt/integrations/` but are integrations-layer code per ADR 0001's module
# mapping (provider utils "move with their providers" -- extraction prerequisite #3 -- and
# `tracing/exporter.py` is listed under the integrations layer).
#
# No `ignore_imports` for layering debt: the tracked-debt ledger is retired. The last family
# (memory-substrate) was cleared by EGPT-1.7c / aicoe-tracker#180, after A8's context
# connectors (EGPT-1.7a / aicoe-tracker#157) and A13's Slack channel adapters (EGPT-1.7b /
# aicoe-tracker#158) -- these contracts now hold with zero violations, and
# libs/agno/tests/unit/test_import_linter_contracts.py asserts exactly that. ignore_imports
# below is reserved for the ADR-ratified composition-root / extraction-prerequisite
# carve-outs only. The one deliberate scope change from the debt era: `egpt.memory` is absent
# from the second contract's forbidden_modules, and its outward boundary is guarded with
# module-level precision by libs/agno/tests/unit/memory/test_memory_layout.py instead (see
# the inline note on that list).
#
# allow_indirect_imports = true: "forbidden" contracts check the whole transitive dependency
# chain by default, which floods the report with reachability noise unrelated to a real
# violation here -- e.g. `egpt.exceptions` (a single-file core module) transitively "reaches"
# `egpt.integrations` only because something several hops away happens to import a concrete
# provider, with nothing at any single hop being a real ADR 0001 violation on its own. Scoping to
# direct imports is in the same *spirit* as this repo's existing layout guards
# (libs/agno/tests/unit/_layer_guards.py's `imported_modules()` walks each file's own AST for its
# own import statements, not the whole reachable graph) -- but it is NOT equivalent coverage:
# those guards `rglob` every `.py` file under `egpt/`, while this config only checks the curated
# `source_modules` list below. A module left off that list (and not itself a shim already covered
# by another guard) is invisible to this contract even for its own direct imports -- see the
# `egpt.container`/`egpt.providers`/`egpt.settings` note above for why those three are included
# despite not being ADR-classified yet, and why leaving a module off this list is a real gap, not
# a neutral omission.
[[tool.importlinter.contracts]]
name = "core, orchestration, services, and api must not import integrations"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "egpt.run",
    "egpt.session",
    "egpt.approval",
    "egpt.registry",
    "egpt.exceptions",
    "egpt.filters",
    "egpt.media",
    "egpt.metrics",
    "egpt.brand",
    "egpt.debug",
    "egpt.agent",
    "egpt.agents",
    "egpt.team",
    "egpt.workflow",
    "egpt.reasoning",
    "egpt.hooks",
    "egpt.components",
    "egpt.eval",
    "egpt.learn",
    "egpt.memory",
    "egpt.culture",
    "egpt.skills",
    "egpt.scheduler",
    "egpt.compression",
    "egpt.factory",
    "egpt.guardrails",
    "egpt.os",
    "egpt.api",
    "egpt.client",
    "egpt.remote",
    "egpt.container",
    "egpt.providers",
    "egpt.settings",
]
forbidden_modules = [
    "egpt.integrations",
    "egpt.utils.gemini",
    "egpt.utils.openai",
    "egpt.utils.mcp",
    "egpt.utils.streamlit",
    "egpt.utils.models",
    "egpt.tracing.exporter",
]
ignore_imports = [
    # A12: os/mcp.py owns the built-in MCP tool surface and wires the extracted registrar --
    # the composition root ADR 0001 rule 4 carves out. Ratified; tracked in
    # tests/unit/tools/test_toolkit_layout.py's _INTEGRATION_IMPORT_ALLOWLIST.
    "egpt.os.mcp -> egpt.integrations.tools.mcp.server",
    # Rule 4 composition root: the AgentOS knowledge router builds remote-content configs
    # straight from request payloads, for every supported remote-content backend. Ratified;
    # tracked in tests/unit/knowledge/test_knowledge_layout.py's _INTEGRATION_IMPORT_ALLOWLIST.
    "egpt.os.routers.knowledge.knowledge -> egpt.integrations.knowledge.remote_content.s3",
    "egpt.os.routers.knowledge.knowledge -> egpt.integrations.knowledge.remote_content.github",
    # Rule 4 composition root, EGPT-1.7b (aicoe-tracker#158): the thin Whatsapp BaseInterface
    # subclass stays in egpt.os and wires the moved channel-adapter router. Ratified; tracked
    # in tests/unit/os/interfaces/test_channels_layout.py.
    "egpt.os.interfaces.whatsapp.whatsapp -> egpt.integrations.channels.whatsapp.router",
    # EGPT-1.7b deprecation shims: egpt/os/interfaces/whatsapp/{router,helpers,security}.py
    # are `from <target> import *` shims left at the old path so existing imports keep
    # resolving (see each file's docstring). Temporary -- removed along with the shims once
    # the deprecation period ends. Guarded by test_channels_layout.py, not silently masked.
    "egpt.os.interfaces.whatsapp.router -> egpt.integrations.channels.whatsapp.router",
    "egpt.os.interfaces.whatsapp.helpers -> egpt.integrations.channels.whatsapp.helpers",
    "egpt.os.interfaces.whatsapp.security -> egpt.integrations.channels.whatsapp.security",
    # Rule 4 composition root, EGPT-1.7b (aicoe-tracker#158): the thin Slack BaseInterface
    # subclass stays in egpt.os and wires the moved channel-adapter router. Ratified; tracked
    # in tests/unit/os/interfaces/test_channels_layout.py.
    "egpt.os.interfaces.slack.slack -> egpt.integrations.channels.slack.router",
    # EGPT-1.7b deprecation shims: egpt/os/interfaces/slack/{router,event_handler,hitl,events,
    # builders,components,helpers,ids,interactions,pause,security,state,types}.py are
    # `from <target> import *` shims left at the old path so existing imports keep resolving
    # (see each file's docstring). Temporary -- removed along with the shims once the
    # deprecation period ends. Guarded by test_channels_layout.py, not silently masked.
    "egpt.os.interfaces.slack.router -> egpt.integrations.channels.slack.router",
    "egpt.os.interfaces.slack.event_handler -> egpt.integrations.channels.slack.event_handler",
    "egpt.os.interfaces.slack.hitl -> egpt.integrations.channels.slack.hitl",
    "egpt.os.interfaces.slack.events -> egpt.integrations.channels.slack.events",
    "egpt.os.interfaces.slack.builders -> egpt.integrations.channels.slack.builders",
    "egpt.os.interfaces.slack.components -> egpt.integrations.channels.slack.components",
    "egpt.os.interfaces.slack.helpers -> egpt.integrations.channels.slack.helpers",
    "egpt.os.interfaces.slack.ids -> egpt.integrations.channels.slack.ids",
    "egpt.os.interfaces.slack.interactions -> egpt.integrations.channels.slack.interactions",
    "egpt.os.interfaces.slack.pause -> egpt.integrations.channels.slack.pause",
    "egpt.os.interfaces.slack.security -> egpt.integrations.channels.slack.security",
    "egpt.os.interfaces.slack.state -> egpt.integrations.channels.slack.state",
    "egpt.os.interfaces.slack.types -> egpt.integrations.channels.slack.types",
]

# --- Integrations depend only on core (matrix: integrations -> orchestration/services/api = N) ---
[[tool.importlinter.contracts]]
name = "integrations must not import orchestration, services, or api"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "egpt.integrations",
]
forbidden_modules = [
    "egpt.agent",
    "egpt.agents",
    "egpt.team",
    "egpt.workflow",
    "egpt.reasoning",
    "egpt.hooks",
    "egpt.components",
    "egpt.eval",
    "egpt.learn",
    # egpt.memory is deliberately absent (EGPT-1.7c follow-up, aicoe-tracker#180): substrate
    # backends under egpt.integrations.memory implement egpt.memory's ports, so they must
    # import its envelope types -- the same interface-vs-backend mix that keeps egpt.db/
    # egpt.vectordb/egpt.knowledge out of these lists. The outward direction is guarded with
    # module-level precision by libs/agno/tests/unit/memory/test_memory_layout.py (only the
    # named type island is importable from integrations); the inward direction (egpt.memory
    # must not import integrations) stays enforced by the first contract, since egpt.memory
    # stays in its source_modules and contains no backend shims of its own.
    "egpt.culture",
    "egpt.skills",
    "egpt.scheduler",
    "egpt.compression",
    "egpt.factory",
    "egpt.guardrails",
    "egpt.os",
    "egpt.api",
    "egpt.client",
    "egpt.remote",
    "egpt.container",
    "egpt.providers",
    "egpt.settings",
]
ignore_imports = [
    # EGPT-1.7b (aicoe-tracker#158): egpt.settings is a leaf, dependency-free config module
    # (typed env-var resolution only -- see its own module docstring) that is listed as
    # forbidden here purely as the "egpt.container/providers/settings" indirect-chain
    # detection safeguard described in this section's header comment, not because a channel
    # adapter reading its own webhook secret via `resolve()` is an actual layering violation.
    # `egpt.integrations.channels.whatsapp.security` reads `whatsapp_app_secret`/
    # `whatsapp_skip_signature_validation`; `.helpers` reads `whatsapp_verify_token` -- exactly
    # the "inbound-webhook verification secrets" egpt.settings' docstring says it exists for.
    "egpt.integrations.channels.whatsapp.helpers -> egpt.settings",
    "egpt.integrations.channels.whatsapp.security -> egpt.settings",
    # Same reasoning, Slack's half of EGPT-1.7b: egpt.integrations.channels.slack.security
    # reads `slack_signing_secret` to verify inbound Slack request signatures.
    "egpt.integrations.channels.slack.security -> egpt.settings",
]
# Otherwise no ignore_imports: the toolkit/model-provider modules that used to import
# egpt.agent/egpt.team directly were retyped against egpt.registry.protocols, and the
# memory-substrate family was resolved by moving its shared types to the island guarded by
# libs/agno/tests/unit/memory/test_memory_layout.py (both EGPT-1.7c / aicoe-tracker#180).
# This contract reports zero violations, and
# libs/agno/tests/unit/test_import_linter_contracts.py keeps it that way.

# --- No import cycles across the integrations boundary (ADR 0001 Rule 7, scoped to this config) ---
# Not encoded as a separate "independence" contract: that type enforces *mutual* exclusion in
# both directions, which would also forbid the matrix's legitimate inward imports (e.g.
# integrations -> core). Instead, cycle-freedom across the integrations boundary falls out of the
# two "forbidden" contracts above: core/orchestration/services/api -> integrations and
# integrations -> orchestration/services/api are both forbidden, so no directed cycle crossing
# that boundary can form. This config does not attempt Rule 7 for the layer-ordering cells
# (core/orchestration/services/api relative to each other) -- see the scope note above.

[tool.ruff]
line-length = 120
target-version = "py39"
# Ignore `F401` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
disable_error_code = ["override"]
plugins = ["pydantic.mypy"]
exclude = ["tests*"]

