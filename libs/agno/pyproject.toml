[project]
name = "egpt"
version = "0.2.0"
description = "The programming language for agentic software."
requires-python = ">=3.9,<4"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  {name = "Saturam Inc"}
]
keywords = ["egpt", "egptos", "agents"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "docstring-parser",
  # Prevent the request-smuggling CVE in h11 < 0.16
  "h11>=0.16.0",
  "httpx[http2]",
  "packaging",
  "pydantic-settings",
  "pydantic",
  "pyyaml",
  "rich",
  "typing-extensions",
]

[project.optional-dependencies]
dev = [
  "mypy==2.1.0",
  "ruff==0.15.20",
  "import-linter==2.13",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  # Implements -n/--dist: the unit suite is ~10k tests and ran serially in CI.
  "pytest-xdist==3.8.0",
  # Implements --timeout and @pytest.mark.timeout(N). Also listed under
  # integration-tests; the unit run needs it too, to bound a wedged test.
  "pytest-timeout",
  "timeout-decorator",
  "types-pyyaml",
  "types-aiofiles",
  "fastapi",
