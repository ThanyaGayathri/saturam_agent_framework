[project]
name = "egpt-infra"
version = "0.1.0"
description = "The programming language for agentic infrastructure"
requires-python = ">=3.7,<4"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  {name = "Ashpreet Bedi", email = "ashpreet@agno.com"}
]
keywords = [
  "aws",
  "docker",
  "infrastructure",
]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
  "gitpython",
  "httpx",
  "python-dotenv",
  "python-multipart",
  "pydantic-settings",
  "pydantic",
  "rich",
  "tomli",
  "typer",
  "typing-extensions",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "ruff==0.14.3",
  "pytest",
  "pytest-asyncio",
]

# Dependencies for Docker
docker = ["docker"]

# Dependencies for AWS
aws = ["boto3"]


[project.urls]
homepage = "https://agno.com"
documentation = "https://docs.agno.com"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
# Shared egpt.* namespace with libs/agno: do NOT ship a top-level egpt/__init__.py
# or egpt/py.typed here (those belong to the egpt distribution only).
namespaces = true
include = ["egpt*"]

[tool.setuptools.package-data]
include = ["LICENSE"]

[tool.pytest.ini_options]
log_cli = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = "tests"

[tool.ruff]
line-length = 120
target-version = "py39"
# Ignore `F401` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
disable_error_code = ["override"]
plugins = ["pydantic.mypy"]
exclude = ["tests*"]
# egpt/ has no __init__.py (PEP 420 namespace shared with the egpt dist). Without
# these, `mypy libs/agno_infra` mis-maps egpt/docker -> top-level "docker".
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "egpt.*",
  "boto3",
  "boto3.*",
  "botocore",
  "botocore.*",
  "docker",
  "docker.*",
  "git",
  "git.*",
  "tomllib",
  "tomllib.*",
  "yaml",
  "yaml.*",
  "tomli",
  "tomli.*",
]
ignore_missing_imports = true
