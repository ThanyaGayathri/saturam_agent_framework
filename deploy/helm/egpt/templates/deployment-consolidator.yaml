{{- include "egpt.consolidatorGuard" . }}
# One per customer. `replicas: 1` is hardcoded with no value behind it, and `Recreate` matters:
# the default RollingUpdate briefly runs two consolidators on every upgrade. The entrypoint's
# advisory lock is what turns "one" into a refusal; this is the chart making the mistake hard.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-consolidator
  labels: {{- include "egpt.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-consolidator
    role: consolidator
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ .Release.Name }}-consolidator}}
  template:
    metadata:
      labels: {{- include "egpt.labels" . | nindent 8 }}
        app: {{ .Release.Name }}-consolidator
        role: consolidator
    spec:
      terminationGracePeriodSeconds: {{ .Values.consolidator.terminationGracePeriodSeconds }}
      containers:
        - name: consolidator
          image: {{ include "egpt.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["consolidator"]
          {{- include "egpt.envFrom" . | nindent 10 }}
          resources: {{- toYaml .Values.consolidator.resources | nindent 12 }}
