apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels: {{- include "egpt.labels" . | nindent 4 }}
data:
  EGPT_RETAIL_DB_URL: {{ .Values.database.url | quote }}
  EGPT_RETAIL_DB_DIRECT_URL: {{ .Values.database.directUrl | quote }}
  EGPT_RETAIL_WAREHOUSE_DB_URL: {{ .Values.database.warehouseUrl | quote }}
  EGPT_RETAIL_WAREHOUSE_READONLY_DB_URL: {{ .Values.database.warehouseReadonlyUrl | quote }}
  EGPT_RETAIL_CUSTOMER_SLUG: {{ .Values.customerSlug | quote }}
  # The ontology / semantic-layer graph (D11). Read by load-knowledge, harvest, and from P3 by
  # the api and pipelines pods (K5's reader, R5's feasibility, R9's gap check). These settings
  # have existed since K1 and no template mapped them -- a fresh cluster's load-knowledge hook
  # would have refused at startup on a missing password. Password is in the Secret.
  EGPT_RETAIL_NEO4J_URI: {{ .Values.neo4j.ontologyUri | quote }}
  EGPT_RETAIL_NEO4J_USER: {{ .Values.neo4j.user | quote }}
  EGPT_RETAIL_NEO4J_DATABASE: {{ .Values.neo4j.databases.ontology | quote }}
  EGPT_RETAIL_PROVIDER_MODE: {{ .Values.model.providerMode | quote }}
  # K1 memory's vector substrate (AZ-B). Read by the api, pipelines and consolidator pods; the
  # api key is in the Secret. An azure_ai_search backend with an empty endpoint is refused by
  # the memory lifespan at boot, naming EGPT_RETAIL_MEMORY_SEARCH_ENDPOINT.
  EGPT_RETAIL_MEMORY_BACKEND: {{ .Values.memory.backend | quote }}
  EGPT_RETAIL_MEMORY_SEARCH_ENDPOINT: {{ .Values.search.endpoint | default "" | quote }}
  EGPT_RETAIL_MEMORY_SEARCH_INDEX: {{ .Values.search.memoryIndex | quote }}
  # K2 knowledge prose's vector store (AZ-C): the same Azure AI Search service and key as
  # memory, a separate index. Read by load-knowledge, suggest and the api. An azure_ai_search
  # backend with an empty endpoint is refused at point of use, naming
  # EGPT_RETAIL_KNOWLEDGE_SEARCH_ENDPOINT.
  EGPT_RETAIL_KNOWLEDGE_BACKEND: {{ .Values.knowledge.backend | quote }}
  EGPT_RETAIL_KNOWLEDGE_SEARCH_ENDPOINT: {{ .Values.search.endpoint | default "" | quote }}
  EGPT_RETAIL_KNOWLEDGE_SEARCH_INDEX: {{ .Values.search.knowledgeIndex | quote }}
  # R4's raw drop. Credentials live in the Secret, never here.
  EGPT_RETAIL_STORAGE_PROVIDER: {{ .Values.storage.provider | quote }}
  EGPT_RETAIL_STORAGE_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  EGPT_RETAIL_STORAGE_CONTAINER: {{ .Values.storage.container | quote }}
  EGPT_RETAIL_STORAGE_PREFIX: {{ .Values.storage.prefix | default "" | quote }}
  EGPT_RETAIL_AZURE_DEPLOYMENT: {{ .Values.model.azureDeployment | quote }}
  EGPT_RETAIL_CONSOLIDATION_POLL_INTERVAL: {{ .Values.consolidator.pollInterval | quote }}
  EGPT_RETAIL_SCHEDULER_BASE_URL: "http://{{ .Release.Name }}-pipelines:{{ .Values.api.port }}"
  EGPT_AGENT_OS_HOST: "0.0.0.0"
  EGPT_AGENT_OS_PORT: {{ .Values.api.port | quote }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.model.azureEndpoint | quote }}
  AZURE_EMBEDDER_OPENAI_ENDPOINT: {{ .Values.model.azureEndpoint | quote }}
  AZURE_EMBEDDER_DEPLOYMENT: {{ .Values.model.embedderDeployment | quote }}
  {{- if .Values.auth.enabled }}
  EGPT_RETAIL_AUTH_JWKS_FILE: /etc/egpt/jwks/jwks.json
  EGPT_RETAIL_AUTH_AUDIENCE: {{ .Values.auth.audience | quote }}
  {{- end }}
{{- if .Values.auth.enabled }}
{{- include "egpt.authGuard" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-jwks
  labels: {{- include "egpt.labels" . | nindent 4 }}
data:
  jwks.json: |-
{{ .Values.auth.jwks | indent 4 }}
{{- end }}
