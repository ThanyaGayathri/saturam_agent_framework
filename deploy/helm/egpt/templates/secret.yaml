{{- if eq .Values.secrets.provider "kubernetes" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "egpt.labels" . | nindent 4 }}
type: Opaque
stringData:
  EGPT_RETAIL_INTERNAL_SERVICE_TOKEN: {{ .Values.secrets.values.internalServiceToken | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.values.azureOpenAIApiKey | quote }}
  AZURE_EMBEDDER_OPENAI_API_KEY: {{ .Values.secrets.values.azureEmbedderApiKey | quote }}
  {{- if .Values.secrets.values.neo4jPassword }}
  EGPT_RETAIL_NEO4J_PASSWORD: {{ .Values.secrets.values.neo4jPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.values.searchApiKey }}
  EGPT_RETAIL_MEMORY_SEARCH_API_KEY: {{ .Values.secrets.values.searchApiKey | quote }}
  EGPT_RETAIL_KNOWLEDGE_SEARCH_API_KEY: {{ .Values.secrets.values.searchApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.values.storageAccessKey }}
  EGPT_RETAIL_STORAGE_ACCESS_KEY: {{ .Values.secrets.values.storageAccessKey | quote }}
  EGPT_RETAIL_STORAGE_SECRET_KEY: {{ .Values.secrets.values.storageSecretKey | quote }}
  {{- end }}
{{- else if eq .Values.secrets.provider "keyVault" }}
# NEVER EXECUTED. The Secrets Store CSI driver syncs Key Vault secrets into a Kubernetes Secret
# of the same name the pods already reference, so nothing else in the chart changes on AKS day.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-keyvault
  labels: {{- include "egpt.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Release.Name }}-secrets
      type: Opaque
      data:
        - {objectName: egpt-internal-service-token, key: EGPT_RETAIL_INTERNAL_SERVICE_TOKEN}
        - {objectName: azure-openai-api-key, key: AZURE_OPENAI_API_KEY}
        - {objectName: azure-embedder-api-key, key: AZURE_EMBEDDER_OPENAI_API_KEY}
        - {objectName: neo4j-password, key: EGPT_RETAIL_NEO4J_PASSWORD}
        - {objectName: search-api-key, key: EGPT_RETAIL_MEMORY_SEARCH_API_KEY}
        - {objectName: search-api-key, key: EGPT_RETAIL_KNOWLEDGE_SEARCH_API_KEY}
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.secrets.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.secrets.keyVault.name | quote }}
    tenantId: {{ .Values.secrets.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: egpt-internal-service-token
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
        - |
          objectName: azure-embedder-api-key
          objectType: secret
        - |
          objectName: neo4j-password
          objectType: secret
        - |
          objectName: search-api-key
          objectType: secret
{{- else }}
{{- fail (printf "secrets.provider must be kubernetes or keyVault, got %q" .Values.secrets.provider) }}
{{- end }}
