apiVersion: v1
kind: ConfigMap
metadata:
  name: egpt-postgres-init
data:
  01-warehouse.sql: |
    CREATE DATABASE {{ .Values.postgres.warehouseDatabase }} OWNER {{ .Values.postgres.user }};
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egpt-postgres
  labels: {app: egpt-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: egpt-postgres}}
  template:
    metadata: {labels: {app: egpt-postgres}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432, name: pg}]
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: [pg_isready, -U, {{ .Values.postgres.user | quote }}, -d, {{ .Values.postgres.database | quote }}]}
            periodSeconds: 3
      volumes:
        - name: init
          configMap: {name: egpt-postgres-init}
        - name: data
          emptyDir: {}     # verification cluster: data does not outlive the pod, by design
---
apiVersion: v1
kind: Service
metadata:
  name: egpt-postgres
spec:
  selector: {app: egpt-postgres}
  ports: [{port: 5432, targetPort: pg, name: pg}]
