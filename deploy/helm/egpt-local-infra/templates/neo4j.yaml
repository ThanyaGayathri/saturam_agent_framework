{{- if .Values.neo4j.enabled }}
{{- range .Values.neo4j.instances }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egpt-neo4j-{{ . }}
  labels: {app: egpt-neo4j-{{ . }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: egpt-neo4j-{{ . }}}}
  template:
    metadata: {labels: {app: egpt-neo4j-{{ . }}}}
    spec:
      containers:
        - name: neo4j
          image: {{ $.Values.neo4j.image }}
          env:
            - {name: NEO4J_AUTH, value: "neo4j/{{ $.Values.neo4j.password }}"}
          ports:
            - {containerPort: 7687, name: bolt}
            - {containerPort: 7474, name: http}
          readinessProbe:
            tcpSocket: {port: bolt}
            periodSeconds: 5
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: egpt-neo4j-{{ . }}
spec:
  selector: {app: egpt-neo4j-{{ . }}}
  ports:
    - {port: 7687, targetPort: bolt, name: bolt}
    - {port: 7474, targetPort: http, name: http}
---
{{- end }}
{{- end }}
