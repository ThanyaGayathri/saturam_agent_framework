{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egpt-redis
  labels: {app: egpt-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: egpt-redis}}
  template:
    metadata: {labels: {app: egpt-redis}}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{containerPort: 6379, name: redis}]
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: egpt-redis
spec:
  selector: {app: egpt-redis}
  ports: [{port: 6379, targetPort: redis, name: redis}]
{{- end }}
