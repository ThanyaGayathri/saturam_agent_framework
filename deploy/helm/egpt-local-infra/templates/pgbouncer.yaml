{{- if .Values.pgbouncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egpt-pgbouncer
  labels: {app: egpt-pgbouncer}
spec:
  replicas: 1
  selector: {matchLabels: {app: egpt-pgbouncer}}
  template:
    metadata: {labels: {app: egpt-pgbouncer}}
    spec:
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image }}
          env:
            - {name: DB_HOST, value: egpt-postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_USER, value: {{ .Values.postgres.user | quote }}}
            - {name: DB_PASSWORD, value: {{ .Values.postgres.password | quote }}}
            - {name: AUTH_TYPE, value: scram-sha-256}
            - {name: POOL_MODE, value: {{ .Values.pgbouncer.poolMode | quote }}}
            - {name: MAX_CLIENT_CONN, value: {{ .Values.pgbouncer.maxClientConn | quote }}}
            - {name: DEFAULT_POOL_SIZE, value: {{ .Values.pgbouncer.defaultPoolSize | quote }}}
          ports: [{containerPort: 5432, name: pg}]
          readinessProbe:
            tcpSocket: {port: pg}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: egpt-pgbouncer
spec:
  selector: {app: egpt-pgbouncer}
  ports: [{port: 5432, targetPort: pg, name: pg}]
{{- end }}
