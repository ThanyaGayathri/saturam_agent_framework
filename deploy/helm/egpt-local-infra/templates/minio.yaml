{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egpt-minio
  labels: {app: egpt-minio}
spec:
  replicas: 1
  selector: {matchLabels: {app: egpt-minio}}
  template:
    metadata: {labels: {app: egpt-minio}}
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: [server, /data, --console-address, ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: {{ .Values.minio.rootUser | quote }}}
            - {name: MINIO_ROOT_PASSWORD, value: {{ .Values.minio.rootPassword | quote }}}
          ports:
            - {containerPort: 9000, name: s3}
            - {containerPort: 9001, name: console}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: egpt-minio
spec:
  selector: {app: egpt-minio}
  ports:
    - {port: 9000, targetPort: s3, name: s3}
    - {port: 9001, targetPort: console, name: console}
{{- end }}
