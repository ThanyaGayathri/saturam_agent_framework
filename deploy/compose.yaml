# The local stack R1's verification runs against. Postgres is the only service the default
# profile starts; Neo4j and Redis sit behind `--profile full` for the phases that need them.
#
#     egpt up -f deploy/compose.yaml            # or: docker compose -f deploy/compose.yaml up --build
#     docker compose -f deploy/compose.yaml --profile full up
#
# Host port 5532 for Postgres is deliberate: every cookbook and the integration CI use it.
# The `migrate` service runs once; `api` waits for it to complete, so a fresh stack comes up
# with the schema in place the same way a fresh namespace does under the Helm hook Job (R2).
# On a clean database it does real work (creates the memory-tier tables and stamps versions);
# every later run skips.

name: egpt-retail

services:
  postgres:
    image: agnohq/pgvector:18
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      PGDATA: /var/lib/postgresql
    ports:
      - "5532:5432"
    volumes:
      - egpt-pg:/var/lib/postgresql
      # Creates the separate warehouse database (D5) on first start.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: egpt-retail:dev
    command: ["migrate"]
    environment:
      EGPT_RETAIL_DB_URL: postgresql+psycopg://ai:ai@postgres:5432/ai
    depends_on:
      postgres:
        condition: service_healthy

  # R4's warehouse schema (landing, silver, quality). Separate from `migrate`, which is the
  # control plane's: on AKS these are different servers with different credentials, and the
  # control-plane migration is a pre-install hook that gates the whole release.
  warehouse-migrate:
    image: egpt-retail:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["warehouse-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EGPT_RETAIL_WAREHOUSE_DB_URL: postgresql+psycopg://ai:ai@postgres:5432/egpt_warehouse
    restart: "no"

  api:
    image: egpt-retail:dev
    command: ["api"]
    environment:
      EGPT_RETAIL_ROLE: api
      EGPT_RETAIL_DB_URL: postgresql+psycopg://ai:ai@postgres:5432/ai
      EGPT_RETAIL_WAREHOUSE_DB_URL: postgresql+psycopg://ai:ai@postgres:5432/egpt_warehouse
      # R6's SQL guard sits above this connection, authenticated as the read-only egpt_reader
      # role (warehouse/sql/ddl/065_readonly_role.sql, created by warehouse-migrate) rather
      # than the ai writer above.
      EGPT_RETAIL_WAREHOUSE_READONLY_DB_URL: postgresql+psycopg://egpt_reader:egpt_reader@postgres:5432/egpt_warehouse
      # R4 reads the raw drop from the compose MinIO (profile `full`). Unset provider is
      # refused at the point of use rather than defaulting to an empty directory.
      EGPT_RETAIL_STORAGE_PROVIDER: s3
      EGPT_RETAIL_STORAGE_ENDPOINT: http://minio:9000
      EGPT_RETAIL_STORAGE_CONTAINER: egpt-landing
      EGPT_RETAIL_STORAGE_ACCESS_KEY: minioadmin
      EGPT_RETAIL_STORAGE_SECRET_KEY: minioadmin
      EGPT_RETAIL_CUSTOMER_SLUG: ${EGPT_RETAIL_CUSTOMER_SLUG:-}
      # K1 memory vectors stay in the compose Postgres. The setting's default is
      # azure_ai_search (AZ-B) and refuses at startup without a service endpoint, so the
      # local option is named explicitly here rather than inherited.
      EGPT_RETAIL_MEMORY_BACKEND: pgvector
      EGPT_RETAIL_KNOWLEDGE_BACKEND: pgvector
      EGPT_AGENT_OS_HOST: 0.0.0.0
      EGPT_AGENT_OS_PORT: "7777"
    ports:
      # Host port is configurable: a developer often has a local EgptOS on 7777 already.
      - "${EGPT_RETAIL_API_PORT:-7777}:7777"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  consolidator:
    image: egpt-retail:dev
    command: ["consolidator"]
    environment:
      EGPT_RETAIL_DB_URL: postgresql+psycopg://ai:ai@postgres:5432/ai
      EGPT_RETAIL_CUSTOMER_SLUG: ${EGPT_RETAIL_CUSTOMER_SLUG:-}
      EGPT_RETAIL_MEMORY_BACKEND: pgvector   # same store as the api service, see above
      EGPT_RETAIL_KNOWLEDGE_BACKEND: pgvector
      EGPT_RETAIL_CONSOLIDATION_POLL_INTERVAL: "300"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # One per customer: the entrypoint holds a Postgres advisory lock and a second instance exits 3.
    deploy:
      replicas: 1

  neo4j:
    profiles: ["full"]
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    # Stands in for Azure ADLS Gen2 (D4) locally -- the same role it plays in R2's kind
    # cluster local-infra chart, reusing that chart's `egpt-landing` bucket name. C1's
    # verification (cookbook/94_retail/C01_minio_roundtrip.sh) is the only current consumer;
    # the real connectors (C2-C4) target Azure, not this.
    profiles: ["full"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - egpt-minio:/data

volumes:
  egpt-pg:
  egpt-minio:
