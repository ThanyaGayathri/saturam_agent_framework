# The local verification cluster for R2. One control plane, one worker, no ingress controller:
# the evidence needs in-cluster curl and `kubectl port-forward` at most.
#
#     kind create cluster --name egpt --config deploy/kind/cluster.yaml
#     kind load docker-image egpt-retail:dev --name egpt
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: egpt
nodes:
  - role: control-plane
  - role: worker
